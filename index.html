e vigilance, exemples.\u003c/p>\n\u003cp>Il est recommandé de construire des fiches personnelles (définitions + schéma + exemple + erreur fréquente) et de s'entraîner à reformuler sans recopier le cours.\u003c/p>\n\n\u003ch3>5. Méthodes et démarches\u003c/h3>\n\u003col>\n\u003cli>Analyser la situation (données, contraintes, objectif).\u003c/li>\n\u003cli>Identifier les règles, produits ou procédures applicables.\u003c/li>\n\u003cli>Appliquer la méthode étape par étape en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence (réglementation, calcul, sens métier).\u003c/li>\n\u003cli>Communiquer le résultat de façon claire au client ou au collègue.\u003c/li>\n\u003c/ol>\n\n\u003ch3>6. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations types incluent : accueil d'un client, analyse d'un besoin, proposition d'une solution, traitement d'un dossier, gestion d'une réclamation, respect d'une obligation légale. L'étudiant doit s'entraîner à argumenter ses choix.\u003c/p>\n\n\u003ch3>7. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des produits, régimes ou procédures proches.\u003c/li>\n\u003cli>Omettre une étape obligatoire (information, recueil de consentement, contrôle).\u003c/li>\n\u003cli>Donner une réponse purement théorique sans ancrage métier.\u003c/li>\n\u003cli>Négliger le vocabulaire officiel (textes, grilles d'évaluation).\u003c/li>\n\u003c/ul>\n\n\u003ch3>8. Synthèse\u003c/h3>\n\u003cp>Maîtriser Assurance de biens et responsabilité, c'est savoir définir, appliquer une méthode, justifier un choix et communiquer professionnellement. L'entraînement régulier sur des cas et des annales est indispensable.\u003c/p>\n\u003cdiv class=\"memo\">\u003cstrong>À retenir\u003c/strong> — Vocabulaire précis · Méthode structurée · Lien avec le métier · Conformité réglementaire · Entraînement aux épreuves.\u003c/div>\n\u003cdiv class=\"memo\">\u003cstrong>Conseils examen\u003c/strong> — Lire le sujet en entier · Repérer les mots-clés · Structurer la réponse · Justifier · Soigner la forme.\u003c/div>\n", "resume": ["Chapitre Assurance de biens et responsabilité (Produits et contrats) : notions du référentiel BTS.", "Savoir définir, appliquer une méthode et justifier un choix professionnel.", "Relier chaque notion à une situation concrète du métier.", "Éviter les confusions de vocabulaire et les oublis de procédure."], "points_cles": ["Assurance de biens et responsabilité", "Produits et contrats", "Définitions", "Méthode", "Cas professionnel", "Réglementation", "Examen", "Franchise", "Garantie", "MRH", "Auto", "RC"], "exercices": [{"question": "Définir en une phrase précise la notion centrale de « Assurance de biens et responsabilité ».", "correction": "Reprendre la définition du cours en y ajoutant un élément de contexte professionnel."}, {"question": "Citer trois enjeux professionnels liés à ce chapitre.", "correction": "Ex. : conformité, qualité de service, maîtrise des risques, satisfaction client, rigueur documentaire."}, {"question": "Proposer une méthode en 5 étapes pour traiter une situation type.", "correction": "Analyser → Identifier les règles/produits → Appliquer → Vérifier → Communiquer."}, {"question": "Donner un exemple de situation client et la conduite à tenir.", "correction": "Décrire le contexte, les questions à poser, la solution proposée et les points de vigilance."}, {"question": "Quelles erreurs fréquentes faut-il éviter ? Comment les détecter ?", "correction": "Voir section erreurs du cours ; proposer un contrôle (check-list, relecture, validation)."}, {"question": "Quels documents ou outils professionnels sont mobilisés ?", "correction": "Selon le domaine : contrats, grilles, logiciels, normes, fiches produits, procédures internes."}, {"question": "Rédiger une synthèse de 8 à 10 lignes utilisable en révision.", "correction": "Structurer : définitions → principes → méthode → points de vigilance."}, {"question": "Préparer un oral de 3 minutes sur ce thème (plan détaillé).", "correction": "Intro ation légale. L'étudiant doit s'entraîner à argumenter ses choix.\u003c/p>\n\n\u003ch3>7. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des produits, régimes ou procédures proches.\u003c/li>\n\u003cli>Omettre une étape obligatoire (information, recueil de consentement, contrôle).\u003c/li>\n\u003cli>Donner une réponse purement théorique sans ancrage métier.\u003c/li>\n\u003cli>Négliger le vocabulaire officiel (textes, grilles d'évaluation).\u003c/li>\n\u003c/ul>\n\n\u003ch3>8. Synthèse\u003c/h3>\n\u003cp>Maîtriser Hygiène et production, c'est savoir définir, appliquer une méthode, justifier un choix et communiquer professionnellement. L'entraînement régulier sur des cas et des annales est indispensable.\u003c/p>\n\u003cdiv class=\"memo\">\u003cstrong>À retenir\u003c/strong> — Vocabulaire précis · Méthode structurée · Lien avec le métier · Conformité réglementaire · Entraînement aux épreuves.\u003c/div>\n\u003cdiv class=\"memo\">\u003cstrong>Conseils examen\u003c/strong> — Lire le sujet en entier · Repérer les mots-clés · Structurer la réponse · Justifier · Soigner la forme.\u003c/div>\n", "resume": ["Chapitre Hygiène et production (Techniques culinaires) : notions du référentiel BTS.", "Savoir définir, appliquer une méthode et justifier un choix professionnel.", "Relier chaque notion à une situation concrète du métier.", "Éviter les confusions de vocabulaire et les oublis de procédure."], "points_cles": ["Hygiène et production", "Techniques culinaires", "Définitions", "Méthode", "Cas professionnel", "Réglementation", "Examen", "PMS", "Équilibre alimentaire", "HACCP", "Élaboration de menus"], "exercices": [{"question": "Définir en une phrase précise la notion centrale de « Hygiène et production ».", "correction": "Reprendre la définition du cours en y ajoutant un élément de contexte professionnel."}, {"question": "Citer trois enjeux professionnels liés à ce chapitre.", "correction": "Ex. : conformité, qualité de service, maîtrise des risques, satisfacti rvice ou la sécurité. Les professionnels sont attendus sur la rigueur, la capacité d'explication et le respect des procédures.\u003c/p>\n\u003cp>Les enjeux sont à la fois techniques (exactitude des informations, conformité) et relationnels (conseil, pédagogie, confiance).\u003c/p>\n\n\u003ch3>4. Développement des notions\u003c/h3>\n\u003cp>Le développement s'organise autour des sous-parties du référentiel. Pour chaque notion : définition, principes de fonctionnement ou de mise en œuvre, points de vigilance, exemples.\u003c/p>\n\u003cp>Il est recommandé de construire des fiches personnelles (définitions + schéma + exemple + erreur fréquente) et de s'entraîner à reformuler sans recopier le cours.\u003c/p>\n\n\u003ch3>5. Méthodes et démarches\u003c/h3>\n\u003col>\n\u003cli>Analyser la situation (données, contraintes, objectif).\u003c/li>\n\u003cli>Identifier les règles, produits ou procédures applicables.\u003c/li>\n\u003cli>Appliquer la méthode étape par étape en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence (réglementation, calcul, sens métier).\u003c/li>\n\u003cli>Communiquer le résultat de façon claire au client ou au collègue.\u003c/li>\n\u003c/ol>\n\n\u003ch3>6. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations types incluent : accueil d'un client, analyse d'un besoin, proposition d'une solution, traitement d'un dossier, gestion d'une réclamation, respect d'une obligation légale. L'étudiant doit s'entraîner à argumenter ses choix.\u003c/p>\n\n\u003ch3>7. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des produits, régimes ou procédures proches.\u003c/li>\n\u003cli>Omettre une étape obligatoire (information, recueil de consentement, contrôle).\u003c/li>\n\u003cli>Donner une réponse purement théorique sans ancrage métier.\u003c/li>\n\u003cli>Négliger le vocabulaire officiel (textes, grilles d'évaluation).\u003c/li>\n\u003c/ul>\n\n\u003ch3>8. Synthèse\u003c/h3>\n\u003cp>Maîtriser Accompagnement des publics, c'est savoir définir, a  ou au collègue.\u003c/li>\n\u003c/ol>\n\n\u003ch3>6. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations types incluent : accueil d'un client, analyse d'un besoin, proposition d'une solution, traitement d'un dossier, gestion d'une réclamation, respect d'une obligation légale. L'étudiant doit s'entraîner à argumenter ses choix.\u003c/p>\n\n\u003ch3>7. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des produits, régimes ou procédures proches.\u003c/li>\n\u003cli>Omettre une étape obligatoire (information, recueil de consentement, contrôle).\u003c/li>\n\u003cli>Donner une réponse purement théorique sans ancrage métier.\u003c/li>\n\u003cli>Négliger le vocabulaire officiel (textes, grilles d'évaluation).\u003c/li>\n\u003c/ul>\n\n\u003ch3>8. Synthèse\u003c/h3>\n\u003cp>Maîtriser Politiques de maintenance, c'est savoir définir, appliquer une méthode, justifier un choix et communiquer professionnellement. L'entraînement régulier sur des cas et des annales est indispensable.\u003c/p>\n\u003cdiv class=\"memo\">\u003cstrong>À retenir\u003c/strong> — Vocabulaire précis · Méthode structurée · Lien avec le métier · Conformité réglementaire · Entraînement aux épreuves.\u003c/div>\n\u003cdiv class=\"memo\">\u003cstrong>Conseils examen\u003c/strong> — Lire le sujet en entier · Repérer les mots-clés · Structurer la réponse · Justifier · Soigner la forme.\u003c/div>\n", "resume": ["Chapitre Politiques de maintenance (Maintenance) : notions du référentiel BTS.", "Savoir définir, appliquer une méthode et justifier un choix professionnel.", "Relier chaque notion à une situation concrète du métier.", "Éviter les confusions de vocabulaire et les oublis de procédure."], "points_cles": ["Politiques de maintenance", "Maintenance", "Définitions", "Méthode", "Cas professionnel", "Réglementation", "Examen", "MTBF", "MTTR", "Disponibilité", "Corrective", "Préventive", "Prédictive"], "exercices": [{"question": "Définir en une phrase précise la notion centrale de « Politi s informations, conformité) et relationnels (conseil, pédagogie, confiance).\u003c/p>\n\n\u003ch3>4. Développement des notions\u003c/h3>\n\u003cp>Le développement s'organise autour des sous-parties du référentiel. Pour chaque notion : définition, principes de fonctionnement ou de mise en œuvre, points de vigilance, exemples.\u003c/p>\n\u003cp>Il est recommandé de construire des fiches personnelles (définitions + schéma + exemple + erreur fréquente) et de s'entraîner à reformuler sans recopier le cours.\u003c/p>\n\n\u003ch3>5. Méthodes et démarches\u003c/h3>\n\u003col>\n\u003cli>Analyser la situation (données, contraintes, objectif).\u003c/li>\n\u003cli>Identifier les règles, produits ou procédures applicables.\u003c/li>\n\u003cli>Appliquer la méthode étape par étape en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence (réglementation, calcul, sens métier).\u003c/li>\n\u003cli>Communiquer le résultat de façon claire au client ou au collègue.\u003c/li>\n\u003c/ol>\n\n\u003ch3>6. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations types incluent : accueil d'un client, analyse d'un besoin, proposition d'une solution, traitement d'un dossier, gestion d'une réclamation, respect d'une obligation légale. L'étudiant doit s'entraîner à argumenter ses choix.\u003c/p>\n\n\u003ch3>7. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des produits, régimes ou procédures proches.\u003c/li>\n\u003cli>Omettre une étape obligatoire (information, recueil de consentement, contrôle).\u003c/li>\n\u003cli>Donner une réponse purement théorique sans ancrage métier.\u003c/li>\n\u003cli>Négliger le vocabulaire officiel (textes, grilles d'évaluation).\u003c/li>\n\u003c/ul>\n\n\u003ch3>8. Synthèse\u003c/h3>\n\u003cp>Maîtriser Protection et SLT, c'est savoir définir, appliquer une méthode, justifier un choix et communiquer professionnellement. L'entraînement régulier sur des cas et des annales est indispensable.\u003c/p>\n\u003cdiv class=\"memo\">\u003cstrong>À retenir\ ner à reformuler sans recopier le cours.\u003c/p>\n\n\u003ch3>5. Méthodes et démarches\u003c/h3>\n\u003col>\n\u003cli>Analyser la situation (données, contraintes, objectif).\u003c/li>\n\u003cli>Identifier les règles, produits ou procédures applicables.\u003c/li>\n\u003cli>Appliquer la méthode étape par étape en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence (réglementation, calcul, sens métier).\u003c/li>\n\u003cli>Communiquer le résultat de façon claire au client ou au collègue.\u003c/li>\n\u003c/ol>\n\n\u003ch3>6. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations types incluent : accueil d'un client, analyse d'un besoin, proposition d'une solution, traitement d'un dossier, gestion d'une réclamation, respect d'une obligation légale. L'étudiant doit s'entraîner à argumenter ses choix.\u003c/p>\n\n\u003ch3>7. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des produits, régimes ou procédures proches.\u003c/li>\n\u003cli>Omettre une étape obligatoire (information, recueil de consentement, contrôle).\u003c/li>\n\u003cli>Donner une réponse purement théorique sans ancrage métier.\u003c/li>\n\u003cli>Négliger le vocabulaire officiel (textes, grilles d'évaluation).\u003c/li>\n\u003c/ul>\n\n\u003ch3>8. Synthèse\u003c/h3>\n\u003cp>Maîtriser Bases d'électronique, c'est savoir définir, appliquer une méthode, justifier un choix et communiquer professionnellement. L'entraînement régulier sur des cas et des annales est indispensable.\u003c/p>\n\u003cdiv class=\"memo\">\u003cstrong>À retenir\u003c/strong> — Vocabulaire précis · Méthode structurée · Lien avec le métier · Conformité réglementaire · Entraînement aux épreuves.\u003c/div>\n\u003cdiv class=\"memo\">\u003cstrong>Conseils examen\u003c/strong> — Lire le sujet en entier · Repérer les mots-clés · Structurer la réponse · Justifier · Soigner la forme.\u003c/div>\n", "resume": ["Chapitre Bases d'électronique (Électronique et systèmes) : notions du référentiel BTS.", "Savoir définir, appliquer u lier chaque notion à une pratique du métier.\u003c/li>\n\u003c/ul>\n\n\u003ch3>3. Cadre et enjeux professionnels\u003c/h3>\n\u003cp>Dans le contexte du BTS, ce thème intervient dans la relation client, la gestion des dossiers, le respect de la réglementation, la qualité de service ou la sécurité. Les professionnels sont attendus sur la rigueur, la capacité d'explication et le respect des procédures.\u003c/p>\n\u003cp>Les enjeux sont à la fois techniques (exactitude des informations, conformité) et relationnels (conseil, pédagogie, confiance).\u003c/p>\n\n\u003ch3>4. Développement des notions\u003c/h3>\n\u003cp>Le développement s'organise autour des sous-parties du référentiel. Pour chaque notion : définition, principes de fonctionnement ou de mise en œuvre, points de vigilance, exemples.\u003c/p>\n\u003cp>Il est recommandé de construire des fiches personnelles (définitions + schéma + exemple + erreur fréquente) et de s'entraîner à reformuler sans recopier le cours.\u003c/p>\n\n\u003ch3>5. Méthodes et démarches\u003c/h3>\n\u003col>\n\u003cli>Analyser la situation (données, contraintes, objectif).\u003c/li>\n\u003cli>Identifier les règles, produits ou procédures applicables.\u003c/li>\n\u003cli>Appliquer la méthode étape par étape en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence (réglementation, calcul, sens métier).\u003c/li>\n\u003cli>Communiquer le résultat de façon claire au client ou au collègue.\u003c/li>\n\u003c/ol>\n\n\u003ch3>6. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations types incluent : accueil d'un client, analyse d'un besoin, proposition d'une solution, traitement d'un dossier, gestion d'une réclamation, respect d'une obligation légale. L'étudiant doit s'entraîner à argumenter ses choix.\u003c/p>\n\n\u003ch3>7. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des produits, régimes ou procédures proches.\u003c/li>\n\u003cli>Omettre une étape obligatoire (information, recueil de consentement, contrôle).\u003c/li>\n\u0 hes.\u003c/li>\n\u003cli>Omettre une étape obligatoire (information, recueil de consentement, contrôle).\u003c/li>\n\u003cli>Donner une réponse purement théorique sans ancrage métier.\u003c/li>\n\u003cli>Négliger le vocabulaire officiel (textes, grilles d'évaluation).\u003c/li>\n\u003c/ul>\n\n\u003ch3>8. Synthèse\u003c/h3>\n\u003cp>Maîtriser Modes de transport, c'est savoir définir, appliquer une méthode, justifier un choix et communiquer professionnellement. L'entraînement régulier sur des cas et des annales est indispensable.\u003c/p>\n\u003cdiv class=\"memo\">\u003cstrong>À retenir\u003c/strong> — Vocabulaire précis · Méthode structurée · Lien avec le métier · Conformité réglementaire · Entraînement aux épreuves.\u003c/div>\n\u003cdiv class=\"memo\">\u003cstrong>Conseils examen\u003c/strong> — Lire le sujet en entier · Repérer les mots-clés · Structurer la réponse · Justifier · Soigner la forme.\u003c/div>\n", "resume": ["Chapitre Modes de transport (Transport) : notions du référentiel BTS.", "Savoir définir, appliquer une méthode et justifier un choix professionnel.", "Relier chaque notion à une situation concrète du métier.", "Éviter les confusions de vocabulaire et les oublis de procédure."], "points_cles": ["Modes de transport", "Transport", "Définitions", "Méthode", "Cas professionnel", "Réglementation", "Examen", "Affrètement", "Incoterms", "Routier", "Ferroviaire", "Maritime", "Aérien"], "exercices": [{"question": "Définir en une phrase précise la notion centrale de « Modes de transport ».", "correction": "Reprendre la définition du cours en y ajoutant un élément de contexte professionnel."}, {"question": "Citer trois enjeux professionnels liés à ce chapitre.", "correction": "Ex. : conformité, qualité de service, maîtrise des risques, satisfaction client, rigueur documentaire."}, {"question": "Proposer une méthode en 5 étapes pour traiter une situation type.", "correction": "Analyser → Identifier les règles/produits → Appliquer → Vérifier → Communiquer."}, agogie, confiance).\u003c/p>\n\n\u003ch3>4. Développement des notions\u003c/h3>\n\u003cp>Le développement s'organise autour des sous-parties du référentiel. Pour chaque notion : définition, principes de fonctionnement ou de mise en œuvre, points de vigilance, exemples.\u003c/p>\n\u003cp>Il est recommandé de construire des fiches personnelles (définitions + schéma + exemple + erreur fréquente) et de s'entraîner à reformuler sans recopier le cours.\u003c/p>\n\n\u003ch3>5. Méthodes et démarches\u003c/h3>\n\u003col>\n\u003cli>Analyser la situation (données, contraintes, objectif).\u003c/li>\n\u003cli>Identifier les règles, produits ou procédures applicables.\u003c/li>\n\u003cli>Appliquer la méthode étape par étape en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence (réglementation, calcul, sens métier).\u003c/li>\n\u003cli>Communiquer le résultat de façon claire au client ou au collègue.\u003c/li>\n\u003c/ol>\n\n\u003ch3>6. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations types incluent : accueil d'un client, analyse d'un besoin, proposition d'une solution, traitement d'un dossier, gestion d'une réclamation, respect d'une obligation légale. L'étudiant doit s'entraîner à argumenter ses choix.\u003c/p>\n\n\u003ch3>7. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des produits, régimes ou procédures proches.\u003c/li>\n\u003cli>Omettre une étape obligatoire (information, recueil de consentement, contrôle).\u003c/li>\n\u003cli>Donner une réponse purement théorique sans ancrage métier.\u003c/li>\n\u003cli>Négliger le vocabulaire officiel (textes, grilles d'évaluation).\u003c/li>\n\u003c/ul>\n\n\u003ch3>8. Synthèse\u003c/h3>\n\u003cp>Maîtriser Droit de la famille, c'est savoir définir, appliquer une méthode, justifier un choix et communiquer professionnellement. L'entraînement régulier sur des cas et des annales est indispensable.\u003c/p>\n\u003cdiv class=\"memo\">\u003cstrong>À retenir\u003c/strong> — Vocabulaire précis · Méthode structurée objectif est de maîtriser les notions essentielles, de savoir les appliquer dans des situations professionnelles et de réussir les évaluations du BTS.\u003c/p>\n\u003ch3>2. Définitions et notions clés\u003c/h3>\n\u003cp>Les définitions précises sont indispensables. Chaque terme technique doit être compris, su et réutilisable dans un développement écrit ou oral.\u003c/p>\n\u003cul>\n\u003cli>Identifier les concepts centraux du chapitre.\u003c/li>\n\u003cli>Relier ces concepts aux situations professionnelles du métier.\u003c/li>\n\u003cli>Connaître le vocabulaire officiel du référentiel.\u003c/li>\n\u003c/ul>\n\u003ch3>3. Théorie et développement\u003c/h3>\n\u003cp>Le développement théorique s'appuie sur le programme officiel. Il faut distinguer ce qui est à connaître par cœur (définitions, formules, étapes de méthode) et ce qui doit être compris pour être réinvesti (raisonnements, comparaisons, choix techniques).\u003c/p>\n\u003cp>Les liens avec les autres matières du BTS sont à souligner : un même objet technique peut être abordé sous l'angle scientifique, technologique et professionnel.\u003c/p>\n\u003ch3>4. Méthodes et démarches\u003c/h3>\n\u003cp>Méthode type pour traiter un exercice ou une situation :\u003c/p>\n\u003col>\n\u003cli>Lire et comprendre la demande (mots-clés, données, contraintes).\u003c/li>\n\u003cli>Identifier le ou les modèles / formules / procédures applicables.\u003c/li>\n\u003cli>Organiser la démarche (étapes, schémas, tableaux).\u003c/li>\n\u003cli>Calculer ou argumenter en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence du résultat (ordre de grandeur, unités, sens physique ou économique).\u003c/li>\n\u003cli>Conclure en répondant clairement à la question posée.\u003c/li>\n\u003c/ol>\n\u003ch3>5. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations professionnelles du BTS demandent de relier la théorie au terrain : choix d'un équipement, diagnostic, conseil client, rédaction d'un document technique, respect d'une norme ou d' enter en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence du résultat (ordre de grandeur, unités, sens physique ou économique).\u003c/li>\n\u003cli>Conclure en répondant clairement à la question posée.\u003c/li>\n\u003c/ol>\n\u003ch3>5. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations professionnelles du BTS demandent de relier la théorie au terrain : choix d'un équipement, diagnostic, conseil client, rédaction d'un document technique, respect d'une norme ou d'une procédure de sécurité.\u003c/p>\n\u003ch3>6. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des notions proches.\u003c/li>\n\u003cli>Oublier les unités ou les conditions d'application d'une formule.\u003c/li>\n\u003cli>Répondre à côté de la question faute d'avoir repéré les mots-clés.\u003c/li>\n\u003cli>Négliger la justification au profit du seul résultat numérique.\u003c/li>\n\u003c/ul>\n\u003ch3>7. Synthèse\u003c/h3>\n\u003cp>Retenir les définitions, les formules ou étapes de méthode, et savoir les mobiliser dans un contexte professionnel. S'entraîner régulièrement avec des exercices types examen.\u003c/p>\n\u003cdiv class=\"memo\">\u003cstrong>À retenir\u003c/strong> — Maîtriser le vocabulaire, les méthodes et les liens avec le métier. S'entraîner sur des annales et des cas concrets.\u003c/div>\n", "resume": ["Chapitre Réseaux sociaux et prospection : notions essentielles du référentiel.", "Savoir définir, appliquer une méthode et justifier.", "Relier la théorie aux situations professionnelles."], "points_cles": ["Réseaux sociaux et prospection", "Digitalisation", "Méthode", "Cas professionnel", "Examen"], "exercices": [{"question": "Définir précisément la notion centrale de « Réseaux sociaux et prospection ».", "correction": "Réponse attendue : définition du cours + une phrase de contexte professionnel."}, {"question": "Donner une méthode en 4 étapes pour traiter un problème lié à Réseaux sociaux et prospection.", "correction": "1) Analyser 2) Choisir le modèle 3) App el du référentiel.\u003c/li>\n\u003c/ul>\n\u003ch3>3. Théorie et développement\u003c/h3>\n\u003cp>Le développement théorique s'appuie sur le programme officiel. Il faut distinguer ce qui est à connaître par cœur (définitions, formules, étapes de méthode) et ce qui doit être compris pour être réinvesti (raisonnements, comparaisons, choix techniques).\u003c/p>\n\u003cp>Les liens avec les autres matières du BTS sont à souligner : un même objet technique peut être abordé sous l'angle scientifique, technologique et professionnel.\u003c/p>\n\u003ch3>4. Méthodes et démarches\u003c/h3>\n\u003cp>Méthode type pour traiter un exercice ou une situation :\u003c/p>\n\u003col>\n\u003cli>Lire et comprendre la demande (mots-clés, données, contraintes).\u003c/li>\n\u003cli>Identifier le ou les modèles / formules / procédures applicables.\u003c/li>\n\u003cli>Organiser la démarche (étapes, schémas, tableaux).\u003c/li>\n\u003cli>Calculer ou argumenter en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence du résultat (ordre de grandeur, unités, sens physique ou économique).\u003c/li>\n\u003cli>Conclure en répondant clairement à la question posée.\u003c/li>\n\u003c/ol>\n\u003ch3>5. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations professionnelles du BTS demandent de relier la théorie au terrain : choix d'un équipement, diagnostic, conseil client, rédaction d'un document technique, respect d'une norme ou d'une procédure de sécurité.\u003c/p>\n\u003ch3>6. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des notions proches.\u003c/li>\n\u003cli>Oublier les unités ou les conditions d'application d'une formule.\u003c/li>\n\u003cli>Répondre à côté de la question faute d'avoir repéré les mots-clés.\u003c/li>\n\u003cli>Négliger la justification au profit du seul résultat numérique.\u003c/li>\n\u003c/ul>\n\u003ch3>7. Synthèse\u003c/h3>\n\u003cp>Retenir les définitions, les formules ou étapes de méthode, et savoir les mobiliser dans un contexte professionnel. S'entraî .\u003c/li>\n\u003cli>Calculer ou argumenter en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence du résultat (ordre de grandeur, unités, sens physique ou économique).\u003c/li>\n\u003cli>Conclure en répondant clairement à la question posée.\u003c/li>\n\u003c/ol>\n\u003ch3>5. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations professionnelles du BTS demandent de relier la théorie au terrain : choix d'un équipement, diagnostic, conseil client, rédaction d'un document technique, respect d'une norme ou d'une procédure de sécurité.\u003c/p>\n\u003ch3>6. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des notions proches.\u003c/li>\n\u003cli>Oublier les unités ou les conditions d'application d'une formule.\u003c/li>\n\u003cli>Répondre à côté de la question faute d'avoir repéré les mots-clés.\u003c/li>\n\u003cli>Négliger la justification au profit du seul résultat numérique.\u003c/li>\n\u003c/ul>\n\u003ch3>7. Synthèse\u003c/h3>\n\u003cp>Retenir les définitions, les formules ou étapes de méthode, et savoir les mobiliser dans un contexte professionnel. S'entraîner régulièrement avec des exercices types examen.\u003c/p>\n\u003cdiv class=\"memo\">\u003cstrong>À retenir\u003c/strong> — Maîtriser le vocabulaire, les méthodes et les liens avec le métier. S'entraîner sur des annales et des cas concrets.\u003c/div>\n", "resume": ["Chapitre Analyse de la rentabilité : notions essentielles du référentiel.", "Savoir définir, appliquer une méthode et justifier.", "Relier la théorie aux situations professionnelles."], "points_cles": ["Analyse de la rentabilité", "Analyse financière", "Méthode", "Cas professionnel", "Examen"], "exercices": [{"question": "Définir précisément la notion centrale de « Analyse de la rentabilité ».", "correction": "Réponse attendue : définition du cours + une phrase de contexte professionnel."}, {"question": "Donner une méthode en 4 étapes pour traiter un problème lié à Analyse de la rentabilité.", "correction": "1) Analyser 2) C l court ?", "reponse": "Définition → intérêt → exemple → conclusion"}, {"question": "Vérifier un résultat = ?", "reponse": "Cohérence, unités, ordre de grandeur"}, {"question": "Vocabulaire technique ?", "reponse": "À maîtriser"}, {"question": "Objectif du chapitre ?", "reponse": "Compétences du référentiel BTS"}, {"question": "Synthèse = ?", "reponse": "Idées fortes structurées"}, {"question": "Lien inter-matières ?", "reponse": "Oui, à identifier"}, {"question": "Unités ?", "reponse": "Toujours vérifier"}, {"question": "Entraînement ?", "reponse": "Exercices et annales"}, {"question": "Conclusion d'un exercice ?", "reponse": "Répondre clairement à la question"}], "sources": [], "formationNom": "BTS Comptabilité et Gestion"}, {"id": "mpsi-01", "formation": "cpge-mpsi", "matiere": "Algèbre linéaire", "titre": "Espaces vectoriels et applications linéaires", "ordre": 1, "cours": "Un espace vectoriel sur ℝ (ou ℂ) est un ensemble muni de deux opérations (addition et multiplication par un scalaire) vérifiant une liste d’axiomes.\n\nSous-espace vectoriel : partie stable et non vide.\n\nFamille libre / génératrice / base. Dimension = cardinal d’une base.\n\nApplication linéaire : f(λu + μv) = λf(u) + μf(v).\nNoyau et image. Théorème du rang : dim E = dim Ker f + dim Im f.\n\nMatrices : représentation d’une application linéaire dans des bases.", "resume": ["Espace vectoriel = structure algébrique fondamentale.", "Base → dimension.", "Théorème du rang : dim E = dim Ker + dim Im."], "points_cles": ["Espace vectoriel", "Base", "Dimension", "Application linéaire", "Noyau", "Image", "Théorème du rang"], "exercices": [{"question": "Énoncer le théorème du rang.", "correction": "Pour f : E → F linéaire, dim E = dim Ker f + dim Im f."}], "qcm": [{"question": "Le théorème du rang relie :", "choix": ["Noyau et déterminant", "Noyau et image", "Trace et déterminant", "Valeurs propres et vecteurs propres"], "reponse": "Noyau et image"}], "flashcards": [{"question": "Théorème du rang", "reponse": "dim E = dim Ker f + dim Im f"}, {"question": "Définition d’une application linéaire", "reponse": "f(λu+μv) = λf(u)+μf(v)"}], "sources": [], "formationNom": "cpge-mpsi"}, {"id": "but-01", "formation": "but-informatique", "matiere": "Informatique fondamentale", "titre": "Algorithmique de base", "ordre": 1, "cours": "Un algorithme est une suite finie d’instructions non ambiguës permettant de résoudre un problème.\n\nStructures de contrôle : séquence, alternative (si… alors… sinon), boucles (pour, tant que, répéter).\n\nStructures de données élémentaires : variables, tableaux, listes.\n\nComplexité : on évalue le nombre d’opérations en fonction de la taille des données (notation grand O).\n\nBonnes pratiques : clarté, modularité, tests, documentation.", "resume": ["Algorithme = suite d’instructions finie et non ambiguë.", "Structures de contrôle : séquence, test, boucle.", "Complexité algorithmique (grand O)."], "points_cles": ["Algorithme", "Variable", "Boucle", "Alternative", "Complexité", "Tableau"], "exercices": [{"question": "Écrire un algorithme qui calcule la somme des n premiers entiers.", "correction": "s ← 0 ; pour i de 1 à n faire s ← s + i ; fin pour ; afficher s. (Ou formule n(n+1)/2)"}], "qcm": [{"question": "La notation grand O mesure principalement :", "choix": ["La taille du code", "La complexité / le temps d’exécution", "Le nombre de variables", "La portabilité"], "reponse": "La complexité / le temps d’exécution"}], "flashcards": [{"question": "Définition d’un algorithme", "reponse": "Suite finie d’instructions non ambiguës"}, {"question": "Notation de la complexité", "reponse": "Grand O (O(...))"}], "sources": [], "formationNom": "but-informatique"}, {"id": "maths-01", "formation": "licence-maths", "matiere": "Analyse", "titre": "Suites numériques", "ordre": 1, "cours": "Une suite (u_n) est une fonction de ℕ (ou une partie de ℕ) vers ℝ.\n\nConvergence : u_n → L si pour tout ε > 0 il existe N tel que n ≥ N ⇒ |u_n − L| \u003c ε.\n\nSuites monotones et bornées : toute suite croissante majorée converge.\n\nSuites récurrentes : u_{n+1} = f(u_n). Étude de points fixes et de stabilité.\n\nSuites particulières : arithmétiques (u_{n+1} = u_n + r), géométriques (u_{n+1} = q u_n).", "resume": ["Convergence : définition ε-N.", "Suite croissante majorée ⇒ convergente.", "Suites arithmétiques et géométriques."], "points_cles": ["Convergence", "Monotonie", "Suite bornée", "Suite arithmétique", "Suite géométrique", "Point fixe"], "exercices": [{"question": "La suite u_n = 1/n converge-t-elle ? Vers quelle limite ?", "correction": "Oui, vers 0."}], "qcm": [{"question": "Une suite croissante et majorée :", "choix": ["Diverge toujours", "Converge toujours", "Est constante", "Est périodique"], "reponse": "Converge toujours"}], "flashcards": [{"question": "Définition de la convergence d’une suite", "reponse": "Pour tout ε>0 il existe N tel que n≥N ⇒ |u_n−L|\u003cε"}, {"question": "Suite arithmétique – raison r", "reponse": "u_{n+1} = u_n + r"}], "sources": [], "formationNom": "licence-maths"}, {"id": "bts-assu-01-assurance-de-personnes", "formation": "bts-assurance", "matiere": "Produits et contrats", "titre": "Assurance de personnes", "ordre": 1, "cours": "\u003ch3>1. Introduction\u003c/h3>\n\u003cp>Le chapitre \u003cstrong>Assurance de personnes\u003c/strong> fait partie de la matière \u003cem>Produits et contrats\u003c/em>. Il vise l'acquisition des connaissances et compétences attendues dans le référentiel du BTS. L'étudiant doit être capable d'expliquer les notions, de les mobiliser dans des situations professionnelles et de réussir les évaluations (écrits, oraux, CCF, examens).\u003c/p>\n\u003cp>Ce cours présente les définitions, le cadre réglementaire ou technique, les méthodes de travail et des exemples concrets issus du métier.\u003c/p>\n\n\u003ch3>2. Définitions essentielles\u003c/h3>\n\u003cp>Avant toute application, il faut maîtriser le vocabulaire du domaine. Chaque terme doit pouvoir être défini de façon précise et illustré par un exemple professionnel.\u003c/p>\n\u003cul>\n\u003cli>Identifier les concepts centraux du chapitre.\u003c/li>\n\u003cli>Distinguer les notions proches pour éviter les confusions.\u003c/li>\n\u003cli>Relier chaque notion à une pratique du métier.\u003c/li>\n\u003c/ul>\n\n\u003ch3>3. Cadre et enjeux professionnels\u003c/h3>\n\u003cp>Dans le contexte du BTS, ce thème intervient dans la relation client, la gestion des dossiers, le respect de la réglementation, la qualité de service ou la sécurité. Les professionnels sont attendus sur la rigueur, la capacité d'explication et le respect des procédures.\u003c/p>\n\u003cp>Les enjeux sont à la fois techniques (exactitude des informations, conformité) et relationnels (conseil, pédagogie, confiance).\u003c/p>\n\n\u003ch3>4. Développement des notions\u003c/h3>\n\u003cp>Le développement s'organise autour des sous-parties du référentiel. Pour chaque notion : définition, principes de fonctionnement ou de mise en œuvre, points de vigilance, exemples.\u003c/p>\n\u003cp>Il est recommandé de construire des fiches personnelles (définitions + schéma + exemple + erreur fréquente) et de s'entraîner à reformuler sans recopier le cours.\u003c/p>\n\n\u003ch3>5. Méthodes et démarches\u003c/h3>\n\u003col>\n\u003cli>Analyser la situation (données, contraintes, objectif).\u003c/li>\n\u003cli>Identifier les règles, produits ou procédures applicables.\u003c/li>\n\u003cli>Appliquer la méthode étape par étape en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence (réglementation, calcul, sens métier).\u003c/li>\n\u003cli>Communiquer le résultat de façon claire au client ou au collègue.\u003c/li>\n\u003c/ol>\n\n\u003ch3>6. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations types incluent : accueil d'un client, analyse d'un besoin, proposition d'une solution, traitement d'un dossier, gestion d'une réclamation, respect d'une obligation légale. L'étudiant doit s'entraîner à argumenter ses choix.\u003c/p>\n\n\u003ch3 003c/h3>\n\u003cp>Le développement s'organise autour des sous-parties du référentiel. Pour chaque notion : définition, principes de fonctionnement ou de mise en œuvre, points de vigilance, exemples.\u003c/p>\n\u003cp>Il est recommandé de construire des fiches personnelles (définitions + schéma + exemple + erreur fréquente) et de s'entraîner à reformuler sans recopier le cours.\u003c/p>\n\n\u003ch3>5. Méthodes et démarches\u003c/h3>\n\u003col>\n\u003cli>Analyser la situation (données, contraintes, objectif).\u003c/li>\n\u003cli>Identifier les règles, produits ou procédures applicables.\u003c/li>\n\u003cli>Appliquer la méthode étape par étape en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence (réglementation, calcul, sens métier).\u003c/li>\n\u003cli>Communiquer le résultat de façon claire au client ou au collègue.\u003c/li>\n\u003c/ol>\n\n\u003ch3>6. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations types incluent : accueil d'un client, analyse d'un besoin, proposition d'une solution, traitement d'un dossier, gestion d'une réclamation, respect d'une obligation légale. L'étudiant doit s'entraîner à argumenter ses choix.\u003c/p>\n\n\u003ch3>7. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des produits, régimes ou procédures proches.\u003c/li>\n\u003cli>Omettre une étape obligatoire (information, recueil de consentement, contrôle).\u003c/li>\n\u003cli>Donner une réponse purement théorique sans ancrage métier.\u003c/li>\n\u003cli>Négliger le vocabulaire officiel (textes, grilles d'évaluation).\u003c/li>\n\u003c/ul>\n\n\u003ch3>8. Synthèse\u003c/h3>\n\u003cp>Maîtriser Habilitations électriques, c'est savoir définir, appliquer une méthode, justifier un choix et communiquer professionnellement. L'entraînement régulier sur des cas et des annales est indispensable.\u003c/p>\n\u003cdiv class=\"memo\">\u003cstrong>À retenir\u003c/strong> — Vocabulaire précis · Méthode structurée · Lien avec le métier · Conformité réglementaire · Entraînement étences attendues dans le référentiel du BTS. L'étudiant doit être capable d'expliquer les notions, de les mobiliser dans des situations professionnelles et de réussir les évaluations (écrits, oraux, CCF, examens).\u003c/p>\n\u003cp>Ce cours présente les définitions, le cadre réglementaire ou technique, les méthodes de travail et des exemples concrets issus du métier.\u003c/p>\n\n\u003ch3>2. Définitions essentielles\u003c/h3>\n\u003cp>Avant toute application, il faut maîtriser le vocabulaire du domaine. Chaque terme doit pouvoir être défini de façon précise et illustré par un exemple professionnel.\u003c/p>\n\u003cul>\n\u003cli>Identifier les concepts centraux du chapitre.\u003c/li>\n\u003cli>Distinguer les notions proches pour éviter les confusions.\u003c/li>\n\u003cli>Relier chaque notion à une pratique du métier.\u003c/li>\n\u003c/ul>\n\n\u003ch3>3. Cadre et enjeux professionnels\u003c/h3>\n\u003cp>Dans le contexte du BTS, ce thème intervient dans la relation client, la gestion des dossiers, le respect de la réglementation, la qualité de service ou la sécurité. Les professionnels sont attendus sur la rigueur, la capacité d'explication et le respect des procédures.\u003c/p>\n\u003cp>Les enjeux sont à la fois techniques (exactitude des informations, conformité) et relationnels (conseil, pédagogie, confiance).\u003c/p>\n\n\u003ch3>4. Développement des notions\u003c/h3>\n\u003cp>Le développement s'organise autour des sous-parties du référentiel. Pour chaque notion : définition, principes de fonctionnement ou de mise en œuvre, points de vigilance, exemples.\u003c/p>\n\u003cp>Il est recommandé de construire des fiches personnelles (définitions + schéma + exemple + erreur fréquente) et de s'entraîner à reformuler sans recopier le cours.\u003c/p>\n\n\u003ch3>5. Méthodes et démarches\u003c/h3>\n\u003col>\n\u003cli>Analyser la situation (données, contraintes, objectif).\u003c/li>\n\u003cli>Identifier les règles, produits ou procédures applicables.\u003c/li>\n\u003cli>Appliquer la méthode étape par étape en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence (réglementation, calcul, sens métier).\u003c/li>\n\u003cli>Communiquer le résultat de façon claire au client ou au collègue.\u003c/li>\n\u003c/ol>\n\n\u003ch3>6. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations types incluent : accueil d'un client, analyse d'un besoin, proposition d'une solution, traitement d'un dossier, gestion d'une réclamation, respect d'une obligation légale. L'étudiant doit s'entraîner à argumenter ses choix.\u003c/p>\n\n\u003ch3>7. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des produits, régimes ou procédures proches.\u003c/li>\n\u003cli>Omettre une étape obligatoire (information, recueil de consentement, contrôle).\u003c/li>\n\u003cli>Donner une réponse purement théorique sans ancrage métier.\u003c/li>\n\u003cli>Négliger le vocabulaire officiel (textes, grilles d'évaluation).\u003c/li>\n\u003c/ul>\n\n\u003ch3>8. Synthèse\u003c/h3>\n\u003cp>Maîtriser Sécurité des systèmes, c'est savoir définir, appliquer une méthode, justifier un choix et communiquer professionnellement. L'entraînement régulier sur des cas et des annales est indispensable.\u003c/p>\n\u003cdiv class=\"memo\">\u003cstrong>À retenir\u003c/strong> — Vocabulaire précis · Méthode structurée · Lien avec le métier · Conformité réglementaire · Entraînement aux épreuves.\u003c/div>\n\u003cdiv class=\"memo\">\u003cstrong>Conseils examen\u003c/strong> — Lire le sujet en entier · Repérer les mots-clés · Structurer la réponse · Justifier · Soigner la forme.\u003c/div>\n", "resume": ["Chapitre Sécurité des systèmes (Cybersécurité) : notions du référentiel BTS.", "Savoir définir, appliquer une méthode et justifier un choix professionnel.", "Relier chaque notion à une situation concrète du métier.", "Éviter les confusions de vocabulaire et les oublis de procédure."], "points_cles": ["Sécurité des systèmes", "Cybersécurité", "Définitions", "Méthode", "Cas professionnel", "Ré onnel.\u003c/p>\n\u003cul>\n\u003cli>Identifier les concepts centraux du chapitre.\u003c/li>\n\u003cli>Distinguer les notions proches pour éviter les confusions.\u003c/li>\n\u003cli>Relier chaque notion à une pratique du métier.\u003c/li>\n\u003c/ul>\n\n\u003ch3>3. Cadre et enjeux professionnels\u003c/h3>\n\u003cp>Dans le contexte du BTS, ce thème intervient dans la relation client, la gestion des dossiers, le respect de la réglementation, la qualité de service ou la sécurité. Les professionnels sont attendus sur la rigueur, la capacité d'explication et le respect des procédures.\u003c/p>\n\u003cp>Les enjeux sont à la fois techniques (exactitude des informations, conformité) et relationnels (conseil, pédagogie, confiance).\u003c/p>\n\n\u003ch3>4. Développement des notions\u003c/h3>\n\u003cp>Le développement s'organise autour des sous-parties du référentiel. Pour chaque notion : définition, principes de fonctionnement ou de mise en œuvre, points de vigilance, exemples.\u003c/p>\n\u003cp>Il est recommandé de construire des fiches personnelles (définitions + schéma + exemple + erreur fréquente) et de s'entraîner à reformuler sans recopier le cours.\u003c/p>\n\n\u003ch3>5. Méthodes et démarches\u003c/h3>\n\u003col>\n\u003cli>Analyser la situation (données, contraintes, objectif).\u003c/li>\n\u003cli>Identifier les règles, produits ou procédures applicables.\u003c/li>\n\u003cli>Appliquer la méthode étape par étape en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence (réglementation, calcul, sens métier).\u003c/li>\n\u003cli>Communiquer le résultat de façon claire au client ou au collègue.\u003c/li>\n\u003c/ol>\n\n\u003ch3>6. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations types incluent : accueil d'un client, analyse d'un besoin, proposition d'une solution, traitement d'un dossier, gestion d'une réclamation, respect d'une obligation légale. L'étudiant doit s'entraîner à argumenter ses choix.\u003c/p>\n\n\u003ch3>7. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des produits, régimes ou procédures proches.\u003c/li>\n\u003cli>Omettre une étape obligatoire (information, recueil de consentement, contrôle).\u003c/li>\n\u003cli>Donner une réponse purement théorique sans ancrage métier.\u003c/li>\n\u003cli>Négliger le vocabulaire officiel (textes, grilles d'évaluation).\u003c/li>\n\u003c/ul>\n\n\u003ch3>8. Synthèse\u003c/h3>\n\u003cp>Maîtriser Systèmes automatisés, c'est savoir définir, appliquer une méthode, justifier un choix et communiquer professionnellement. L'entraînement régulier sur des cas et des annales est indispensable.\u003c/p>\n\u003cdiv class=\"memo\">\u003cstrong>À retenir\u003c/strong> — Vocabulaire précis · Méthode structurée · Lien avec le métier · Conformité réglementaire · Entraînement aux épreuves.\u003c/div>\n\u003cdiv class=\"memo\">\u003cstrong>Conseils examen\u003c/strong> — Lire le sujet en entier · Repérer les mots-clés · Structurer la réponse · Justifier · Soigner la forme.\u003c/div>\n", "resume": ["Chapitre Systèmes automatisés (Systèmes) : notions du référentiel BTS.", "Savoir définir, appliquer une méthode et justifier un choix professionnel.", "Relier chaque notion à une situation concrète du métier.", "Éviter les confusions de vocabulaire et les oublis de procédure."], "points_cles": ["Systèmes automatisés", "Systèmes", "Définitions", "Méthode", "Cas professionnel", "Réglementation", "Examen", "TOR", "Analogique", "Capteurs", "Actionneurs", "API"], "exercices": [{"question": "Définir en une phrase précise la notion centrale de « Systèmes automatisés ».", "correction": "Reprendre la définition du cours en y ajoutant un élément de contexte professionnel."}, {"question": "Citer trois enjeux professionnels liés à ce chapitre.", "correction": "Ex. : conformité, qualité de service, maîtrise des risques, satisfaction client, rigueur documentaire."}, {"question": "Proposer une méthode en 5 étapes pour traiter une situation type.", "correction": "Analyser → Identifier les règles l, pédagogie, confiance).\u003c/p>\n\n\u003ch3>4. Développement des notions\u003c/h3>\n\u003cp>Le développement s'organise autour des sous-parties du référentiel. Pour chaque notion : définition, principes de fonctionnement ou de mise en œuvre, points de vigilance, exemples.\u003c/p>\n\u003cp>Il est recommandé de construire des fiches personnelles (définitions + schéma + exemple + erreur fréquente) et de s'entraîner à reformuler sans recopier le cours.\u003c/p>\n\n\u003ch3>5. Méthodes et démarches\u003c/h3>\n\u003col>\n\u003cli>Analyser la situation (données, contraintes, objectif).\u003c/li>\n\u003cli>Identifier les règles, produits ou procédures applicables.\u003c/li>\n\u003cli>Appliquer la méthode étape par étape en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence (réglementation, calcul, sens métier).\u003c/li>\n\u003cli>Communiquer le résultat de façon claire au client ou au collègue.\u003c/li>\n\u003c/ol>\n\n\u003ch3>6. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations types incluent : accueil d'un client, analyse d'un besoin, proposition d'une solution, traitement d'un dossier, gestion d'une réclamation, respect d'une obligation légale. L'étudiant doit s'entraîner à argumenter ses choix.\u003c/p>\n\n\u003ch3>7. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des produits, régimes ou procédures proches.\u003c/li>\n\u003cli>Omettre une étape obligatoire (information, recueil de consentement, contrôle).\u003c/li>\n\u003cli>Donner une réponse purement théorique sans ancrage métier.\u003c/li>\n\u003cli>Négliger le vocabulaire officiel (textes, grilles d'évaluation).\u003c/li>\n\u003c/ul>\n\n\u003ch3>8. Synthèse\u003c/h3>\n\u003cp>Maîtriser Courant alternatif, c'est savoir définir, appliquer une méthode, justifier un choix et communiquer professionnellement. L'entraînement régulier sur des cas et des annales est indispensable.\u003c/p>\n\u003cdiv class=\"memo\">\u003cstrong>À retenir\u003c/strong> — Vocabulaire précis · Méthode struc S. L'étudiant doit être capable d'expliquer les notions, de les mobiliser dans des situations professionnelles et de réussir les évaluations (écrits, oraux, CCF, examens).\u003c/p>\n\u003cp>Ce cours présente les définitions, le cadre réglementaire ou technique, les méthodes de travail et des exemples concrets issus du métier.\u003c/p>\n\n\u003ch3>2. Définitions essentielles\u003c/h3>\n\u003cp>Avant toute application, il faut maîtriser le vocabulaire du domaine. Chaque terme doit pouvoir être défini de façon précise et illustré par un exemple professionnel.\u003c/p>\n\u003cul>\n\u003cli>Identifier les concepts centraux du chapitre.\u003c/li>\n\u003cli>Distinguer les notions proches pour éviter les confusions.\u003c/li>\n\u003cli>Relier chaque notion à une pratique du métier.\u003c/li>\n\u003c/ul>\n\n\u003ch3>3. Cadre et enjeux professionnels\u003c/h3>\n\u003cp>Dans le contexte du BTS, ce thème intervient dans la relation client, la gestion des dossiers, le respect de la réglementation, la qualité de service ou la sécurité. Les professionnels sont attendus sur la rigueur, la capacité d'explication et le respect des procédures.\u003c/p>\n\u003cp>Les enjeux sont à la fois techniques (exactitude des informations, conformité) et relationnels (conseil, pédagogie, confiance).\u003c/p>\n\n\u003ch3>4. Développement des notions\u003c/h3>\n\u003cp>Le développement s'organise autour des sous-parties du référentiel. Pour chaque notion : définition, principes de fonctionnement ou de mise en œuvre, points de vigilance, exemples.\u003c/p>\n\u003cp>Il est recommandé de construire des fiches personnelles (définitions + schéma + exemple + erreur fréquente) et de s'entraîner à reformuler sans recopier le cours.\u003c/p>\n\n\u003ch3>5. Méthodes et démarches\u003c/h3>\n\u003col>\n\u003cli>Analyser la situation (données, contraintes, objectif).\u003c/li>\n\u003cli>Identifier les règles, produits ou procédures applicables.\u003c/li>\n\u003cli>Appliquer la méthode étape par étape en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence (réglementation, calcul, sens métier).\u003c/li>\n\u003cli>Communiquer le résultat de façon claire au client ou au collègue.\u003c/li>\n\u003c/ol>\n\n\u003ch3>6. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations types incluent : accueil d'un client, analyse d'un besoin, proposition d'une solution, traitement d'un dossier, gestion d'une réclamation, respect d'une obligation légale. L'étudiant doit s'entraîner à argumenter ses choix.\u003c/p>\n\n\u003ch3>7. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des produits, régimes ou procédures proches.\u003c/li>\n\u003cli>Omettre une étape obligatoire (information, recueil de consentement, contrôle).\u003c/li>\n\u003cli>Donner une réponse purement théorique sans ancrage métier.\u003c/li>\n\u003cli>Négliger le vocabulaire officiel (textes, grilles d'évaluation).\u003c/li>\n\u003c/ul>\n\n\u003ch3>8. Synthèse\u003c/h3>\n\u003cp>Maîtriser Nutrition clinique, c'est savoir définir, appliquer une méthode, justifier un choix et communiquer professionnellement. L'entraînement régulier sur des cas et des annales est indispensable.\u003c/p>\n\u003cdiv class=\"memo\">\u003cstrong>À retenir\u003c/strong> — Vocabulaire précis · Méthode structurée · Lien avec le métier · Conformité réglementaire · Entraînement aux épreuves.\u003c/div>\n\u003cdiv class=\"memo\">\u003cstrong>Conseils examen\u003c/strong> — Lire le sujet en entier · Repérer les mots-clés · Structurer la réponse · Justifier · Soigner la forme.\u003c/div>\n", "resume": ["Chapitre Nutrition clinique (Nutrition) : notions du référentiel BTS.", "Savoir définir, appliquer une méthode et justifier un choix professionnel.", "Relier chaque notion à une situation concrète du métier.", "Éviter les confusions de vocabulaire et les oublis de procédure."], "points_cles": ["Nutrition clinique", "Nutrition", "Définitions", "Méthode", "Cas professionnel", "Réglementation", "Examen", "Diabète", "Obésité", "Dénutrition" aque notion à une pratique du métier.\u003c/li>\n\u003c/ul>\n\n\u003ch3>3. Cadre et enjeux professionnels\u003c/h3>\n\u003cp>Dans le contexte du BTS, ce thème intervient dans la relation client, la gestion des dossiers, le respect de la réglementation, la qualité de service ou la sécurité. Les professionnels sont attendus sur la rigueur, la capacité d'explication et le respect des procédures.\u003c/p>\n\u003cp>Les enjeux sont à la fois techniques (exactitude des informations, conformité) et relationnels (conseil, pédagogie, confiance).\u003c/p>\n\n\u003ch3>4. Développement des notions\u003c/h3>\n\u003cp>Le développement s'organise autour des sous-parties du référentiel. Pour chaque notion : définition, principes de fonctionnement ou de mise en œuvre, points de vigilance, exemples.\u003c/p>\n\u003cp>Il est recommandé de construire des fiches personnelles (définitions + schéma + exemple + erreur fréquente) et de s'entraîner à reformuler sans recopier le cours.\u003c/p>\n\n\u003ch3>5. Méthodes et démarches\u003c/h3>\n\u003col>\n\u003cli>Analyser la situation (données, contraintes, objectif).\u003c/li>\n\u003cli>Identifier les règles, produits ou procédures applicables.\u003c/li>\n\u003cli>Appliquer la méthode étape par étape en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence (réglementation, calcul, sens métier).\u003c/li>\n\u003cli>Communiquer le résultat de façon claire au client ou au collègue.\u003c/li>\n\u003c/ol>\n\n\u003ch3>6. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations types incluent : accueil d'un client, analyse d'un besoin, proposition d'une solution, traitement d'un dossier, gestion d'une réclamation, respect d'une obligation légale. L'étudiant doit s'entraîner à argumenter ses choix.\u003c/p>\n\n\u003ch3>7. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des produits, régimes ou procédures proches.\u003c/li>\n\u003cli>Omettre une étape obligatoire (information, recueil de consentement, contrôle).\u003c/li>\n\u003cli>D rong> dans le cadre de la matière Management et vente du référentiel. L'objectif est de maîtriser les notions essentielles, de savoir les appliquer dans des situations professionnelles et de réussir les évaluations du BTS.\u003c/p>\n\u003ch3>2. Définitions et notions clés\u003c/h3>\n\u003cp>Les définitions précises sont indispensables. Chaque terme technique doit être compris, su et réutilisable dans un développement écrit ou oral.\u003c/p>\n\u003cul>\n\u003cli>Identifier les concepts centraux du chapitre.\u003c/li>\n\u003cli>Relier ces concepts aux situations professionnelles du métier.\u003c/li>\n\u003cli>Connaître le vocabulaire officiel du référentiel.\u003c/li>\n\u003c/ul>\n\u003ch3>3. Théorie et développement\u003c/h3>\n\u003cp>Le développement théorique s'appuie sur le programme officiel. Il faut distinguer ce qui est à connaître par cœur (définitions, formules, étapes de méthode) et ce qui doit être compris pour être réinvesti (raisonnements, comparaisons, choix techniques).\u003c/p>\n\u003cp>Les liens avec les autres matières du BTS sont à souligner : un même objet technique peut être abordé sous l'angle scientifique, technologique et professionnel.\u003c/p>\n\u003ch3>4. Méthodes et démarches\u003c/h3>\n\u003cp>Méthode type pour traiter un exercice ou une situation :\u003c/p>\n\u003col>\n\u003cli>Lire et comprendre la demande (mots-clés, données, contraintes).\u003c/li>\n\u003cli>Identifier le ou les modèles / formules / procédures applicables.\u003c/li>\n\u003cli>Organiser la démarche (étapes, schémas, tableaux).\u003c/li>\n\u003cli>Calculer ou argumenter en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence du résultat (ordre de grandeur, unités, sens physique ou économique).\u003c/li>\n\u003cli>Conclure en répondant clairement à la question posée.\u003c/li>\n\u003c/ol>\n\u003ch3>5. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations professionnelles du BTS demandent de relier la théorie au terrain : choix d'un équipement, diagnostic, conseil client, rédaction d'un document technique, respect d'une norme ou d'une procédure de sécurité.\u003c/p>\n\u003ch3>6. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des notions proches.\u003c/li>\n\u003cli>Oublier les unités ou les conditions d'application d'une formule.\u003c/li>\n\u003cli>Répondre à côté de la question faute d'avoir repéré les mots-clés.\u003c/li>\n\u003cli>Négliger la justification au profit du seul résultat numérique.\u003c/li>\n\u003c/ul>\n\u003ch3>7. Synthèse\u003c/h3>\n\u003cp>Retenir les définitions, les formules ou étapes de méthode, et savoir les mobiliser dans un contexte professionnel. S'entraîner régulièrement avec des exercices types examen.\u003c/p>\n\u003cdiv class=\"memo\">\u003cstrong>À retenir\u003c/strong> — Maîtriser le vocabulaire, les méthodes et les liens avec le métier. S'entraîner sur des annales et des cas concrets.\u003c/div>\n", "resume": ["Chapitre Relation client en magasin : notions essentielles du référentiel.", "Savoir définir, appliquer une méthode et justifier.", "Relier la théorie aux situations professionnelles."], "points_cles": ["Relation client en magasin", "Management et vente", "Méthode", "Cas professionnel", "Examen"], "exercices": [{"question": "Définir précisément la notion centrale de « Relation client en magasin ».", "correction": "Réponse attendue : définition du cours + une phrase de contexte professionnel."}, {"question": "Donner une méthode en 4 étapes pour traiter un problème lié à Relation client en magasin.", "correction": "1) Analyser 2) Choisir le modèle 3) Appliquer 4) Vérifier et conclure."}, {"question": "Citer deux erreurs fréquentes sur ce thème et comment les éviter.", "correction": "Voir section « Erreurs fréquentes » du cours."}, {"question": "Proposer un exemple concret d'application professionnelle de Relation client en magasin.", "correction": "Exemple contextualisé au métier du BTS concerné."}, {"question": "Quels liens avec d'autres matières du BTS pouvez-vous iden éfinitions et notions clés\u003c/h3>\n\u003cp>Les définitions précises sont indispensables. Chaque terme technique doit être compris, su et réutilisable dans un développement écrit ou oral.\u003c/p>\n\u003cul>\n\u003cli>Identifier les concepts centraux du chapitre.\u003c/li>\n\u003cli>Relier ces concepts aux situations professionnelles du métier.\u003c/li>\n\u003cli>Connaître le vocabulaire officiel du référentiel.\u003c/li>\n\u003c/ul>\n\u003ch3>3. Théorie et développement\u003c/h3>\n\u003cp>Le développement théorique s'appuie sur le programme officiel. Il faut distinguer ce qui est à connaître par cœur (définitions, formules, étapes de méthode) et ce qui doit être compris pour être réinvesti (raisonnements, comparaisons, choix techniques).\u003c/p>\n\u003cp>Les liens avec les autres matières du BTS sont à souligner : un même objet technique peut être abordé sous l'angle scientifique, technologique et professionnel.\u003c/p>\n\u003ch3>4. Méthodes et démarches\u003c/h3>\n\u003cp>Méthode type pour traiter un exercice ou une situation :\u003c/p>\n\u003col>\n\u003cli>Lire et comprendre la demande (mots-clés, données, contraintes).\u003c/li>\n\u003cli>Identifier le ou les modèles / formules / procédures applicables.\u003c/li>\n\u003cli>Organiser la démarche (étapes, schémas, tableaux).\u003c/li>\n\u003cli>Calculer ou argumenter en justifiant.\u003c/li>\n\u003cli>Vérifier la cohérence du résultat (ordre de grandeur, unités, sens physique ou économique).\u003c/li>\n\u003cli>Conclure en répondant clairement à la question posée.\u003c/li>\n\u003c/ol>\n\u003ch3>5. Exemples et cas professionnels\u003c/h3>\n\u003cp>Les situations professionnelles du BTS demandent de relier la théorie au terrain : choix d'un équipement, diagnostic, conseil client, rédaction d'un document technique, respect d'une norme ou d'une procédure de sécurité.\u003c/p>\n\u003ch3>6. Erreurs fréquentes\u003c/h3>\n\u003cul>\n\u003cli>Confondre des notions proches.\u003c/li>\n\u003cli>Oublier les unités ou les conditions d'application d'une formule.\u003c/li>\n\u003cli>Répondre à côté de la question faute d'avoir repéré les mots-clés.\u003c/li>\n\u003cli>Négliger la justification au profit du seul résultat numérique.\u003c/li>\n\u003c/ul>\n\u003ch3>7. Synthèse\u003c/h3>\n\u003cp>Retenir les définitions, les formules ou étapes de méthode, et savoir les mobiliser dans un contexte professionnel. S'entraîner régulièrement avec des exercices types examen.\u003c/p>\n\u003cdiv class=\"memo\">\u003cstrong>À retenir\u003c/strong> — Maîtriser le vocabulaire, les méthodes et les liens avec le métier. S'entraîner sur des annales et des cas concrets.\u003c/div>\n", "resume": ["Chapitre Techniques de négociation-vente : notions essentielles du référentiel.", "Savoir définir, appliquer une méthode et justifier.", "Relier la théorie aux situations professionnelles."], "points_cles": ["Techniques de négociation-vente", "Négociation", "Méthode", "Cas professionnel", "Examen"], "exercices": [{"question": "Définir précisément la notion centrale de « Techniques de négociation-vente ».", "correction": "Réponse attendue : définition du cours + une phrase de contexte professionnel."}, {"question": "Donner une méthode en 4 étapes pour traiter un problème lié à Techniques de négociation-vente.", "correction": "1) Analyser 2) Choisir le modèle 3) Appliquer 4) Vérifier et conclure."}, {"question": "Citer deux erreurs fréquentes sur ce thème et comment les éviter.", "correction": "Voir section « Erreurs fréquentes » du cours."}, {"question": "Proposer un exemple concret d'application professionnelle de Techniques de négociation-vente.", "correction": "Exemple contextualisé au métier du BTS concerné."}, {"question": "Quels liens avec d'autres matières du BTS pouvez-vous identifier ?", "correction": "Selon le référentiel : sciences, technologie, économie, communication…"}, {"question": "Rédiger une synthèse de 5 lignes sur ce chapitre.", "correction": "Reprendre les 3 à 5 idées fortes du cours."}, {" "]}]}}, "bts-tp": {"nom": "BTS Travaux Publics", "matieres": {"Travaux publics": [{"titre": "Terrassements et routes", "sous": ["Géotechnique de base", "Couches de chaussée"], "notions": ["Portance", "Compactage"]}, {"titre": "Ouvrages et réseaux", "sous": ["Assainissement", "VRD"], "notions": ["VRD", "Canalisation"]}]}}, "bts-fed": {"nom": "BTS Fluides Énergies Domotique", "matieres": {"Énergies et fluides": [{"titre": "Chauffage et climatisation", "sous": ["Production", "Distribution", "Émetteurs"], "notions": ["PAC", "Rendement"]}, {"titre": "Domotique et GTB", "sous": ["Automatismes du bâtiment", "Protocoles"], "notions": ["GTB", "KNX"]}]}}, "bts-enveloppe": {"nom": "BTS Enveloppe des Bâtiments", "matieres": {"Enveloppe": [{"titre": "Façades et toitures", "sous": ["Matériaux", "Étanchéité", "Isolation"], "notions": ["ITE", "Pont thermique"]}, {"titre": "Performance énergétique", "sous": ["Réglementation thermique", "Calculs"], "notions": ["RE2020", "U"]}]}}, "bts-geometre": {"nom": "BTS Géomètre-Topographe", "matieres": {"Topographie": [{"titre": "Mesures et instruments", "sous": ["Nivellement", "Tachéométrie", "GPS"], "notions": ["Altitude", "Coordonnées"]}, {"titre": "Calculs et plans", "sous": ["Cheminements", "DAO", "SIG"], "notions": ["Projection", "Cadastre"]}], "Droit et foncier": [{"titre": "Cadastre et propriété", "sous": ["Bornage", "Division"], "notions": ["Titre", "Servitude"]}]}}, "bts-cira2": {"nom": "BTS Systèmes Numériques", "matieres": {"Systèmes numériques": [{"titre": "Électronique numérique", "sous": ["Logique", "Microcontrôleurs"], "notions": ["Porte logique", "Bus"]}, {"titre": "Réseaux et télécoms", "sous": ["Protocoles", "Transmission"], "notions": ["Modulation"]}]}}};
const STATS = { nMatieres: 78, nChapStruct: 164 };
const App = {
  progress: JSON.parse(localStorage.getItem("esf_progress") || "{}"),
  favoris: JSON.parse(localStorage.getItem("esf_favoris") || "[]"),
  history: JSON.parse(localStorage.getItem("esf_history") || "[]"),
  currentCours: null,
  init() {
    if (localStorage.getItem("esf_theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");
    this.buildSidebar();
    this.goHome();
  },
  save() {
    localStorage.setItem("esf_progress", JSON.stringify(this.progress));
    localStorage.setItem("esf_favoris", JSON.stringify(this.favoris));
    localStorage.setItem("esf_history", JSON.stringify(this.history));
  },
  toggleTheme() {
    const d = document.documentElement.getAttribute("data-theme") === "dark";
    document.documentElement.setAttribute("data-theme", d ? "" : "dark");
    localStorage.setItem("esf_theme", d ? "light" : "dark");
  },
  getProgress(id) { return this.progress[id] || "todo"; },
  setProgress(id, s) { this.progress[id] = s; this.save(); },
  toggleFavori(id) {
    const i = this.favoris.indexOf(id);
    if (i >= 0) this.favoris.splice(i, 1); else this.favoris.push(id);
    this.save();
    if (this.currentCours && this.currentCours.id === id) this.openCours(id);
  },
  addHistory(id) {
    this.history = this.history.filter(x => x !== id);
    this.history.unshift(id);
    if (this.history.length > 40) this.history.pop();
    this.save();
  },
  buildSidebar() {
    let html = "<h3>Catalogue BTS</h3>";
    FORMATIONS.forEach(f => {
      html += '<a data-id="' + f.id + '" onclick="App.openFormation(\'' + f.id + '\')">' + f.icone + " " + f.nom.replace(/^BTS /, "") + "</a>";
    });
    document.getElementById("sidebar").innerHTML = html;
  },
  goHome() {
    document.querySelectorAll(".side a").forEach(a => a.classList.remove("on"));
    const cards = FORMATIONS.map(f => {
      const nContent = COURS_DB.filter(c => c.formation === f.id).length;
      const nStruct = f.nb_chapitres_structure || 0;
      return '<div class="card" onclick="App.openFormation(\'' + f.id + '\')"><div class="ic">' + f.icone + "</div><h3>" + f.nom + "</h3><p>" + nStruct + " chap. structure / " + nContent + " avec contenu</p></div>";
    }).join("");
    document.getElementById("main").innerHTML =
      "<h1>Catalogue des BTS francais</h1>" +
      "<p class=\"lead\">Structure pedagogique complete — matieres, chapitres, sous-chapitres, notions cles</p>" +
      "<div class=\"stats\">" +
      "<div class=\"stat\"><strong>" + FORMATIONS.length + "</strong>BTS</div>" +
      "<div class=\"stat\"><strong>" + STATS.nMatieres + "</strong>Matieres</div>" +
      "<div class=\"stat\"><strong>" + STATS.nChapStruct + "</strong>Chapitres</div>" +
      "<div class=\"stat\"><strong>" + COURS_DB.length + "</strong>Avec contenu</div>" +
      "</div><div class=\"sec-title\">Formations</div><div class=\"grid\">" + cards + "</div>";
  },
  openFormation(id) {
    const f = FORMATIONS.find(x => x.id === id);
    const st = STRUCTURE[id];
    document.querySelectorAll(".side a").forEach(a => a.classList.toggle("on", a.dataset.id === id));
    if (!st) {
      document.getElementById("main").innerHTML = "<h1>" + (f ? f.nom : id) + "</h1><p>Structure non disponible.</p>";
      return;
    }
    let html = '<div class="breadcrumb"><span onclick="App.goHome()">Accueil</span> › ' + st.nom + "</div>";
    html += "<h1>" + (f ? f.icone + " " : "") + st.nom + "</h1>";
    html += '<p class="lead">Structure du referentiel. Badge vert = cours disponible.</p>';
    for (const mat of Object.keys(st.matieres)) {
      const chs = st.matieres[mat];
      html += '<div class="matiere-block"><h3>' + mat + "</h3>";
      chs.forEach(ch => {
        const match = COURS_DB.find(c => c.formation === id && c.titre && ch.titre &&
          c.titre.toLowerCase().indexOf(ch.titre.toLowerCase().slice(0, Math.min(12, ch.titre.length))) >= 0);
        let badge = match
          ? '<button class="btn" onclick="App.openCours(\'' + match.id + '\')">Ouvrir le cours</button>'
          : '<span class="badge todo">Structure</span>';
        html += '<div class="chap-line"><strong>' + ch.titre + "</strong> " + badge;
        if (ch.sous && ch.sous.length) html += "<div>" + ch.sous.map(s => '<span class="tag">' + s + "</span>").join(" ") + "</div>";
        if (ch.notions && ch.notions.length) html += '<div style="font-size:.78rem;color:var(--m)">Notions : ' + ch.notions.join(" · ") + "</div>";
        html += "</div>";
      });
      html += "</div>";
    }
    const content = COURS_DB.filter(c => c.formation === id);
    if (content.length) {
      html += '<div class="sec-title">Chapitres avec contenu detaille (' + content.length + ")</div>";
      content.forEach(c => {
        const stt = this.getProgress(c.id);
        const b = stt === "done" ? '<span class="badge done">Termine</span>' : (stt === "progress" ? '<span class="badge progress">En cours</span>' : '<span class="badge todo">A faire</span>');
        html += '<div class="chapitre-item" onclick="App.openCours(\'' + c.id + '\')"><div><strong>' + c.titre + '</strong><div style="font-size:.8rem;color:var(--m)">' + (c.matiere || "") + "</div></div>" + b + "</div>";
      });
    }
    document.getElementById("main").innerHTML = html;
  },
  openCours(id) {
    const c = COURS_DB.find(x => x.id === id);
    if (!c) return;
    this.currentCours = c;
    this.addHistory(id);
    if (this.getProgress(id) === "todo") this.setProgress(id, "progress");
    const isFav = this.favoris.includes(id);
    let html = '<div class="breadcrumb"><span onclick="App.goHome()">Accueil</span> › <span onclick="App.openFormation(\'' + c.formation + '\')">' + (c.formationNom || c.formation) + "</span> › " + c.titre + "</div>";
    html += '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem"><h1>' + c.titre + "</h1><div>";
    html += '<span class="fav" onclick="App.toggleFavori(\'' + id + '\')">' + (isFav ? "⭐" : "☆") + "</span> ";
    html += '<button class="btn btn-sec" onclick="App.setProgress(\'' + id + '\',\'done\');App.openCours(\'' + id + '\')">Marquer termine</button></div></div>';
    html += '<p style="color:var(--m);font-size:.88rem">' + (c.formationNom || "") + " · " + (c.matiere || "") + "</p>";
    html += '<div class="tabs">';
    ["cours","resume","exercices","corriges","qcm","flashcards"].forEach(t => {
      html += '<button' + (t === "cours" ? ' class="on"' : "") + ' data-tab="' + t + '" onclick="App.showTab(\'' + t + '\')">' + t.charAt(0).toUpperCase() + t.slice(1) + "</button>";
    });
    html += "</div>";
    html += '<div id="panel-cours" class="panel show"><h2>Cours</h2>' + (c.cours || "<p>Contenu structurel.</p>") + "</div>";
    html += '<div id="panel-resume" class="panel"><h2>Resume</h2><ul>' + (c.resume || []).map(r => "<li>" + r + "</li>").join("") + '</ul><div class="memo"><strong>Points cles</strong><br>' + (c.points_cles || []).join(" · ") + "</div></div>";
    html += '<div id="panel-exercices" class="panel"><h2>Exercices</h2>' + (c.exercices || []).map((e,i) => '<div class="exo"><strong>Exercice ' + (i+1) + "</strong><br>" + e.question + "</div>").join("") + "</div>";
    html += '<div id="panel-corriges" class="panel"><h2>Corriges</h2>' + (c.exercices || []).map((e,i) => '<div class="memo"><strong>Ex. ' + (i+1) + "</strong><br>" + e.question + "<br><em>→ " + (e.correction || "") + "</em></div>").join("") + "</div>";
    html += '<div id="panel-qcm" class="panel"><h2>QCM</h2><div id="qcm-area">' + this.renderQCM(c) + '</div><button class="btn" onclick="App.checkQCM()">Verifier</button></div>';
    html += '<div id="panel-flashcards" class="panel"><h2>Flashcards</h2>' + (c.flashcards || []).map((f,i) => '<div class="flash-card" onclick="this.classList.toggle(\'flipped\')"><div class="front"><strong>Q' + (i+1) + "</strong><br>" + f.question + '</div><div class="back"><strong>Reponse</strong><br>' + f.reponse + "</div></div>").join("") + "</div>";
    document.getElementById("main").innerHTML = html;
  },
  showTab(tab) {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("show"));
    const p = document.getElementById("panel-" + tab);
    if (p) p.classList.add("show");
  },
  renderQCM(c) {
    return (c.qcm || []).map((q,i) => {
      let h = '<div class="qcm-item" data-idx="' + i + '"><strong>' + (i+1) + ". " + q.question + '</strong><div class="choix">';
      (q.choix || []).forEach(ch => { h += '<label><input type="radio" name="qcm' + i + '" value="' + ch.replace(/"/g, "&quot;") + '"> ' + ch + "</label>"; });
      h += '</div><div class="resultat" style="margin-top:.4rem;font-weight:600"></div></div>';
      return h;
    }).join("");
  },
  checkQCM() {
    if (!this.currentCours) return;
    (this.currentCours.qcm || []).forEach((q,i) => {
      const item = document.querySelector('.qcm-item[data-idx="' + i + '"]');
      if (!item) return;
      const sel = item.querySelector('input[name="qcm' + i + '"]:checked');
      const res = item.querySelector(".resultat");
      if (!sel) { res.textContent = "Pas de reponse"; res.style.color = "var(--m)"; }
      else if (sel.value === q.reponse) { res.textContent = "Correct"; res.style.color = "#16a34a"; }
      else { res.textContent = "Incorrect — " + q.reponse; res.style.color = "#ef4444"; }
    });
  },
  showFavoris() {
    const list = this.favoris.map(id => {
      const c = COURS_DB.find(x => x.id === id);
      return c ? '<div class="chapitre-item" onclick="App.openCours(\'' + id + '\')"><strong>' + c.titre + "</strong><span>" + (c.formationNom || "") + "</span></div>" : "";
    }).join("") || "<p>Aucun favori.</p>";
    document.getElementById("main").innerHTML = '<div class="breadcrumb"><span onclick="App.goHome()">Accueil</span> › Favoris</div><h1>Favoris</h1>' + list;
  },
  showHistory() {
    const list = this.history.map(id => {
      const c = COURS_DB.find(x => x.id === id);
      return c ? '<div class="chapitre-item" onclick="App.openCours(\'' + id + '\')"><strong>' + c.titre + "</strong><span>" + (c.formationNom || "") + "</span></div>" : "";
    }).join("") || "<p>Aucun historique.</p>";
    document.getElementById("main").innerHTML = '<div class="breadcrumb"><span onclick="App.goHome()">Accueil</span> › Historique</div><h1>Historique</h1>' + list;
  },
  globalSearch(q) {
    if (!q || q.length < 2) return;
    const low = q.toLowerCase();
    let structHits = [];
    Object.keys(STRUCTURE).forEach(fid => {
      const st = STRUCTURE[fid];
      Object.keys(st.matieres).forEach(mat => {
        st.matieres[mat].forEach(ch => {
          if ((ch.titre || "").toLowerCase().indexOf(low) >= 0 || mat.toLowerCase().indexOf(low) >= 0 ||
              (ch.notions || []).some(n => (n || "").toLowerCase().indexOf(low) >= 0)) {
            structHits.push({fid: fid, nom: st.nom, mat: mat, titre: ch.titre});
          }
        });
      });
    });
    const contentHits = COURS_DB.filter(c =>
      (c.titre || "").toLowerCase().indexOf(low) >= 0 ||
      (c.matiere || "").toLowerCase().indexOf(low) >= 0 ||
      (c.points_cles || []).some(p => (p || "").toLowerCase().indexOf(low) >= 0)
    );
    let html = '<div class="breadcrumb"><span onclick="App.goHome()">Accueil</span> › Recherche</div><h1>Resultats</h1>';
    if (contentHits.length) {
      html += '<div class="sec-title">Cours (' + contentHits.length + ")</div>";
      contentHits.forEach(c => {
        html += '<div class="chapitre-item" onclick="App.openCours(\'' + c.id + '\')"><strong>' + c.titre + "</strong><span>" + (c.formationNom || "") + "</span></div>";
      });
    }
    if (structHits.length) {
      html += '<div class="sec-title">Structure (' + structHits.length + ")</div>";
      structHits.slice(0, 50).forEach(h => {
        html += '<div class="chapitre-item" onclick="App.openFormation(\'' + h.fid + '\')"><div><strong>' + h.titre + '</strong><div style="font-size:.8rem;color:var(--m)">' + h.nom + " · " + h.mat + "</div></div></div>";
      });
    }
    if (!contentHits.length && !structHits.length) html += "<p>Aucun resultat.</p>";
    document.getElementById("main").innerHTML = html;
  }
};
document.addEventListener("DOMContentLoaded", function() {
  App.init();
  document.getElementById("search-form").addEventListener("submit", function(e) {
    e.preventDefault();
    App.globalSearch(document.getElementById("search-input").value.trim());
  });
});
</script>
</body>
</html>
