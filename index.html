<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>War Street 3D — Build étendu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#05080f;font-family:system-ui,-apple-system,sans-serif;color:#e2e8f0}
#boot{
  position:absolute;inset:0;background:#0a0e17;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:50;gap:12px;
}
#boot h1{font-size:2.4rem;color:#38bdf8}
#boot .sub{color:#64748b;max-width:480px;text-align:center;line-height:1.5}
.panel{
  background:#111827;border:1px solid #1e293b;border-radius:16px;padding:18px;
  max-width:900px;width:94%;
}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.mode-btn,.char-card,.map-btn{
  background:#0f172a;border:2px solid #1e293b;border-radius:12px;padding:12px 14px;
  cursor:pointer;transition:.15s;min-width:120px;text-align:center;
}
.mode-btn:hover,.char-card:hover,.map-btn:hover{border-color:#475569}
.mode-btn.sel,.char-card.sel,.map-btn.sel{border-color:#38bdf8;box-shadow:0 0 0 1px #38bdf8}
.char-card h3{font-size:14px;margin-bottom:2px}
.char-card .meta{font-size:11px;color:#94a3b8}
.char-card .preview{
  width:64px;height:80px;margin:0 auto 8px;border-radius:10px;background:#0b1220;
  display:flex;align-items:flex-end;justify-content:center;position:relative;
}
#startBtn{
  margin-top:14px;padding:14px 40px;border:0;border-radius:12px;
  background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#0f172a;font-weight:800;
  font-size:16px;cursor:pointer;
}
#hud{
  position:absolute;top:0;left:0;right:0;padding:10px 16px;display:none;
  gap:12px;align-items:center;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent);
  z-index:10;pointer-events:none;font-size:13px;flex-wrap:wrap;
}
.bar{width:100px;height:10px;background:#1e293b;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar>div{height:100%;transition:width .2s}
#cross{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:16px;height:16px;border:2px solid rgba(255,255,255,.7);border-radius:50%;
  pointer-events:none;z-index:10;display:none;
}
#msg{
  position:absolute;top:60px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.85);padding:8px 16px;border-radius:8px;opacity:0;
  transition:.3s;z-index:12;pointer-events:none;font-size:14px;max-width:90%;text-align:center;
}
#msg.show{opacity:1}
#killfeed{
  position:absolute;top:70px;right:12px;width:220px;z-index:10;pointer-events:none;
  font-size:12px;display:none;
}
#killfeed div{background:rgba(0,0,0,.55);margin-bottom:4px;padding:4px 8px;border-radius:6px}
#score{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:10;
  background:rgba(0,0,0,.6);padding:6px 14px;border-radius:8px;font-size:13px;display:none;
}
#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);color:#64748b;font-size:11px;z-index:10;display:none}
.step-title{color:#38bdf8;font-weight:700;margin:8px 0 10px;font-size:15px}
</style>
</head>
<body>

<div id="boot">
  <h1>War Street</h1>
  <p class="sub">Prototype 3D étendu — personnages, modes, rue urbaine avec bâtiments accessibles. On enrichit progressivement.</p>

  <div class="panel" style="margin-top:8px">
    <div class="step-title">1. Mode de jeu</div>
    <div class="row" id="modes"></div>
    <div class="step-title" style="margin-top:16px">2. Personnage</div>
    <div class="row" id="chars" style="max-height:280px;overflow:auto"></div>
    <div class="step-title" style="margin-top:16px">3. Ambiance</div>
    <div class="row" id="ambience"></div>
    <div style="text-align:center">
      <button id="startBtn">Lancer la partie</button>
    </div>
  </div>
</div>

<div id="hud">
  <div id="pName" style="font-weight:700;color:#38bdf8">—</div>
  <div>❤️ <div class="bar"><div id="hpBar" style="width:100%;background:#ef4444"></div></div></div>
  <div>🍖 <div class="bar"><div id="hungerBar" style="width:100%;background:#f97316"></div></div></div>
  <div id="wpn">—</div>
  <div id="modeTag" style="color:#94a3b8"></div>
  <div style="margin-left:auto" id="kills">Kills 0</div>
</div>
<div id="score"></div>
<div id="cross"></div>
<div id="msg"></div>
<div id="killfeed"></div>
<div id="hint">ZQSD · Souris · Clic tir · Espace saut · E ramasser · Entrées dans les immeubles</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

/* ========================================================================
   WAR STREET — Extended prototype
   Objectif : base jouable 3D + contenu dense (personnages, modes, map rue,
   pickups, bots, HUD) pour itérer ensuite vers un vrai jeu.
   ======================================================================== */

const MODES = [
  { id:"ffa", name:"Chacun pour soi", desc:"Tous contre tous. Dernier en vie ou plus de kills." },
  { id:"tdm", name:"Équipes", desc:"2 équipes. Objectif : plus d'éliminations." },
  { id:"surv", name:"Survie", desc:"Tu es seul face aux bots. Tiens le plus longtemps." },
  { id:"hunt", name:"Chasse", desc:"Moins de munitions, plus de pickups à sécuriser." }
];

const AMBIENCES = [
  { id:"day", name:"Jour", sky:0x87b5d9, fog:0x87b5d9, sun:1.15 },
  { id:"dusk", name:"Crépuscule", sky:0xc47a5a, fog:0xb06a50, sun:0.75 },
  { id:"night", name:"Nuit", sky:0x0b1220, fog:0x0b1220, sun:0.25 }
];

/* Personnages — roster large avec stats et identité */
const CHARACTERS = [
  { id:"akira", name:"Akira", role:"Assault", hp:100, speed:9.2, accuracy:0.88, hungerRate:1.1, color:0x3b82f6, hair:0x1e293b, shirt:0x1d4ed8, pants:0x0f172a, skin:0xfcd9b6, weapon:"rifle", bio:"Équilibré, bon en combat urbain." },
  { id:"yuki", name:"Yuki", role:"Scout", hp:76, speed:12.8, accuracy:0.78, hungerRate:1.4, color:0x34d399, hair:0xf8fafc, shirt:0x059669, pants:0x164e63, skin:0xffe4c9, weapon:"smg", bio:"Très mobile, fragile." },
  { id:"ronin", name:"Ronin", role:"Tank", hp:158, speed:6.0, accuracy:0.72, hungerRate:1.6, color:0xf97316, hair:0x292524, shirt:0x9a3412, pants:0x1c1917, skin:0xe8b88a, weapon:"shotgun", bio:"Encaisse, avance." },
  { id:"hana", name:"Hana", role:"Sniper", hp:80, speed:7.6, accuracy:0.96, hungerRate:0.9, color:0xa78bfa, hair:0x4c1d95, shirt:0x5b21b6, pants:0x1e1b4b, skin:0xf5d0c5, weapon:"sniper", bio:"Précision longue distance." },
  { id:"kenji", name:"Kenji", role:"Heavy", hp:148, speed:5.6, accuracy:0.70, hungerRate:1.7, color:0xef4444, hair:0x450a0a, shirt:0x991b1b, pants:0x1c1917, skin:0xd4a574, weapon:"lmg", bio:"Volume de feu maximal." },
  { id:"mio", name:"Mio", role:"Médic", hp:94, speed:8.9, accuracy:0.84, hungerRate:1.0, color:0xf472b6, hair:0x831843, shirt:0xbe185d, pants:0x1e1b4b, skin:0xffe4e6, weapon:"pistol", bio:"Survie et soin au ramassage." },
  { id:"sora", name:"Sora", role:"Ghost", hp:72, speed:11.5, accuracy:0.90, hungerRate:1.2, color:0x94a3b8, hair:0x0f172a, shirt:0x334155, pants:0x020617, skin:0xe7d3b8, weapon:"smg", bio:"Rapide et précis." },
  { id:"ryu", name:"Ryu", role:"Berserk", hp:118, speed:10.2, accuracy:0.74, hungerRate:1.9, color:0xfbbf24, hair:0x78350f, shirt:0xb45309, pants:0x1c1917, skin:0xc68642, weapon:"shotgun", bio:"Agressif, faim rapide." },
  { id:"nova", name:"Nova", role:"Support", hp:96, speed:8.4, accuracy:0.82, hungerRate:1.05, color:0x22d3ee, hair:0x164e63, shirt:0x0e7490, pants:0x0f172a, skin:0xfde68a, weapon:"rifle", bio:"Polyvalente en milieu fermé." },
  { id:"jax", name:"Jax", role:"Breacher", hp:125, speed:7.2, accuracy:0.76, hungerRate:1.35, color:0xf43f5e, hair:0x3f1a1a, shirt:0x9f1239, pants:0x1c1917, skin:0xe8b48a, weapon:"shotgun", bio:"Spécialiste portes et courtes distances." }
];

const WEAPONS = {
  pistol:  { name:"Pistolet", dmg:16, rate:0.25, speed:52, spread:0.04, ammo:12, reload:0.9 },
  smg:     { name:"SMG", dmg:10, rate:0.08, speed:48, spread:0.1, ammo:30, reload:1.2 },
  rifle:   { name:"Fusil d'assaut", dmg:20, rate:0.13, speed:62, spread:0.03, ammo:25, reload:1.4 },
  shotgun: { name:"Fusil à pompe", dmg:9, rate:0.62, speed:38, spread:0.2, ammo:6, reload:1.6, pellets:7 },
  sniper:  { name:"Sniper", dmg:70, rate:1.0, speed:88, spread:0.004, ammo:5, reload:2.0 },
  lmg:     { name:"Mitrailleuse", dmg:13, rate:0.095, speed:55, spread:0.08, ammo:50, reload:2.6 }
};

/* Sélection UI */
let selectedMode = MODES[0];
let selectedChar = CHARACTERS[0];
let selectedAmb = AMBIENCES[0];

const modesEl = document.getElementById("modes");
MODES.forEach((m,i)=>{
  const b=document.createElement("div");
  b.className="mode-btn"+(i===0?" sel":"");
  b.innerHTML=`<b>${m.name}</b><div style="font-size:11px;color:#94a3b8;margin-top:4px">${m.desc}</div>`;
  b.onclick=()=>{document.querySelectorAll(".mode-btn").forEach(e=>e.classList.remove("sel"));b.classList.add("sel");selectedMode=m;};
  modesEl.appendChild(b);
});

const charsEl = document.getElementById("chars");
CHARACTERS.forEach((c,i)=>{
  const d=document.createElement("div");
  d.className="char-card"+(i===0?" sel":"");
  d.innerHTML=`
    <div class="preview">
      <div style="width:26px;height:34px;background:#${c.shirt.toString(16).padStart(6,'0')};border-radius:5px;position:relative">
        <div style="width:18px;height:18px;border-radius:50%;background:#${c.skin.toString(16).padStart(6,'0')};position:absolute;top:-12px;left:4px;box-shadow:0 -3px 0 2px #${c.hair.toString(16).padStart(6,'0')}"></div>
      </div>
    </div>
    <h3 style="color:#${c.color.toString(16).padStart(6,'0')}">${c.name}</h3>
    <div class="meta">${c.role} · PV ${c.hp} · Vit ${c.speed}</div>
    <div class="meta" style="margin-top:4px">${c.bio}</div>`;
  d.onclick=()=>{document.querySelectorAll(".char-card").forEach(e=>e.classList.remove("sel"));d.classList.add("sel");selectedChar=c;};
  charsEl.appendChild(d);
});

const ambEl = document.getElementById("ambience");
AMBIENCES.forEach((a,i)=>{
  const b=document.createElement("div");
  b.className="map-btn"+(i===0?" sel":"");
  b.textContent=a.name;
  b.onclick=()=>{document.querySelectorAll(".map-btn").forEach(e=>e.classList.remove("sel"));b.classList.add("sel");selectedAmb=a;};
  ambEl.appendChild(b);
});

document.getElementById("startBtn").onclick=()=>startGame(selectedChar,selectedMode,selectedAmb);

function showMsg(t){
  const m=document.getElementById("msg");
  m.textContent=t; m.classList.add("show");
  clearTimeout(showMsg._t); showMsg._t=setTimeout(()=>m.classList.remove("show"),2800);
}
function pushFeed(text){
  const f=document.getElementById("killfeed");
  const d=document.createElement("div");
  d.textContent=text; f.prepend(d);
  while(f.children.length>6) f.lastChild.remove();
}

/* ========== Character mesh builder (more parts) ========== */
function createCharacter(c, scale=1){
  const g=new THREE.Group();
  const skinMat=new THREE.MeshStandardMaterial({color:c.skin,roughness:0.55});
  const shirtMat=new THREE.MeshStandardMaterial({color:c.shirt,roughness:0.7});
  const pantsMat=new THREE.MeshStandardMaterial({color:c.pants,roughness:0.8});
  const hairMat=new THREE.MeshStandardMaterial({color:c.hair,roughness:0.9});

  // legs
  [-0.15,0.15].forEach(sx=>{
    const leg=new THREE.Mesh(new THREE.CapsuleGeometry(0.11*scale,0.58*scale,4,8),pantsMat);
    leg.position.set(sx*scale,0.45*scale,0); leg.castShadow=true; g.add(leg);
  });
  // hips
  const hips=new THREE.Mesh(new THREE.BoxGeometry(0.42*scale,0.2*scale,0.28*scale),pantsMat);
  hips.position.y=0.78*scale; hips.castShadow=true; g.add(hips);
  // torso
  const torso=new THREE.Mesh(new THREE.CapsuleGeometry(0.3*scale,0.55*scale,4,10),shirtMat);
  torso.position.y=1.2*scale; torso.castShadow=true; g.add(torso);
  // arms
  [-1,1].forEach(side=>{
    const arm=new THREE.Mesh(new THREE.CapsuleGeometry(0.09*scale,0.5*scale,4,8),shirtMat);
    arm.position.set(side*0.4*scale,1.25*scale,0);
    arm.rotation.z=side*0.12; arm.castShadow=true; g.add(arm);
  });
  // head
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.25*scale,12,12),skinMat);
  head.position.y=1.88*scale; head.castShadow=true; g.add(head);
  // hair cap
  const hair=new THREE.Mesh(new THREE.SphereGeometry(0.27*scale,10,10,0,Math.PI*2,0,Math.PI*0.58),hairMat);
  hair.position.y=1.98*scale; hair.castShadow=true; g.add(hair);
  // eyes
  [-0.07,0.07].forEach(ex=>{
    const eye=new THREE.Mesh(new THREE.SphereGeometry(0.032*scale,6,6),new THREE.MeshStandardMaterial({color:0x111111}));
    eye.position.set(ex*scale,1.9*scale,0.21*scale); g.add(eye);
  });
  // chest detail stripe
  const stripe=new THREE.Mesh(new THREE.BoxGeometry(0.35*scale,0.08*scale,0.32*scale),new THREE.MeshStandardMaterial({color:c.color,roughness:0.5}));
  stripe.position.y=1.25*scale; g.add(stripe);

  return g;
}

/* ========== GAME ========== */
function startGame(cls, mode, amb){
  document.getElementById("boot").style.display="none";
  document.getElementById("hud").style.display="flex";
  document.getElementById("cross").style.display="block";
  document.getElementById("hint").style.display="block";
  document.getElementById("killfeed").style.display="block";
  document.getElementById("score").style.display="block";
  document.getElementById("modeTag").textContent=mode.name;

  const scene=new THREE.Scene();
  scene.background=new THREE.Color(amb.sky);
  scene.fog=new THREE.Fog(amb.fog,35,110);

  const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,200);
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // lights
  scene.add(new THREE.HemisphereLight(0xddeeff,0x334455, amb.id==="night"?0.35:0.75));
  const sun=new THREE.DirectionalLight(0xfff2dd, amb.sun);
  sun.position.set(25,45,15);
  sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.near=4; sun.shadow.camera.far=100;
  sun.shadow.camera.left=-35; sun.shadow.camera.right=35;
  sun.shadow.camera.top=35; sun.shadow.camera.bottom=-35;
  scene.add(sun);
  if(amb.id==="night"){
    const streetLight=new THREE.PointLight(0xffd9a0,1.2,28);
    streetLight.position.set(0,7,0); scene.add(streetLight);
  }

  /* ---- Detailed street map ---- */
  // asphalt
  const road=new THREE.Mesh(new THREE.PlaneGeometry(22,180), new THREE.MeshStandardMaterial({color:0x2a2a2a,roughness:0.95}));
  road.rotation.x=-Math.PI/2; road.position.y=0.01; road.receiveShadow=true; scene.add(road);
  // sidewalks
  [-13.5,13.5].forEach(x=>{
    const sw=new THREE.Mesh(new THREE.PlaneGeometry(7,180), new THREE.MeshStandardMaterial({color:0x6b6b6b,roughness:0.9}));
    sw.rotation.x=-Math.PI/2; sw.position.set(x,0.02,0); sw.receiveShadow=true; scene.add(sw);
  });
  // center lines
  for(let z=-80;z<=80;z+=7){
    const line=new THREE.Mesh(new THREE.PlaneGeometry(0.25,2.8), new THREE.MeshBasicMaterial({color:0xd4c400}));
    line.rotation.x=-Math.PI/2; line.position.set(0,0.03,z); scene.add(line);
  }
  // outer grass
  const grass=new THREE.Mesh(new THREE.PlaneGeometry(100,200), new THREE.MeshStandardMaterial({color:0x2f5a2f,roughness:1}));
  grass.rotation.x=-Math.PI/2; grass.position.y=-0.05; grass.receiveShadow=true; scene.add(grass);

  // buildings with interiors (door gap)
  function addBuilding(x,z,w,d,h,col){
    const g=new THREE.Group();
    const mat=new THREE.MeshStandardMaterial({color:col,roughness:0.78});
    const floor=new THREE.Mesh(new THREE.BoxGeometry(w-0.3,0.15,d-0.3), new THREE.MeshStandardMaterial({color:0x3d342c}));
    floor.position.y=0.08; floor.receiveShadow=true; g.add(floor);
    const ceil=new THREE.Mesh(new THREE.BoxGeometry(w,0.2,d), new THREE.MeshStandardMaterial({color:0x444444}));
    ceil.position.y=h; g.add(ceil);
    const t=0.32;
    // back / left / right
    const back=new THREE.Mesh(new THREE.BoxGeometry(w,h,t),mat); back.position.set(0,h/2,-d/2+t/2); back.castShadow=true; g.add(back);
    const left=new THREE.Mesh(new THREE.BoxGeometry(t,h,d),mat); left.position.set(-w/2+t/2,h/2,0); left.castShadow=true; g.add(left);
    const right=new THREE.Mesh(new THREE.BoxGeometry(t,h,d),mat); right.position.set(w/2-t/2,h/2,0); right.castShadow=true; g.add(right);
    // front with door
    const doorW=1.9, side=(w-doorW)/2;
    if(side>0.25){
      const fl=new THREE.Mesh(new THREE.BoxGeometry(side,h,t),mat); fl.position.set(-w/2+side/2,h/2,d/2-t/2); fl.castShadow=true; g.add(fl);
      const fr=new THREE.Mesh(new THREE.BoxGeometry(side,h,t),mat); fr.position.set(w/2-side/2,h/2,d/2-t/2); fr.castShadow=true; g.add(fr);
      const above=new THREE.Mesh(new THREE.BoxGeometry(doorW,Math.max(0.5,h-2.5),t),mat); above.position.set(0,2.5+(h-2.5)/2,d/2-t/2); g.add(above);
    }
    // window decals
    for(let wy=2; wy<h-1; wy+=2.2){
      for(let wx=-w/2+1.2; wx<w/2-1; wx+=2.4){
        const win=new THREE.Mesh(new THREE.PlaneGeometry(1.1,1.2), new THREE.MeshStandardMaterial({color:amb.id==="night"?0xffe6a0:0x88aacc, emissive:amb.id==="night"?0x664400:0x000000, emissiveIntensity:0.4}));
        win.position.set(wx, wy, d/2+0.02); g.add(win);
      }
    }
    const lamp=new THREE.PointLight(0xffe6c0, amb.id==="night"?0.9:0.35, 14);
    lamp.position.set(0,h-1.2,0); g.add(lamp);
    g.position.set(x,0,z); scene.add(g);
  }

  // left row
  addBuilding(-17.5,-50,11,14,10,0x7a6548);
  addBuilding(-18,-28,12,12,13,0x5c4c3c);
  addBuilding(-17,-8,10,13,9,0x6b5b4b);
  addBuilding(-18.5,14,13,12,12,0x4a5560);
  addBuilding(-17,36,11,14,11,0x8b7355);
  addBuilding(-18,58,12,12,14,0x5a4030);
  // right row
  addBuilding(17.5,-45,12,13,11,0x6b5344);
  addBuilding(18,-22,11,14,10,0x4a5a4a);
  addBuilding(17.5,0,13,12,15,0x5c4a3a);
  addBuilding(18,22,10,13,9,0x7a6a5a);
  addBuilding(17.5,44,12,12,12,0x455a6b);
  addBuilding(18,66,11,14,10,0x6b4a3a);

  // street props
  for(let i=0;i<18;i++){
    const crate=new THREE.Mesh(new THREE.BoxGeometry(1.1+Math.random()*0.4,1.1,1.1+Math.random()*0.3), new THREE.MeshStandardMaterial({color:0x8B5A2B,roughness:0.85}));
    crate.position.set((Math.random()>0.5?1:-1)*(9+Math.random()*5),0.55,-70+Math.random()*140);
    crate.rotation.y=Math.random()*1; crate.castShadow=true; scene.add(crate);
  }
  for(let i=0;i<8;i++){
    const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.5,1.2,10), new THREE.MeshStandardMaterial({color:0x3f3f46,metalness:0.3,roughness:0.6}));
    barrel.position.set((Math.random()-0.5)*16,0.6,-60+Math.random()*120); barrel.castShadow=true; scene.add(barrel);
  }
  // street lamps
  for(let z=-70;z<=70;z+=28){
    [-11,11].forEach(x=>{
      const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,5.5,8), new THREE.MeshStandardMaterial({color:0x222222}));
      pole.position.set(x,2.75,z); pole.castShadow=true; scene.add(pole);
      const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.25,8,8), new THREE.MeshStandardMaterial({color:0xffe8a0,emissive:0xffcc66,emissiveIntensity:amb.id==="night"?0.8:0.15}));
      lamp.position.set(x,5.6,z); scene.add(lamp);
      if(amb.id==="night"){
        const pl=new THREE.PointLight(0xffd9a0,0.7,16); pl.position.set(x,5.4,z); scene.add(pl);
      }
    });
  }

  /* player */
  const player={
    mesh:createCharacter(cls),
    hp:cls.hp, maxHp:cls.hp, hunger:100, speed:cls.speed, accuracy:cls.accuracy,
    hungerRate:cls.hungerRate, weapon:cls.weapon,
    ammo:WEAPONS[cls.weapon].ammo, reserve:WEAPONS[cls.weapon].ammo*3,
    lastShot:0, kills:0, deaths:0, velY:0, onGround:true, team: mode.id==="tdm"?0: -1
  };
  player.mesh.position.set(0,0,40); scene.add(player.mesh);

  /* bots */
  const bots=[];
  const botCount = mode.id==="surv"?8: mode.id==="hunt"?4:5;
  for(let i=0;i<botCount;i++){
    const bc=CHARACTERS[(i+1)%CHARACTERS.length];
    const bot={
      mesh:createCharacter(bc,0.97),
      hp:bc.hp, maxHp:bc.hp, speed:bc.speed*0.82, accuracy:bc.accuracy*0.75,
      weapon:bc.weapon, ammo:WEAPONS[bc.weapon].ammo, lastShot:0,
      dir:new THREE.Vector3(), timer:0, name:bc.name,
      team: mode.id==="tdm"?(i%2): -1
    };
    bot.mesh.position.set((Math.random()-0.5)*14,0,-55+i*(120/botCount)+Math.random()*6);
    scene.add(bot.mesh); bots.push(bot);
  }

  /* pickups denser */
  const pickups=[];
  const wKeys=Object.keys(WEAPONS);
  const spawnPick=(type,extra={})=>{
    let mesh;
    if(type==="weapon") mesh=new THREE.Mesh(new THREE.BoxGeometry(0.65,0.22,1.25), new THREE.MeshStandardMaterial({color:0x38bdf8,metalness:0.35,roughness:0.4}));
    else if(type==="food") mesh=new THREE.Mesh(new THREE.SphereGeometry(0.32,8,8), new THREE.MeshStandardMaterial({color:0xf97316}));
    else mesh=new THREE.Mesh(new THREE.SphereGeometry(0.28,8,8), new THREE.MeshStandardMaterial({color:0x22c55e}));
    mesh.position.set((Math.random()-0.5)*16, type==="weapon"?0.18:0.32, -70+Math.random()*140);
    scene.add(mesh);
    pickups.push({type, mesh, taken:false, ...extra});
  };
  for(let i=0;i<(mode.id==="hunt"?14:9);i++) spawnPick("weapon",{weapon:wKeys[i%wKeys.length]});
  for(let i=0;i<8;i++) spawnPick("food");
  for(let i=0;i<6;i++) spawnPick("health");

  const bullets=[];
  const keys={};
  window.addEventListener("keydown",e=>keys[e.code]=true);
  window.addEventListener("keyup",e=>keys[e.code]=false);
  let mouseDown=false, yaw=0, pitch=0.28;
  renderer.domElement.addEventListener("mousedown",()=>{mouseDown=true;renderer.domElement.requestPointerLock();});
  window.addEventListener("mouseup",()=>mouseDown=false);
  window.addEventListener("mousemove",e=>{
    if(document.pointerLockElement===renderer.domElement){
      yaw-=e.movementX*0.0022; pitch=Math.max(-0.55,Math.min(0.7,pitch-e.movementY*0.002));
    }
  });

  function shoot(ent, weaponId, acc=1){
    const w=WEAPONS[weaponId];
    const now=performance.now()/1000;
    if(now-ent.lastShot<w.rate) return;
    if(ent.ammo!==undefined && ent.ammo<=0) return;
    ent.lastShot=now; if(ent.ammo!==undefined) ent.ammo--;
    const origin=ent.mesh.position.clone(); origin.y+=1.35;
    const n=w.pellets||1;
    for(let i=0;i<n;i++){
      let dir;
      if(ent===player){
        dir=new THREE.Vector3(-Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw)*Math.cos(pitch));
      } else {
        dir=player.mesh.position.clone().sub(ent.mesh.position); dir.y+=1.1; dir.normalize();
      }
      dir.x+=(Math.random()-0.5)*w.spread*(1.5-acc);
      dir.y+=(Math.random()-0.5)*w.spread*(1.5-acc);
      dir.z+=(Math.random()-0.5)*w.spread*(1.5-acc);
      dir.normalize();
      const ball=new THREE.Mesh(new THREE.SphereGeometry(0.06,4,4), new THREE.MeshBasicMaterial({color:0xffe566}));
      ball.position.copy(origin); scene.add(ball);
      bullets.push({mesh:ball, dir, speed:w.speed, dmg:w.dmg, life:2.0, owner:ent});
    }
  }

  function updateHUD(){
    document.getElementById("pName").textContent=cls.name;
    document.getElementById("hpBar").style.width=Math.max(0,player.hp/player.maxHp*100)+"%";
    document.getElementById("hungerBar").style.width=Math.max(0,player.hunger)+"%";
    document.getElementById("wpn").textContent=`${WEAPONS[player.weapon].name} ${player.ammo}/${player.reserve}`;
    document.getElementById("kills").textContent=`Kills ${player.kills}`;
    const aliveBots=bots.filter(b=>b.hp>0).length;
    document.getElementById("score").textContent = mode.id==="tdm"
      ? `Équipe A  ${player.team===0?player.kills:0}  —  Équipe B  ${bots.filter(b=>b.team===1&&b.hp<=0).length}`
      : `Vivants bots : ${aliveBots} · Morts : ${player.deaths}`;
  }

  let last=performance.now();
  function loop(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;

    // move
    const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
    const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
    let mv=new THREE.Vector3();
    if(keys["KeyW"]||keys["KeyZ"]) mv.add(forward);
    if(keys["KeyS"]) mv.sub(forward);
    if(keys["KeyA"]||keys["KeyQ"]) mv.sub(right);
    if(keys["KeyD"]) mv.add(right);
    if(mv.length()>0){ mv.normalize().multiplyScalar(player.speed*dt); player.mesh.position.add(mv); }
    if(keys["Space"]&&player.onGround){ player.velY=7.2; player.onGround=false; }
    player.velY-=22*dt; player.mesh.position.y+=player.velY*dt;
    if(player.mesh.position.y<=0){ player.mesh.position.y=0; player.velY=0; player.onGround=true; }
    // clamp street-ish bounds soft
    player.mesh.position.x=Math.max(-20,Math.min(20,player.mesh.position.x));
    player.mesh.position.z=Math.max(-85,Math.min(85,player.mesh.position.z));
    player.mesh.rotation.y=yaw+Math.PI;

    // camera
    const target=player.mesh.position.clone();
    const off=new THREE.Vector3(Math.sin(yaw)*6.2, 2.7+pitch*1.4, Math.cos(yaw)*6.2);
    camera.position.lerp(target.clone().add(off),0.12);
    camera.lookAt(target.x, target.y+1.35-pitch*0.8, target.z);

    if(mouseDown && player.hp>0) shoot(player, player.weapon, player.accuracy);

    player.hunger=Math.max(0,player.hunger-player.hungerRate*dt);
    if(player.hunger<=0) player.hp-=3.5*dt;

    if(keys["KeyE"]){
      pickups.forEach(pk=>{
        if(pk.taken) return;
        if(pk.mesh.position.distanceTo(player.mesh.position)<2.1){
          pk.taken=true; pk.mesh.visible=false;
          if(pk.type==="weapon"){
            player.weapon=pk.weapon; player.ammo=WEAPONS[pk.weapon].ammo; player.reserve+=WEAPONS[pk.weapon].ammo;
            showMsg("Arme : "+WEAPONS[pk.weapon].name);
          } else if(pk.type==="food"){ player.hunger=Math.min(100,player.hunger+30); showMsg("+ faim"); }
          else { player.hp=Math.min(player.maxHp,player.hp+(cls.role==="Médic"?40:28)); showMsg("+ vie"); }
        }
      });
    }

    // bots AI
    bots.forEach(bot=>{
      if(bot.hp<=0){ bot.mesh.visible=false; return; }
      bot.timer-=dt;
      if(bot.timer<=0){
        bot.timer=0.7+Math.random()*1.4;
        const toP=player.mesh.position.clone().sub(bot.mesh.position);
        const sameTeam = mode.id==="tdm" && bot.team===player.team;
        if(!sameTeam && toP.length()<48 && player.hp>0){
          bot.dir.copy(toP.normalize());
          bot.mesh.lookAt(player.mesh.position.x, bot.mesh.position.y, player.mesh.position.z);
          if(toP.length()<38) shoot(bot, bot.weapon, bot.accuracy);
        } else {
          bot.dir.set(Math.random()-0.5,0,Math.random()-0.5).normalize();
        }
      }
      bot.mesh.position.add(bot.dir.clone().multiplyScalar(bot.speed*dt));
      bot.mesh.position.y=0;
      bot.mesh.position.x=Math.max(-19,Math.min(19,bot.mesh.position.x));
      bot.mesh.position.z=Math.max(-80,Math.min(80,bot.mesh.position.z));
    });

    // bullets
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];
      b.mesh.position.add(b.dir.clone().multiplyScalar(b.speed*dt));
      b.life-=dt;
      if(b.life<=0){ scene.remove(b.mesh); bullets.splice(i,1); continue; }
      if(b.owner!==player && player.hp>0 && b.mesh.position.distanceTo(player.mesh.position)<1.1){
        player.hp-=b.dmg; scene.remove(b.mesh); bullets.splice(i,1);
        if(player.hp<=0){ player.deaths++; showMsg("Éliminé"); player.hp=cls.hp; player.mesh.position.set(0,0,40); player.hunger=60; }
        continue;
      }
      for(const bot of bots){
        if(bot.hp<=0 || b.owner===bot) continue;
        if(mode.id==="tdm" && b.owner!==player && bot.team===b.owner.team) continue;
        if(b.mesh.position.distanceTo(bot.mesh.position)<1.1){
          bot.hp-=b.dmg; scene.remove(b.mesh); bullets.splice(i,1);
          if(bot.hp<=0 && b.owner===player){ player.kills++; pushFeed(`${cls.name} a éliminé ${bot.name}`); showMsg("Kill"); }
          break;
        }
      }
    }

    updateHUD();
    renderer.render(scene,camera);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  window.addEventListener("resize",()=>{
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
  });
  showMsg("Clique pour jouer — entre dans les bâtiments par les portes");
}

// Générateur de descriptions longues (contenu) pour densifier et documenter
function buildLoreDump(){
  const lines=[];
  CHARACTERS.forEach(c=>{
    lines.push(`# ${c.name} (${c.role})`);
    lines.push(`PV ${c.hp} | Vitesse ${c.speed} | Précision ${c.accuracy} | Arme ${c.weapon}`);
    lines.push(c.bio);
    lines.push(`Style visuel: peau ${c.skin.toString(16)}, cheveux ${c.hair.toString(16)}, tenue ${c.shirt.toString(16)} / ${c.pants.toString(16)}.`);
    lines.push(`Rôle tactique: ${c.role === "Tank" || c.role === "Heavy" ? "tenir l'angle et absorber" : c.role === "Scout" || c.role === "Ghost" ? "flanc et info" : c.role === "Sniper" ? "contrôle longue rue" : "polyvalent milieu de map"}.`);
    lines.push("");
  });
  MODES.forEach(m=>{
    lines.push(`Mode ${m.name}: ${m.desc}`);
  });
  lines.push("Map: avenue principale, deux rangées d'immeubles accessibles, props de cover, lampadaires, pickups armes/nourriture/soins.");
  lines.push("Objectif prototype: valider feel 3e personne + lecture de la rue + identité des classes avant assets manga finaux.");
  return lines.join("\n");
}
