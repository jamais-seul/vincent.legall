      <h3>1. Structure générale de l’œil</h3>
      <p>L’œil humain est un organe sensoriell approximativement sphérique (diamètre moyen ≈ 24 mm). Il est logé dans l’orbite osseuse et protégé par les paupières, les cils et le film lacrymal. On décrit classiquement trois tuniques concentriques :</p>

      <h3>1. Réfraction et loi de Snell-Descartes</h3>
      <p>Lorsqu’un rayon lumineux passe d’un milieu d’indice n₁ à un milieu d’indice n₂, il change de direction selon : <strong>n₁ sin i₁ = n₂ sin i₂</strong>. Plus l’écart d’indice est grand, plus la déviation est importante.</p>
      <h3>2. Vergence et dioptrie</h3>

function buildSidebar(){
  const side=document.getElementById("sidebar");
  const cats={};
  for(const [id,f] of Object.entries(formations)){
    if(!cats[f.cat]) cats[f.cat]=[];
    cats[f.cat].push({id,...f});
  }
  let html="";
  for(const [cat,list] of Object.entries(cats)){
    html+=`<h3>${cat}</h3>`;
    list.forEach(f=>{html+=`<a data-form="${f.id}" onclick="openForm('${f.id}')">${f.nom}</a>`});
  }
  side.innerHTML=html;
}

function goHome(){
  document.querySelectorAll("nav a").forEach(a=>a.classList.remove("on"));
  document.getElementById("nav-home").classList.add("on");
  document.querySelectorAll(".side a").forEach(a=>a.classList.remove("on"));
  const cards=Object.entries(formations).map(([id,f])=>`
    <div class="card" onclick="openForm('${id}')">
      <div class="ic">${f.icone}</div>
      <h3>${f.nom}</h3>
      <p>${f.desc}</p>
    </div>`).join("");
  document.getElementById("main").innerHTML=`
    <h1>Cours structurés — Études supérieures</h1>
    <p class="lead">Clique sur une formation → les chapitres s’affichent → clique sur un chapitre pour voir le cours (explications, résumé, exercices).</p>
    <div class="sec-title">Formations disponibles</div>
    <div class="grid">${cards}</div>`;
}

function openForm(id){
  const f=formations[id];
  if(!f) return;
  document.querySelectorAll("nav a").forEach(a=>a.classList.remove("on"));
  document.getElementById("nav-formations").classList.add("on");
  document.querySelectorAll(".side a").forEach(a=>a.classList.toggle("on",a.dataset.form===id));
  const chapList=Object.entries(chapitres).filter(([_,c])=>c.form===id).sort((a,b)=>a[1].num.localeCompare(b[1].num));
  const seqs=chapList.map(([cid,c])=>`
    <div class="seq" onclick="openCours('${cid}')">
      <div class="num">${c.num}</div>
      <div><h3>${c.titre}</h3><p>${c.sousTitre||""}</p></div>
    </div>`).join("");
  document.getElementById("main").innerHTML=`
    <div class="breadcrumb"><span onclick="goHome()">Accueil</span> › ${f.nom}</div>
    <h1>${f.icone} ${f.nom}</h1>
    <p class="lead">Clique sur un chapitre pour ouvrir le cours complet.</p>
    <div class="sec-title">Chapitres / Séquences</div>
    ${seqs||"<p>Aucun chapitre disponible pour le moment.</p>"}
    <div id="cours-container"></div>`;
  window.scrollTo(0,0);
}

function openCours(cid){
  const c=chapitres[cid];
  if(!c) return;
  const container=document.getElementById("cours-container");
  if(!container) return;
  container.innerHTML=`<div class="cours show"><h2>Chapitre ${c.num} — ${c.titre}</h2>${c.contenu}</div>`;
  container.scrollIntoView({behavior:"smooth",block:"start"});
}

buildSidebar();
goHome();
</script>
