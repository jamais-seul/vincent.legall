<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>War Arena — Prototype</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0e17;
  color:#e2e8f0;
  font-family: system-ui, -apple-system, sans-serif;
  overflow:hidden;
  height:100vh;
  display:flex;
  flex-direction:column;
}
#menu {
  position:absolute; inset:0; background:#0a0e17;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:20; gap:12px;
}
#menu h1 { font-size:2rem; color:#38bdf8; margin-bottom:4px; }
#menu p { color:#64748b; margin-bottom:16px; }
.class-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px; max-width:700px; width:90%;
}
.class-card {
  background:#111827; border:2px solid #1e293b; border-radius:12px;
  padding:12px; cursor:pointer; transition:.15s;
}
.class-card:hover, .class-card.selected { border-color:#38bdf8; background:#1e293b; }
.class-card h3 { font-size:15px; margin-bottom:4px; }
.class-card .stats { font-size:11px; color:#94a3b8; line-height:1.4; }
#menu button {
  margin-top:16px; padding:12px 32px; border:0; border-radius:10px;
  background:#38bdf8; color:#0f172a; font-weight:700; font-size:16px; cursor:pointer;
}
#hud {
  display:none; padding:8px 14px; background:#0f172a; border-bottom:1px solid #1e293b;
  align-items:center; gap:16px; font-size:13px; flex-wrap:wrap;
}
.bar-box { display:flex; align-items:center; gap:6px; }
.bar {
  width:90px; height:12px; background:#1e293b; border-radius:4px; overflow:hidden;
}
.bar div { height:100%; transition:width .2s; }
#canvas-wrap {
  flex:1; display:flex; justify-content:center; align-items:center;
  background:#020617; position:relative;
}
canvas {
  image-rendering: pixelated;
  border:2px solid #1e293b;
  max-width:100%; max-height:100%;
}
#msg {
  position:absolute; top:20px; left:50%; transform:translateX(-50%);
  background:rgba(15,23,42,.9); padding:8px 18px; border-radius:8px;
  font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none;
  border:1px solid #334155;
}
#msg.show { opacity:1; }
#controls {
  display:none; text-align:center; padding:6px; font-size:12px; color:#475569;
  background:#0f172a; border-top:1px solid #1e293b;
}
</style>
</head>
<body>

<div id="menu">
  <h1>⚔️ War Arena</h1>
  <p>Prototype — Choisis ton combattant</p>
  <div class="class-grid" id="classGrid"></div>
  <button onclick="startGame()">Lancer la partie</button>
</div>

<div id="hud">
  <div id="playerName" style="font-weight:700;color:#38bdf8">—</div>
  <div class="bar-box">❤️ <div class="bar"><div id="hpBar" style="width:100%;background:#ef4444"></div></div></div>
  <div class="bar-box">🍖 <div class="bar"><div id="hungerBar" style="width:100%;background:#f97316"></div></div></div>
  <div id="ammo">Munitions : —</div>
  <div id="kills" style="margin-left:auto">Kills : 0</div>
  <div id="alive">Vivants : —</div>
</div>

<div id="canvas-wrap">
  <canvas id="c" width="800" height="600"></canvas>
  <div id="msg"></div>
</div>

<div id="controls">
  ZQSD / WASD = bouger · Souris = viser · Clic = tirer · E = ramasser · R = recharger
</div>

<script>
"use strict";

/* ===================== DATA ===================== */
const CLASSES = [
  { id:"assault", name:"Assault", hp:100, speed:2.4, hungerRate:0.012, accuracy:0.85, color:"#38bdf8",
    desc:"Équilibré, bon à tout", weapon:"rifle" },
  { id:"scout", name:"Scout", hp:75, speed:3.2, hungerRate:0.018, accuracy:0.75, color:"#34d399",
    desc:"Très rapide, fragile", weapon:"smg" },
  { id:"tank", name:"Tank", hp:160, speed:1.7, hungerRate:0.02, accuracy:0.7, color:"#f97316",
    desc:"Très résistant, lent", weapon:"shotgun" },
  { id:"sniper", name:"Sniper", hp:80, speed:2.0, hungerRate:0.01, accuracy:0.95, color:"#a78bfa",
    desc:"Précision extrême", weapon:"sniper" },
  { id:"medic", name:"Médic", hp:90, speed:2.3, hungerRate:0.011, accuracy:0.8, color:"#f472b6",
    desc:"Soigne un peu en ramassant", weapon:"pistol" },
  { id:"heavy", name:"Heavy", hp:140, speed:1.5, hungerRate:0.022, accuracy:0.65, color:"#ef4444",
    desc:"Gros dégâts, très lent", weapon:"lmg" },
  { id:"ghost", name:"Ghost", hp:70, speed:2.8, hungerRate:0.014, accuracy:0.88, color:"#94a3b8",
    desc:"Discret et précis", weapon:"smg" },
  { id:"berserk", name:"Berserk", hp:110, speed:2.6, hungerRate:0.025, accuracy:0.72, color:"#fbbf24",
    desc:"Agressif, faim rapide", weapon:"shotgun" }
];

const WEAPONS = {
  pistol:  { name:"Pistolet", dmg:18, fireRate:280, range:320, spread:0.08, ammo:12, reload:900, color:"#e2e8f0" },
  smg:     { name:"SMG", dmg:12, fireRate:90, range:280, spread:0.14, ammo:30, reload:1200, color:"#94a3b8" },
  rifle:   { name:"Fusil d'assaut", dmg:22, fireRate:160, range:420, spread:0.06, ammo:25, reload:1400, color:"#38bdf8" },
  shotgun: { name:"Fusil à pompe", dmg:12, fireRate:700, range:180, spread:0.28, ammo:6, reload:1600, color:"#f97316", pellets:6 },
  sniper:  { name:"Sniper", dmg:65, fireRate:1100, range:700, spread:0.01, ammo:5, reload:2000, color:"#a78bfa" },
  lmg:     { name:"Mitrailleuse", dmg:16, fireRate:110, range:380, spread:0.12, ammo:50, reload:2800, color:"#ef4444" }
};

const MAP_W = 1600;
const MAP_H = 1200;

/* ===================== STATE ===================== */
let selectedClass = CLASSES[0];
let game = null;
let canvas, ctx;
let keys = {};
let mouse = { x:0, y:0, down:false };

/* ===================== MENU ===================== */
function buildMenu(){
  const grid = document.getElementById("classGrid");
  CLASSES.forEach((c,i) => {
    const d = document.createElement("div");
    d.className = "class-card" + (i===0 ? " selected" : "");
    d.innerHTML = `<h3 style="color:${c.color}">${c.name}</h3>
      <div class="stats">${c.desc}<br>PV ${c.hp} · Vitesse ${c.speed}<br>Arme : ${WEAPONS[c.weapon].name}</div>`;
    d.onclick = () => {
      document.querySelectorAll(".class-card").forEach(el => el.classList.remove("selected"));
      d.classList.add("selected");
      selectedClass = c;
    };
    grid.appendChild(d);
  });
}
buildMenu();

/* ===================== GAME ===================== */
function startGame(){
  document.getElementById("menu").style.display = "none";
  document.getElementById("hud").style.display = "flex";
  document.getElementById("controls").style.display = "block";

  canvas = document.getElementById("c");
  ctx = canvas.getContext("2d");

  game = createGame(selectedClass);
  window.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase())) e.preventDefault(); });
  window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
  canvas.addEventListener("mousemove", e => {
    const r = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - r.left) * (canvas.width / r.width);
    mouse.y = (e.clientY - r.top) * (canvas.height / r.height);
  });
  canvas.addEventListener("mousedown", () => mouse.down = true);
  canvas.addEventListener("mouseup", () => mouse.down = false);

  requestAnimationFrame(loop);
  showMsg("Survive ! Ramasse armes et nourriture.");
}

function createGame(cls){
  const player = {
    id: "player",
    name: cls.name,
    x: MAP_W/2,
    y: MAP_H/2,
    hp: cls.hp,
    maxHp: cls.hp,
    hunger: 100,
    speed: cls.speed,
    hungerRate: cls.hungerRate,
    accuracy: cls.accuracy,
    color: cls.color,
    angle: 0,
    weapon: cls.weapon,
    ammo: WEAPONS[cls.weapon].ammo,
    reserve: WEAPONS[cls.weapon].ammo * 3,
    lastShot: 0,
    reloading: false,
    reloadEnd: 0,
    kills: 0,
    alive: true,
    isPlayer: true,
    radius: 14
  };

  const bots = [];
  const botClasses = CLASSES.filter(c => c.id !== cls.id);
  for(let i=0; i<6; i++){
    const bc = botClasses[i % botClasses.length];
    bots.push({
      id: "bot"+i,
      name: bc.name + " " + (i+1),
      x: 200 + Math.random()*(MAP_W-400),
      y: 200 + Math.random()*(MAP_H-400),
      hp: bc.hp,
      maxHp: bc.hp,
      hunger: 80 + Math.random()*20,
      speed: bc.speed * 0.9,
      hungerRate: bc.hungerRate,
      accuracy: bc.accuracy * 0.8,
      color: bc.color,
      angle: Math.random()*Math.PI*2,
      weapon: bc.weapon,
      ammo: WEAPONS[bc.weapon].ammo,
      reserve: WEAPONS[bc.weapon].ammo * 2,
      lastShot: 0,
      reloading: false,
      reloadEnd: 0,
      kills: 0,
      alive: true,
      isPlayer: false,
      radius: 14,
      target: null,
      moveTimer: 0,
      dirX: 0,
      dirY: 0
    });
  }

  // Pickups
  const pickups = [];
  const weaponIds = Object.keys(WEAPONS);
  for(let i=0; i<12; i++){
    pickups.push({
      type: "weapon",
      weapon: weaponIds[i % weaponIds.length],
      x: 150 + Math.random()*(MAP_W-300),
      y: 150 + Math.random()*(MAP_H-300),
      taken: false
    });
  }
  for(let i=0; i<10; i++){
    pickups.push({
      type: "food",
      x: 150 + Math.random()*(MAP_W-300),
      y: 150 + Math.random()*(MAP_H-300),
      taken: false,
      value: 25 + Math.floor(Math.random()*20)
    });
  }
  for(let i=0; i<6; i++){
    pickups.push({
      type: "health",
      x: 150 + Math.random()*(MAP_W-300),
      y: 150 + Math.random()*(MAP_H-300),
      taken: false,
      value: 30
    });
  }

  // Simple obstacles
  const walls = [
    {x:400, y:300, w:200, h:30},
    {x:900, y:500, w:30, h:220},
    {x:600, y:800, w:280, h:30},
    {x:200, y:600, w:30, h:180},
    {x:1100, y:250, w:180, h:30},
    {x:1300, y:700, w:30, h:200}
  ];

  return { player, bots, pickups, walls, bullets: [], particles: [], time:0 };
}

/* ===================== UPDATE ===================== */
function update(dt){
  if(!game) return;
  game.time += dt;
  const p = game.player;

  // Player movement
  if(p.alive){
    let dx=0, dy=0;
    if(keys["z"] || keys["w"] || keys["arrowup"]) dy -= 1;
    if(keys["s"] || keys["arrowdown"]) dy += 1;
    if(keys["q"] || keys["a"] || keys["arrowleft"]) dx -= 1;
    if(keys["d"] || keys["arrowright"]) dx += 1;
    if(dx || dy){
      const len = Math.hypot(dx,dy);
      dx /= len; dy /= len;
      const nx = p.x + dx * p.speed * 60 * dt;
      const ny = p.y + dy * p.speed * 60 * dt;
      if(!collides(nx, p.y, p.radius)) p.x = nx;
      if(!collides(p.x, ny, p.radius)) p.y = ny;
      p.x = Math.max(p.radius, Math.min(MAP_W-p.radius, p.x));
      p.y = Math.max(p.radius, Math.min(MAP_H-p.radius, p.y));
    }
    // Aim
    const cam = getCam();
    p.angle = Math.atan2(mouse.y + cam.y - p.y, mouse.x + cam.x - p.x);

    // Shoot
    if(mouse.down) tryShoot(p);

    // Reload
    if(keys["r"] && !p.reloading && p.ammo < WEAPONS[p.weapon].ammo && p.reserve > 0){
      p.reloading = true;
      p.reloadEnd = game.time + WEAPONS[p.weapon].reload / 1000;
    }
    if(p.reloading && game.time >= p.reloadEnd){
      const need = WEAPONS[p.weapon].ammo - p.ammo;
      const take = Math.min(need, p.reserve);
      p.ammo += take;
      p.reserve -= take;
      p.reloading = false;
    }

    // Pickup
    if(keys["e"]) tryPickup(p);

    // Hunger
    p.hunger = Math.max(0, p.hunger - p.hungerRate * 60 * dt);
    if(p.hunger <= 0) p.hp -= 8 * dt;
  }

  // Bots AI
  game.bots.forEach(b => {
    if(!b.alive) return;
    b.hunger = Math.max(0, b.hunger - b.hungerRate * 60 * dt);
    if(b.hunger <= 0) b.hp -= 6 * dt;

    b.moveTimer -= dt;
    if(b.moveTimer <= 0){
      b.moveTimer = 0.6 + Math.random()*1.2;
      // target nearest enemy or pickup
      let nearest = null, nd = 9999;
      const all = [game.player, ...game.bots].filter(o => o.alive && o !== b);
      all.forEach(o => {
        const d = Math.hypot(o.x-b.x, o.y-b.y);
        if(d < nd){ nd = d; nearest = o; }
      });
      b.target = nearest;

      // also seek food if hungry
      if(b.hunger < 40){
        const food = game.pickups.find(pk => !pk.taken && pk.type==="food");
        if(food) b.target = food;
      }
    }

    if(b.target){
      const tx = b.target.x, ty = b.target.y;
      const dx = tx - b.x, dy = ty - b.y;
      const dist = Math.hypot(dx,dy);
      b.angle = Math.atan2(dy, dx);

      if(b.target.hp !== undefined && dist < WEAPONS[b.weapon].range * 0.85){
        // shoot
        tryShoot(b);
        // strafe a bit
        if(dist < 120){
          const sx = -dy / dist, sy = dx / dist;
          const nx = b.x + sx * b.speed * 40 * dt;
          const ny = b.y + sy * b.speed * 40 * dt;
          if(!collides(nx,b.y,b.radius)) b.x = nx;
          if(!collides(b.x,ny,b.radius)) b.y = ny;
        }
      } else {
        // move toward
        if(dist > 10){
          const nx = b.x + (dx/dist) * b.speed * 55 * dt;
          const ny = b.y + (dy/dist) * b.speed * 55 * dt;
          if(!collides(nx,b.y,b.radius)) b.x = nx;
          if(!collides(b.x,ny,b.radius)) b.y = ny;
        }
      }
    }

    // bot reload
    if(!b.reloading && b.ammo <= 0 && b.reserve > 0){
      b.reloading = true;
      b.reloadEnd = game.time + WEAPONS[b.weapon].reload / 1000;
    }
    if(b.reloading && game.time >= b.reloadEnd){
      const need = WEAPONS[b.weapon].ammo - b.ammo;
      const take = Math.min(need, b.reserve);
      b.ammo += take;
      b.reserve -= take;
      b.reloading = false;
    }

    // bot pickup nearby
    game.pickups.forEach(pk => {
      if(pk.taken) return;
      if(Math.hypot(pk.x-b.x, pk.y-b.y) < 28){
        applyPickup(b, pk);
      }
    });

    if(b.hp <= 0){ b.alive = false; b.hp = 0; }
  });

  // Bullets
  for(let i=game.bullets.length-1; i>=0; i--){
    const bul = game.bullets[i];
    bul.x += Math.cos(bul.angle) * bul.speed * dt;
    bul.y += Math.sin(bul.angle) * bul.speed * dt;
    bul.life -= dt;
    if(bul.life <= 0){ game.bullets.splice(i,1); continue; }

    // wall hit
    if(collides(bul.x, bul.y, 3)){
      spawnHit(bul.x, bul.y);
      game.bullets.splice(i,1);
      continue;
    }

    // hit entities
    const targets = [game.player, ...game.bots].filter(t => t.alive && t.id !== bul.owner);
    for(const t of targets){
      if(Math.hypot(t.x-bul.x, t.y-bul.y) < t.radius + 4){
        t.hp -= bul.dmg;
        spawnHit(bul.x, bul.y);
        game.bullets.splice(i,1);
        if(t.hp <= 0){
          t.alive = false;
          t.hp = 0;
          const killer = [game.player, ...game.bots].find(k => k.id === bul.owner);
          if(killer) killer.kills++;
          showMsg(`${t.name} éliminé !`);
        }
        break;
      }
    }
  }

  // Particles
  for(let i=game.particles.length-1; i>=0; i--){
    const pt = game.particles[i];
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
    if(pt.life <= 0) game.particles.splice(i,1);
  }

  if(p.hp <= 0 && p.alive){
    p.alive = false;
    showMsg("Tu es mort ! Recharge la page pour recommencer.");
  }

  updateHUD();
}

function tryShoot(ent){
  if(ent.reloading || ent.ammo <= 0) return;
  const w = WEAPONS[ent.weapon];
  if(game.time - ent.lastShot < w.fireRate / 1000) return;
  ent.lastShot = game.time;
  ent.ammo--;

  const pellets = w.pellets || 1;
  for(let i=0; i<pellets; i++){
    const spread = (Math.random()-0.5) * w.spread * (1.4 - ent.accuracy);
    game.bullets.push({
      x: ent.x + Math.cos(ent.angle)*18,
      y: ent.y + Math.sin(ent.angle)*18,
      angle: ent.angle + spread,
      speed: 520 + Math.random()*40,
      dmg: w.dmg,
      life: w.range / 500,
      owner: ent.id,
      color: w.color
    });
  }
}

function tryPickup(p){
  game.pickups.forEach(pk => {
    if(pk.taken) return;
    if(Math.hypot(pk.x-p.x, pk.y-p.y) < 32){
      applyPickup(p, pk);
    }
  });
}

function applyPickup(ent, pk){
  pk.taken = true;
  if(pk.type === "weapon"){
    ent.weapon = pk.weapon;
    ent.ammo = WEAPONS[pk.weapon].ammo;
    ent.reserve += WEAPONS[pk.weapon].ammo;
    if(ent.isPlayer) showMsg(`Arme : ${WEAPONS[pk.weapon].name}`);
  } else if(pk.type === "food"){
    ent.hunger = Math.min(100, ent.hunger + pk.value);
    if(ent.isPlayer) showMsg(`+${pk.value} faim`);
  } else if(pk.type === "health"){
    ent.hp = Math.min(ent.maxHp, ent.hp + pk.value);
    if(ent.isPlayer) showMsg(`+${pk.value} PV`);
  }
}

function collides(x, y, r){
  for(const w of game.walls){
    if(x+r > w.x && x-r < w.x+w.w && y+r > w.y && y-r < w.y+w.h) return true;
  }
  return false;
}

function spawnHit(x,y){
  for(let i=0;i<6;i++){
    game.particles.push({
      x, y,
      vx: (Math.random()-0.5)*120,
      vy: (Math.random()-0.5)*120,
      life: 0.25 + Math.random()*0.2,
      color: "#fbbf24"
    });
  }
}

function getCam(){
  const p = game.player;
  return {
    x: Math.max(0, Math.min(MAP_W - canvas.width, p.x - canvas.width/2)),
    y: Math.max(0, Math.min(MAP_H - canvas.height, p.y - canvas.height/2))
  };
}

/* ===================== DRAW ===================== */
function draw(){
  if(!game) return;
  const cam = getCam();
  ctx.fillStyle = "#0f172a";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // ground grid
  ctx.strokeStyle = "#1e293b";
  ctx.lineWidth = 1;
  for(let x=0; x<MAP_W; x+=80){
    ctx.beginPath();
    ctx.moveTo(x-cam.x, 0);
    ctx.lineTo(x-cam.x, canvas.height);
    ctx.stroke();
  }
  for(let y=0; y<MAP_H; y+=80){
    ctx.beginPath();
    ctx.moveTo(0, y-cam.y);
    ctx.lineTo(canvas.width, y-cam.y);
    ctx.stroke();
  }

  // walls
  ctx.fillStyle = "#334155";
  game.walls.forEach(w => {
    ctx.fillRect(w.x-cam.x, w.y-cam.y, w.w, w.h);
  });

  // pickups
  game.pickups.forEach(pk => {
    if(pk.taken) return;
    const sx = pk.x - cam.x, sy = pk.y - cam.y;
    if(pk.type === "weapon"){
      ctx.fillStyle = WEAPONS[pk.weapon].color;
      ctx.beginPath();
      ctx.arc(sx, sy, 9, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "9px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("W", sx, sy+3);
    } else if(pk.type === "food"){
      ctx.fillStyle = "#f97316";
      ctx.beginPath();
      ctx.arc(sx, sy, 8, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("🍖", sx, sy+4);
    } else {
      ctx.fillStyle = "#22c55e";
      ctx.beginPath();
      ctx.arc(sx, sy, 8, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("+", sx, sy+3);
    }
  });

  // bullets
  game.bullets.forEach(b => {
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x-cam.x, b.y-cam.y, 3, 0, Math.PI*2);
    ctx.fill();
  });

  // particles
  game.particles.forEach(pt => {
    ctx.globalAlpha = Math.max(0, pt.life*3);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x-cam.x-2, pt.y-cam.y-2, 4, 4);
    ctx.globalAlpha = 1;
  });

  // entities
  const entities = [game.player, ...game.bots];
  entities.forEach(e => {
    if(!e.alive) return;
    const sx = e.x - cam.x, sy = e.y - cam.y;

    // body
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(sx, sy, e.radius, 0, Math.PI*2);
    ctx.fill();

    // direction indicator
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + Math.cos(e.angle)*20, sy + Math.sin(e.angle)*20);
    ctx.stroke();

    // hp bar
    const bw = 28, bh = 4;
    ctx.fillStyle = "#000";
    ctx.fillRect(sx-bw/2, sy-e.radius-10, bw, bh);
    ctx.fillStyle = e.hp > e.maxHp*0.3 ? "#22c55e" : "#ef4444";
    ctx.fillRect(sx-bw/2, sy-e.radius-10, bw * (e.hp/e.maxHp), bh);

    // name
    ctx.fillStyle = "#e2e8f0";
    ctx.font = "10px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(e.name, sx, sy - e.radius - 14);
  });

  // minimap
  const mw = 140, mh = 100;
  const mScale = mw / MAP_W;
  ctx.fillStyle = "rgba(15,23,42,0.85)";
  ctx.fillRect(canvas.width-mw-10, 10, mw, mh);
  ctx.strokeStyle = "#334155";
  ctx.strokeRect(canvas.width-mw-10, 10, mw, mh);
  // walls on minimap
  ctx.fillStyle = "#475569";
  game.walls.forEach(w => {
    ctx.fillRect(canvas.width-mw-10 + w.x*mScale, 10 + w.y*mScale, w.w*mScale, w.h*mScale);
  });
  entities.forEach(e => {
    if(!e.alive) return;
    ctx.fillStyle = e.isPlayer ? "#38bdf8" : e.color;
    ctx.beginPath();
    ctx.arc(canvas.width-mw-10 + e.x*mScale, 10 + e.y*mScale, 3, 0, Math.PI*2);
    ctx.fill();
  });
}

function updateHUD(){
  const p = game.player;
  document.getElementById("playerName").textContent = p.name;
  document.getElementById("hpBar").style.width = Math.max(0, (p.hp/p.maxHp)*100) + "%";
  document.getElementById("hungerBar").style.width = Math.max(0, p.hunger) + "%";
  const w = WEAPONS[p.weapon];
  document.getElementById("ammo").textContent = p.reloading ? "Rechargement…" : `${w.name} : ${p.ammo} / ${p.reserve}`;
  document.getElementById("kills").textContent = "Kills : " + p.kills;
  const alive = [p, ...game.bots].filter(e => e.alive).length;
  document.getElementById("alive").textContent = "Vivants : " + alive;
}

function showMsg(t){
  const m = document.getElementById("msg");
  m.textContent = t;
  m.classList.add("show");
  clearTimeout(showMsg.t);
  showMsg.t = setTimeout(() => m.classList.remove("show"), 2500);
}

/* ===================== LOOP ===================== */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
</script>
