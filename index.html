<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Études Sup France — Plateforme</title>
<style>

:root {
  --p:#1e3a8a; --pl:#3b82f6; --s:#0f766e; --o:#ea580c;
  --bg:#f1f5f9; --c:#fff; --t:#1e293b; --m:#64748b; --b:#e2e8f0;
  --card:#fff; --side:#fff; --header:#1e3a8a;
}
[data-theme="dark"] {
  --bg:#0f172a; --c:#1e293b; --t:#e2e8f0; --m:#94a3b8; --b:#334155;
  --card:#1e293b; --side:#1e293b; --header:#0f172a; --p:#60a5fa; --pl:#3b82f6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);line-height:1.6;transition:background .2s,color .2s}
a{color:var(--pl);text-decoration:none}a:hover{text-decoration:underline}
header{background:var(--header);color:#fff;padding:.7rem 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.top{max-width:1280px;margin:0 auto;padding:0 1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem}
.logo{font-weight:700;font-size:1.2rem;cursor:pointer}.logo span{color:#fbbf24}
.actions{display:flex;gap:.5rem;align-items:center}
.actions button,.search-bar button{background:#fbbf24;color:#1e3a8a;border:none;padding:.4rem .8rem;border-radius:8px;font-weight:600;cursor:pointer;font-size:.85rem}
.search-bar{display:flex;gap:.3rem}
.search-bar input{padding:.4rem .7rem;border:none;border-radius:8px;font-size:.9rem;min-width:180px}
.wrap{max-width:1280px;margin:0 auto;padding:1.2rem 1rem 3rem;display:grid;grid-template-columns:250px 1fr;gap:1.3rem}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.side{position:static;max-height:none}}
.side{background:var(--side);border:1px solid var(--b);border-radius:12px;padding:1rem;height:fit-content;position:sticky;top:65px;max-height:calc(100vh - 80px);overflow-y:auto}
.side h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--m);margin:1rem 0 .4rem}
.side h3:first-child{margin-top:0}
.side a{display:block;padding:.35rem .6rem;border-radius:6px;color:var(--t);font-size:.85rem;margin-bottom:.1rem;cursor:pointer}
.side a:hover,.side a.on{background:rgba(59,130,246,.15);color:var(--p);text-decoration:none;font-weight:500}
.main h1{font-size:1.55rem;color:var(--p);margin-bottom:.25rem}
.lead{color:var(--m);margin-bottom:1rem;font-size:.93rem}
.sec-title{font-size:1.15rem;color:var(--o);margin:1.3rem 0 .6rem;padding-bottom:.2rem;border-bottom:2px solid #fed7aa}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem;margin:1rem 0}
.card{background:var(--card);border:1px solid var(--b);border-radius:10px;padding:1rem;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1);border-color:var(--pl)}
.card .ic{font-size:1.35rem;margin-bottom:.2rem}
.card h3{font-size:.9rem;color:var(--p);margin-bottom:.1rem}
.card p{font-size:.78rem;color:var(--m);margin:0}
.breadcrumb{font-size:.82rem;color:var(--m);margin-bottom:.8rem}
.breadcrumb span{cursor:pointer;color:var(--pl)}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0}
.tabs button{padding:.45rem .9rem;border:1px solid var(--b);background:var(--card);border-radius:8px;cursor:pointer;font-size:.85rem;color:var(--t)}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.panel{display:none;background:var(--card);border:1px solid var(--b);border-radius:12px;padding:1.3rem;margin-top:.5rem}
.panel.show{display:block}
.panel h2{color:var(--p);margin-bottom:.8rem;font-size:1.25rem}
.panel h3{color:var(--s);margin:1rem 0 .4rem;font-size:1.05rem}
.memo{background:rgba(22,163,74,.1);border-left:4px solid #16a34a;padding:.8rem 1rem;margin:1rem 0;border-radius:0 8px 8px 0}
.exo{background:rgba(234,88,12,.08);border-left:4px solid #ea580c;padding:.8rem 1rem;margin:1rem 0;border-radius:0 8px 8px 0}
.qcm-item{background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:1rem;margin-bottom:.8rem}
.qcm-item .choix label{display:block;padding:.35rem .5rem;margin:.2rem 0;cursor:pointer;border-radius:6px}
.qcm-item .choix label:hover{background:rgba(59,130,246,.1)}
.flash-card{background:var(--card);border:2px solid var(--b);border-radius:12px;padding:1.5rem;margin:1rem 0;min-height:140px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;transition:.2s}
.flash-card:hover{border-color:var(--pl)}
.flash-card .back{display:none}
.flash-card.flipped .front{display:none}
.flash-card.flipped .back{display:block}
.progress-bar{height:8px;background:var(--b);border-radius:4px;overflow:hidden;margin:.5rem 0 1rem}
.progress-bar div{height:100%;background:var(--s);transition:width .3s}
.badge{display:inline-block;font-size:.7rem;padding:.15rem .45rem;border-radius:4px;margin-left:.3rem}
.badge.done{background:#16a34a;color:#fff}
.badge.progress{background:#ea580c;color:#fff}
.badge.todo{background:var(--b);color:var(--m)}
.chapitre-item{background:var(--card);border:1px solid var(--b);border-radius:10px;padding:.9rem 1rem;margin-bottom:.5rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.chapitre-item:hover{border-color:var(--pl)}
.btn{display:inline-block;background:var(--pl);color:#fff;padding:.4rem .9rem;border-radius:6px;font-size:.85rem;border:none;cursor:pointer;margin:.2rem}
.btn:hover{opacity:.9}
.btn-sec{background:var(--b);color:var(--t)}
.fav{color:#fbbf24;cursor:pointer;font-size:1.1rem}
footer{background:#0f172a;color:#94a3b8;text-align:center;padding:1.3rem;font-size:.82rem;margin-top:2rem}
.wiki-box{background:rgba(59,130,246,.08);border:1px solid var(--pl);border-radius:10px;padding:1rem;margin:1rem 0;font-size:.9rem}
ul{margin:.4rem 0 .6rem 1.3rem}li{margin-bottom:.25rem}
table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.9rem}
th,td{border:1px solid var(--b);padding:.45rem .65rem;text-align:left}
th{background:rgba(59,130,246,.1);color:var(--p)}

</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo" onclick="App.goHome()">Études Sup <span>France</span></div>
    <form class="search-bar" id="search-form">
      <input type="search" id="search-input" placeholder="Rechercher un cours…">
      <button type="submit">Chercher</button>
    </form>
    <div class="actions">
      <button onclick="App.toggleTheme()">🌓</button>
      <button onclick="App.showFavoris()">⭐</button>
      <button onclick="App.showHistory()">🕐</button>
    </div>
  </div>
</header>
<div class="wrap">
  <aside class="side" id="sidebar"></aside>
  <div class="main" id="main"><div style="padding:2rem;text-align:center;color:var(--m)">Chargement…</div></div>
</div>
<footer>
  <p><strong>Études Sup France</strong> — Contenu pédagogique enrichi · 2026</p>
</footer>
<script>
const COURS_DB = [{"id": "cg-01", "formation": "bts-cg", "matiere": "Comptabilité", "titre": "Bilan et compte de résultat", "ordre": 1, "cours": "Le bilan décrit le patrimoine de l’entreprise à une date donnée :\n- Actif : ce que l’entreprise possède (immobilisations, stocks, créances, trésorerie).\n- Passif : ressources (capitaux propres, dettes financières, dettes d’exploitation).\n\nLe compte de résultat décrit l’activité sur une période :\n- Produits (ventes, autres produits).\n- Charges (achats, charges de personnel, dotations, etc.).\n- Résultat = Produits − Charges.\n\nLien : le résultat de l’exercice vient augmenter (bénéfice) ou diminuer (perte) les capitaux propres du bilan.\n\nDocuments de synthèse obligatoires selon le référentiel comptable applicable (PCG).", "resume": ["Bilan = photographie du patrimoine (Actif = Passif).", "Compte de résultat = film de l’activité (Produits − Charges = Résultat).", "Le résultat alimente les capitaux propres."], "points_cles": ["Actif", "Passif", "Capitaux propres", "Résultat", "PCG", "Documents de synthèse"], "exercices": [{"question": "Un bénéfice de 40 000 € a été réalisé. Quel est l’impact sur le bilan si aucune distribution n’est faite ?", "correction": "Les capitaux propres augmentent de 40 000 € (réserve ou report à nouveau)."}], "qcm": [{"question": "Le bilan est établi :", "choix": ["Sur une période", "À une date donnée", "Tous les mois obligatoirement", "Uniquement en cas de bénéfice"], "reponse": "À une date donnée"}], "flashcards": [{"question": "Équation fondamentale du bilan", "reponse": "Actif = Passif"}, {"question": "Résultat = ?", "reponse": "Produits − Charges"}], "sources": [], "formationNom": "BTS CG"}, {"id": "cg-02", "formation": "bts-cg", "matiere": "Analyse financière", "titre": "Ratios financiers essentiels", "ordre": 2, "cours": "Les ratios permettent d’analyser la solvabilité, la liquidité et la rentabilité.\n\nLiquidité :\n- Liquidité générale = Actif circulant / Dettes à court terme\n- Liquidité réduite = (Actif circulant − Stocks) / Dettes CT\n\nSolvabilité / structure :\n- Autonomie financière = Capitaux propres / Total passif\n- Endettement = Dettes financières / Capitaux propres\n\nRentabilité :\n- Rentabilité économique = Résultat d’exploitation / Capitaux économiques\n- Rentabilité financière = Résultat net / Capitaux propres\n\nActivité :\n- Rotation des stocks, délai clients, délai fournisseurs.\n\nInterprétation : comparer dans le temps et avec le secteur.", "resume": ["Ratios de liquidité, solvabilité et rentabilité.", "Toujours comparer dans le temps et au secteur d’activité."], "points_cles": ["Liquidité générale", "Autonomie financière", "Rentabilité financière", "Rotation des stocks", "Délai clients"], "exercices": [{"question": "Actif circulant = 180 k€, stocks = 60 k€, dettes CT = 100 k€. Calculez liquidité générale et liquidité réduite.", "correction": "Liquidité générale = 1,8. Liquidité réduite = 1,2."}], "qcm": [{"question": "Un ratio d’autonomie financière de 0,25 signifie :", "choix": ["Forte autonomie", "Faible autonomie (25 % de CP)", "Liquidité excellente", "Rentabilité élevée"], "reponse": "Faible autonomie (25 % de CP)"}], "flashcards": [{"question": "Formule liquidité générale", "reponse": "Actif circulant / Dettes à court terme"}, {"question": "Formule rentabilité financière", "reponse": "Résultat net / Capitaux propres"}], "sources": [], "formationNom": "BTS CG"}, {"id": "ciel-01", "formation": "bts-ciel", "matiere": "Cybersécurité", "titre": "Introduction à la cybersécurité", "ordre": 1, "cours": "La cybersécurité regroupe l’ensemble des mesures techniques, organisationnelles et humaines destinées à protéger les systèmes d’information contre les menaces.\n\nLes objectifs fondamentaux (triade CIA) :\n- Confidentialité : seules les personnes autorisées accèdent aux données.\n- Intégrité : les données ne sont pas altérées de façon non autorisée.\n- Disponibilité : les services et données sont accessibles quand on en a besoin.\n\nOn ajoute souvent : authenticité, non-répudiation, traçabilité.\n\nMenaces courantes : malware (virus, ransomware, trojans), phishing, ingénierie sociale, déni de service (DoS/DDoS), exploitation de vulnérabilités, attaques par force brute, man-in-the-middle.\n\nDéfense en profondeur : multiplier les couches de protection (pare-feu, antivirus, segmentation réseau, MFA, sauvegardes, sensibilisation utilisateurs).", "resume": ["Triade CIA : Confidentialité, Intégrité, Disponibilité.", "Menaces : malware, phishing, DoS, vulnérabilités…", "Défense en profondeur = plusieurs couches de sécurité."], "points_cles": ["CIA", "Confidentialité", "Intégrité", "Disponibilité", "Malware", "Phishing", "Défense en profondeur", "MFA"], "exercices": [{"question": "Expliquez la différence entre confidentialité et intégrité.", "correction": "Confidentialité = empêcher l’accès non autorisé. Intégrité = empêcher la modification non autorisée (même par quelqu’un qui a le droit de lire)."}, {"question": "Pourquoi la sensibilisation des utilisateurs est-elle essentielle ?", "correction": "La majorité des incidents passent par l’humain (phishing, mots de passe faibles, erreurs de configuration). La technique seule ne suffit pas."}], "qcm": [{"question": "Que signifie le « C » de la triade CIA ?", "choix": ["Contrôle", "Confidentialité", "Cryptographie", "Certification"], "reponse": "Confidentialité"}, {"question": "Le ransomware est un type de :", "choix": ["Pare-feu", "Malware", "Protocole", "Sauvegarde"], "reponse": "Malware"}], "flashcards": [{"question": "Triade CIA", "reponse": "Confidentialité – Intégrité – Disponibilité"}, {"question": "Principe de défense en profondeur", "reponse": "Plusieurs couches de protection complémentaires"}, {"question": "MFA signifie", "reponse": "Multi-Factor Authentication (authentification multi-facteurs)"}], "sources": [{"titre": "Cybersécurité – Wikipédia", "url": "https://fr.wikipedia.org/wiki/Cybers%C3%A9curit%C3%A9"}], "formationNom": "BTS CIEL"}, {"id": "ciel-02", "formation": "bts-ciel", "matiere": "Cybersécurité", "titre": "Bases de la cryptographie", "ordre": 2, "cours": "La cryptographie permet de protéger la confidentialité, l’intégrité et l’authenticité des données.\n\nChiffrement symétrique : une même clé pour chiffrer et déchiffrer (AES, ChaCha20). Rapide, adapté aux gros volumes, mais pose le problème de la distribution de la clé.\n\nChiffrement asymétrique : paire de clés (publique / privée). RSA, ECC. Plus lent, utilisé pour l’échange de clés, les signatures et les certificats.\n\nFonctions de hachage : SHA-256, SHA-3… Produisent une empreinte fixe. Utilisées pour l’intégrité et le stockage de mots de passe (avec sel).\n\nSignature numérique : hachage du message + chiffrement de l’empreinte avec la clé privée. Permet de vérifier l’auteur et l’intégrité.\n\nTLS (Transport Layer Security) combine asymétrique (échange de clés / certificats) et symétrique (chiffrement du flux).", "resume": ["Symétrique = une clé (AES) ; Asymétrique = paire de clés (RSA/ECC).", "Hachage = empreinte (SHA-256).", "Signature = preuve d’origine + intégrité.", "TLS = asymétrique pour le handshake + symétrique pour les données."], "points_cles": ["AES", "RSA", "ECC", "SHA-256", "Signature numérique", "TLS", "Certificat", "Sel (salt)"], "exercices": [{"question": "Pourquoi ne stocke-t-on jamais un mot de passe en clair ?", "correction": "En cas de fuite de la base, les mots de passe seraient immédiatement utilisables. On stocke une empreinte (hash) avec un sel unique par utilisateur."}], "qcm": [{"question": "AES est un algorithme :", "choix": ["Asymétrique", "Symétrique", "De hachage", "De signature uniquement"], "reponse": "Symétrique"}, {"question": "Pour vérifier qu’un fichier n’a pas été modifié, on utilise principalement :", "choix": ["Un chiffrement AES", "Une fonction de hachage", "Un pare-feu", "Un VPN"], "reponse": "Une fonction de hachage"}], "flashcards": [{"question": "Chiffrement avec une seule clé ?", "reponse": "Symétrique (ex. AES)"}, {"question": "Chiffrement avec paire de clés ?", "reponse": "Asymétrique (ex. RSA)"}, {"question": "Rôle d’une fonction de hachage", "reponse": "Produire une empreinte pour vérifier l’intégrité"}], "sources": [{"titre": "Cryptographie – Wikipédia", "url": "https://fr.wikipedia.org/wiki/Cryptographie"}], "formationNom": "BTS CIEL"}, {"id": "ciel-03", "formation": "bts-ciel", "matiere": "Réseaux et sécurité", "titre": "Sécurisation des réseaux", "ordre": 3, "cours": "La sécurisation d’un réseau repose sur plusieurs briques :\n\n1. Segmentation et zonage (DMZ, VLANs, zones de confiance).\n2. Pare-feu (firewall) : filtrage par état, règles ACL, NGFW.\n3. IDS/IPS : détection et prévention d’intrusion.\n4. VPN (IPsec, SSL/TLS) pour les accès distants sécurisés.\n5. Authentification réseau (802.1X, RADIUS).\n6. Supervision et journaux (SIEM).\n\nBonnes pratiques : principe du moindre privilège, surface d’attaque minimale, mises à jour, sauvegardes testées, plan de réponse à incident.", "resume": ["Segmentation + pare-feu + VPN + authentification forte.", "DMZ pour les services exposés.", "Surveillance (IDS/IPS, SIEM) et réponse à incident."], "points_cles": ["Pare-feu", "DMZ", "VLAN", "VPN", "IDS/IPS", "802.1X", "SIEM", "Moindre privilège"], "exercices": [{"question": "À quoi sert une DMZ ?", "correction": "À isoler les serveurs accessibles depuis Internet (web, mail…) du réseau interne, afin de limiter la propagation d’une compromission."}], "qcm": [{"question": "Un VPN sert principalement à :", "choix": ["Accélérer le réseau", "Créer un tunnel chiffré", "Remplacer le DNS", "Bloquer les publicités"], "reponse": "Créer un tunnel chiffré"}], "flashcards": [{"question": "Rôle d’une DMZ", "reponse": "Isoler les services exposés à Internet"}, {"question": "VPN signifie", "reponse": "Virtual Private Network"}], "sources": [], "formationNom": "BTS CIEL"}, {"id": "elec-01", "formation": "bts-electrotechnique", "matiere": "Électricité fondamentale", "titre": "Loi d’Ohm et puissance électrique", "ordre": 1, "cours": "La loi d’Ohm relie tension (U), intensité (I) et résistance (R) : U = R × I. Elle s’applique aux conducteurs ohmiques à température constante.\n\nLa puissance électrique absorbée par un dipôle est P = U × I. En combinant avec la loi d’Ohm on obtient aussi P = R × I² = U² / R.\n\nUnités : tension en volts (V), intensité en ampères (A), résistance en ohms (Ω), puissance en watts (W).\n\nEn courant alternatif monophasé, on distingue la puissance active P = U × I × cosφ, la puissance réactive Q = U × I × sinφ et la puissance apparente S = U × I. Le facteur de puissance cosφ caractérise le déphasage entre tension et courant.\n\nEn triphasé équilibré : P = √3 × U × I × cosφ (U = tension composée).", "resume": ["Loi d’Ohm : U = R × I", "Puissance continue / monophasé résistif : P = U × I = R I² = U²/R", "En alternatif : P = U I cosφ (active), Q = U I sinφ (réactive), S = U I (apparente)", "Triphasé équilibré : P = √3 U I cosφ"], "points_cles": ["Loi d’Ohm", "Puissance active", "Puissance réactive", "Facteur de puissance", "Triphasé", "Unités SI"], "exercices": [{"question": "Un résistor de 47 Ω est alimenté sous 230 V. Calculez l’intensité et la puissance dissipée.", "correction": "I = U/R = 230/47 ≈ 4,89 A. P = U×I ≈ 1125 W (ou P = U²/R ≈ 1125 W)."}, {"question": "Un moteur monophasé absorbe 8 A sous 230 V avec cosφ = 0,85. Calculez P, Q et S.", "correction": "S = U I = 1840 VA. P = S cosφ = 1564 W. Q = S sinφ ≈ 968 var (sinφ = √(1-0,85²) ≈ 0,527)."}, {"question": "En triphasé 400 V, un récepteur absorbe 12 A par phase avec cosφ = 0,9. Quelle est la puissance active totale ?", "correction": "P = √3 × 400 × 12 × 0,9 ≈ 7482 W."}], "qcm": [{"question": "La formule de la puissance active en monophasé est :", "choix": ["P = U I", "P = U I cosφ", "P = U I sinφ", "P = √3 U I"], "reponse": "P = U I cosφ"}, {"question": "L’unité de la puissance réactive est :", "choix": ["Watt (W)", "Voltampère (VA)", "var", "Ohm (Ω)"], "reponse": "var"}, {"question": "Dans un circuit purement résistif, cosφ vaut :", "choix": ["0", "0,5", "1", "√2/2"], "reponse": "1"}], "flashcards": [{"question": "Énoncé de la loi d’Ohm", "reponse": "U = R × I"}, {"question": "Puissance active monophasé", "reponse": "P = U I cosφ"}, {"question": "Puissance active triphasé équilibré", "reponse": "P = √3 U I cosφ"}, {"question": "Que représente cosφ ?", "reponse": "Le facteur de puissance (cosinus du déphasage u/i)"}], "sources": [{"titre": "Loi d’Ohm – Wikipédia", "url": "https://fr.wikipedia.org/wiki/Loi_d%27Ohm"}, {"titre": "Puissance électrique – Wikipédia", "url": "https://fr.wikipedia.org/wiki/Puissance_en_%C3%A9lectricit%C3%A9"}], "formationNom": "BTS Électrotechnique"}, {"id": "elec-02", "formation": "bts-electrotechnique", "matiere": "Électricité fondamentale", "titre": "Courant alternatif sinusoïdal", "ordre": 2, "cours": "Le courant alternatif sinusoïdal est caractérisé par sa valeur efficace, sa fréquence et sa période.\n\nValeur efficace (RMS) : pour une sinusoïde pure, Ueff = Û / √2 et Ieff = Î / √2. Les appareils de mesure indiquent en général les valeurs efficaces.\n\nFréquence f (Hz) et période T = 1/f. En Europe le réseau est à 50 Hz.\n\nReprésentation de Fresnel : on représente les grandeurs sinusoïdales de même fréquence par des vecteurs (phasors). Cela simplifie les calculs d’addition de tensions ou de courants déphasés.\n\nImpédance complexe : Z = R + jX. Pour une bobine X = Lω, pour un condensateur X = −1/(Cω), avec ω = 2πf.\n\nLoi d’Ohm en alternatif : U = Z × I (en notation complexe).", "resume": ["Valeur efficace = valeur max / √2 pour une sinusoïde.", "Fréquence réseau Europe : 50 Hz.", "Impédance Z = R + jX ; X_L = Lω, X_C = −1/(Cω).", "Représentation de Fresnel pour les calculs de circuits."], "points_cles": ["Valeur efficace", "Fréquence", "Période", "Fresnel", "Impédance", "Réactance", "Pulsation ω"], "exercices": [{"question": "Une tension a une valeur maximale de 325 V. Quelle est sa valeur efficace ?", "correction": "Ueff = 325 / √2 ≈ 230 V."}, {"question": "Calculez la réactance d’une bobine de 0,1 H à 50 Hz.", "correction": "X_L = L × 2πf = 0,1 × 314 ≈ 31,4 Ω."}], "qcm": [{"question": "La fréquence du réseau électrique en France est :", "choix": ["40 Hz", "50 Hz", "60 Hz", "100 Hz"], "reponse": "50 Hz"}, {"question": "La réactance d’un condensateur diminue quand :", "choix": ["La fréquence augmente", "La fréquence diminue", "La capacité diminue", "La tension augmente"], "reponse": "La fréquence augmente"}], "flashcards": [{"question": "Relation Ueff / Û", "reponse": "Ueff = Û / √2"}, {"question": "Formule de la réactance inductive", "reponse": "X_L = Lω = 2πf L"}, {"question": "Formule de la réactance capacitive", "reponse": "X_C = 1/(Cω)"}], "sources": [{"titre": "Courant alternatif – Wikipédia", "url": "https://fr.wikipedia.org/wiki/Courant_alternatif"}], "formationNom": "BTS Électrotechnique"}, {"id": "elec-03", "formation": "bts-electrotechnique", "matiere": "Électricité fondamentale", "titre": "Circuits RLC série et parallèle", "ordre": 3, "cours": "Circuit RLC série : l’impédance totale est Z = R + j(X_L − X_C). Le courant est le même dans tous les éléments. La résonance série se produit quand X_L = X_C, soit f0 = 1/(2π√(LC)). À la résonance, Z = R (minimale) et le courant est maximal.\n\nCircuit RLC parallèle : la résonance parallèle (anti-résonance) correspond à une impédance maximale et un courant total minimal.\n\nFacteur de qualité Q = (1/R)√(L/C) pour le circuit série. Un Q élevé signifie une bande passante étroite.\n\nApplications : filtres, circuits d’accord, compensation d’énergie réactive.", "resume": ["RLC série : résonance quand X_L = X_C → Z minimale, I maximale.", "Fréquence de résonance f0 = 1/(2π√(LC)).", "Facteur de qualité Q caractérise la sélectivité."], "points_cles": ["RLC série", "RLC parallèle", "Résonance", "Fréquence propre", "Facteur de qualité", "Bande passante"], "exercices": [{"question": "Un circuit RLC série : R = 10 Ω, L = 0,1 H, C = 100 µF. Calculez f0 et Q.", "correction": "f0 = 1/(2π√(0,1×100e-6)) ≈ 50,3 Hz. Q = (1/10)×√(0,1/100e-6) ≈ 3,16."}], "qcm": [{"question": "À la résonance série, l’impédance est :", "choix": ["Maximale", "Minimale et égale à R", "Infinie", "Égale à X_L"], "reponse": "Minimale et égale à R"}], "flashcards": [{"question": "Formule de la fréquence de résonance RLC", "reponse": "f0 = 1/(2π√(LC))"}, {"question": "À la résonance série, que vaut Z ?", "reponse": "Z = R (minimale)"}], "sources": [{"titre": "Circuit RLC – Wikipédia", "url": "https://fr.wikipedia.org/wiki/Circuit_RLC"}], "formationNom": "BTS Électrotechnique"}, {"id": "elec-04", "formation": "bts-electrotechnique", "matiere": "Machines électriques", "titre": "Machines asynchrones (moteurs)", "ordre": 4, "cours": "Le moteur asynchrone (ou moteur à induction) est le plus répandu dans l’industrie. Le stator crée un champ tournant. Le rotor (cage d’écureuil ou bobiné) est le siège de courants induits qui produisent un couple.\n\nGlissement g = (ns − n)/ns où ns est la vitesse de synchronisme (ns = 60f/p en tr/min, p = nombre de paires de pôles).\n\nLe couple est maximal pour un glissement critique. Au démarrage g = 1.\n\nDémarrage : direct, étoile-triangle, démarreur progressif (soft-starter), variateur de fréquence.\n\nLe variateur de fréquence permet de faire varier la vitesse en agissant sur f tout en maintenant le flux (U/f constant en basique).", "resume": ["Moteur asynchrone = moteur à induction, très robuste.", "Glissement g = (ns − n)/ns.", "Vitesse de synchronisme ns = 60f / p.", "Démarrage et variation de vitesse : étoile-triangle, soft-starter, variateur."], "points_cles": ["Champ tournant", "Glissement", "Vitesse de synchronisme", "Couple", "Démarrage", "Variateur de fréquence"], "exercices": [{"question": "Un moteur 4 pôles alimenté en 50 Hz tourne à 1450 tr/min. Calculez le glissement.", "correction": "ns = 60×50/2 = 1500 tr/min. g = (1500−1450)/1500 = 0,033 soit 3,3 %."}], "qcm": [{"question": "La vitesse de synchronisme d’un moteur 2 pôles à 50 Hz est :", "choix": ["1500 tr/min", "3000 tr/min", "750 tr/min", "1000 tr/min"], "reponse": "3000 tr/min"}], "flashcards": [{"question": "Formule de ns", "reponse": "ns = 60f / p (tr/min)"}, {"question": "Définition du glissement", "reponse": "g = (ns − n)/ns"}], "sources": [{"titre": "Machine asynchrone – Wikipédia", "url": "https://fr.wikipedia.org/wiki/Machine_asynchrone"}], "formationNom": "BTS Électrotechnique"}, {"id": "elec-05", "formation": "bts-electrotechnique", "matiere": "Sécurité et réglementation", "titre": "Sécurité électrique et habilitations", "ordre": 5, "cours": "La norme NF C 18-510 définit les opérations sur les ouvrages et installations électriques et les titres d’habilitation.\n\nLes symboles d’habilitation (B0, B1, B2, BR, BC, H0, H1…) indiquent le domaine (BT/HT), le type d’opération et le niveau de responsabilité.\n\nProtection des personnes :\n- Contre les contacts directs : isolation, enveloppes, distances, obstacles.\n- Contre les contacts indirects : mise à la terre + dispositifs différentiels (DDR 30 mA pour les circuits prises).\n\nSchémas de liaison à la terre (SLT) : TT, TN (TNS, TNC), IT. Chaque schéma a ses règles de protection.\n\nConsignation : procédure de mise hors tension et de sécurisation avant intervention (séparation, condamnation, identification, VAT – vérification d’absence de tension).", "resume": ["Habilitations selon NF C 18-510.", "Protection différentielle 30 mA pour les circuits de prises.", "Schémas TT, TN, IT.", "Consignation obligatoire avant travaux hors tension."], "points_cles": ["Habilitation", "NF C 18-510", "DDR", "Schémas de liaison à la terre", "Consignation", "VAT"], "exercices": [{"question": "Quelle est la sensibilité du dispositif différentiel obligatoire sur les circuits de prises en locaux d’habitation ?", "correction": "30 mA."}, {"question": "Citez les étapes principales d’une consignation.", "correction": "Séparation (coupure), condamnation, identification, vérification d’absence de tension (VAT), éventuellement mise à la terre et en court-circuit."}], "qcm": [{"question": "Le symbole BR correspond à une habilitation :", "choix": ["Haute tension", "Chargé d’intervention générale BT", "Chargé de consignation", "Non électricien"], "reponse": "Chargé d’intervention générale BT"}], "flashcards": [{"question": "Norme des habilitations électriques", "reponse": "NF C 18-510"}, {"question": "Sensibilité DDR prises", "reponse": "30 mA"}, {"question": "Étapes de consignation (sigle)", "reponse": "Séparation – Condamnation – Identification – VAT"}], "sources": [{"titre": "Habilitation électrique – Wikipédia", "url": "https://fr.wikipedia.org/wiki/Habilitation_%C3%A9lectrique"}], "formationNom": "BTS Électrotechnique"}, {"id": "elec-06", "formation": "bts-electrotechnique", "matiere": "Machines électriques", "titre": "Transformateurs monophasés et triphasés", "ordre": 6, "cours": "Le transformateur est une machine statique qui transfert de l’énergie électrique d’un circuit à un autre par induction électromagnétique, sans contact électrique.\n\nRapport de transformation m = U1/U2 ≈ N1/N2.\n\nEn monophasé idéal : U1 I1 = U2 I2.\n\nPertes : pertes fer (hystérésis + Foucault) et pertes cuivre (effet Joule dans les enroulements).\n\nRendement η = P2 / P1.\n\nTransformateur triphasé : trois colonnes ou cinq colonnes, couplages étoile/triangle (Yy, Dy, Yd, Dd) avec indice horaire.\n\nApplications : distribution d’énergie, isolation galvanique, adaptation de tension.", "resume": ["Rapport de transformation m = N1/N2 ≈ U1/U2.", "Pertes fer + pertes cuivre.", "Couplages et indices horaires en triphasé."], "points_cles": ["Rapport de transformation", "Pertes fer", "Pertes cuivre", "Rendement", "Couplage", "Indice horaire"], "exercices": [{"question": "Un transformateur monophasé 230/24 V a un primaire de 460 spires. Combien de spires au secondaire (idéal) ?", "correction": "N2 = N1 × (U2/U1) = 460 × (24/230) = 48 spires."}], "qcm": [{"question": "Le transformateur fonctionne grâce à :", "choix": ["L’effet Joule", "L’induction électromagnétique", "L’effet Seebeck", "La conduction ionique"], "reponse": "L’induction électromagnétique"}], "flashcards": [{"question": "Formule du rapport de transformation", "reponse": "m = U1/U2 ≈ N1/N2"}, {"question": "Deux types de pertes principales", "reponse": "Pertes fer et pertes cuivre"}], "sources": [{"titre": "Transformateur électrique – Wikipédia", "url": "https://fr.wikipedia.org/wiki/Transformateur_%C3%A9lectrique"}], "formationNom": "BTS Électrotechnique"}, {"id": "elec-07", "formation": "bts-electrotechnique", "matiere": "Distribution d’énergie", "titre": "Réseaux de distribution BT et HTA", "ordre": 7, "cours": "La distribution électrique comporte plusieurs niveaux de tension : THT / HTB (transport), HTA (distribution moyenne tension), BT (basse tension chez l’utilisateur).\n\nEn France, la BT normalisée est 230/400 V. La HTA courante est 20 kV.\n\nPostes de transformation HTA/BT : cabine, poste sur poteau, poste intégré.\n\nSchémas de distribution : radial, en double dérivation, en boucle.\n\nProtection : disjoncteurs, fusibles, relais de protection, sélectivité amont/aval.\n\nQualité de l’énergie : harmoniques, creux de tension, surtensions, flicker.", "resume": ["BT = 230/400 V, HTA courante = 20 kV.", "Postes HTA/BT et schémas de distribution.", "Sélectivité des protections."], "points_cles": ["BT", "HTA", "Poste de transformation", "Sélectivité", "Qualité de l’énergie", "Harmoniques"], "exercices": [{"question": "Pourquoi utilise-t-on de la HTA pour la distribution plutôt que de la BT sur de longues distances ?", "correction": "Pour réduire les pertes en ligne (P = R I²). À puissance égale, plus la tension est élevée, plus le courant est faible."}], "qcm": [{"question": "La tension normalisée en BT triphasée en France est :", "choix": ["127/220 V", "230/400 V", "400/690 V", "20 kV"], "reponse": "230/400 V"}], "flashcards": [{"question": "Tension BT normalisée France", "reponse": "230/400 V"}, {"question": "Pourquoi transporter en haute tension ?", "reponse": "Réduire les pertes Joule (I plus faible)"}], "sources": [], "formationNom": "BTS Électrotechnique"}, {"id": "elec-08", "formation": "bts-electrotechnique", "matiere": "Automatismes", "titre": "Bases des automatismes et GRAFCET", "ordre": 8, "cours": "Un système automatisé comprend une partie opérative (actionneurs, capteurs) et une partie commande (API, relais, variateurs).\n\nLe GRAFCET (GRAphe Fonctionnel de Commande Étape-Transition) décrit le comportement séquentiel : étapes, transitions, réceptivités, actions.\n\nRègles d’évolution : une transition est franchie si l’étape amont est active et la réceptivité vraie. Les étapes aval s’activent, l’étape amont se désactive.\n\nAPI (Automate Programmable Industriel) : entrées/sorties TOR ou analogiques, programme (ladder, structured text, GRAFCET).", "resume": ["Partie opérative + partie commande", "GRAFCET = étapes + transitions", "API = automate programmable"], "points_cles": ["GRAFCET", "Étape", "Transition", "Réceptivité", "API", "Actionneur", "Capteur"], "exercices": [{"question": "Quels sont les deux éléments principaux d’un GRAFCET ?", "correction": "Les étapes et les transitions (avec réceptivités)."}], "qcm": [{"question": "GRAFCET signifie :", "choix": ["Graphique de commande", "GRAphe Fonctionnel de Commande Étape-Transition", "Gestion automatique", "Groupe d’actionneurs"], "reponse": "GRAphe Fonctionnel de Commande Étape-Transition"}], "flashcards": [{"question": "Que décrit le GRAFCET ?", "reponse": "Le comportement séquentiel d’un automatisme"}], "sources": [], "formationNom": "BTS Électrotechnique"}, {"id": "mco-01", "formation": "bts-mco", "matiere": "Relation client", "titre": "Développement de la relation client et vente conseil", "ordre": 1, "cours": "Le parcours de vente conseil en magasin :\n1. Accueil et prise de contact\n2. Découverte des besoins (questions ouvertes, écoute active)\n3. Présentation de l’offre et argumentation\n4. Traitement des objections\n5. Closing\n6. Prise de congé et suivi\n\nSONCAS : Sécurité, Orgueil, Nouveauté, Confort, Argent, Sympathie – leviers de motivation.\n\nQualité de service et expérience client sont devenues des facteurs de différenciation majeurs.", "resume": ["Parcours structuré de la vente conseil.", "SONCAS pour identifier les motivations d’achat.", "L’expérience client dépasse le simple acte de vente."], "points_cles": ["Accueil", "Découverte", "SONCAS", "Objection", "Closing", "Expérience client"], "exercices": [{"question": "Proposez 3 questions ouvertes pour un client qui entre dans un rayon électroménager.", "correction": "Quel usage principal recherchez-vous ? Quelles contraintes d’espace ou de budget avez-vous ? Avez-vous déjà un appareil similaire et qu’en attendez-vous de plus ?"}], "qcm": [{"question": "Le « A » de SONCAS correspond à :", "choix": ["Accueil", "Argent", "Argumentation", "Attente"], "reponse": "Argent"}], "flashcards": [{"question": "Les 6 leviers SONCAS", "reponse": "Sécurité Orgueil Nouveauté Confort Argent Sympathie"}], "sources": [], "formationNom": "BTS MCO"}, {"id": "mco-02", "formation": "bts-mco", "matiere": "Animation de l’offre", "titre": "Merchandising et implantation", "ordre": 2, "cours": "Le merchandising vise à maximiser les ventes en organisant l’espace de vente et la présentation des produits.\n\nImplantation : verticale (même famille sur plusieurs niveaux) ou horizontale.\nFacing : nombre de produits visibles de face.\nTêtes de gondole et zones chaudes / zones froides.\nCross-merchandising : association de produits complémentaires.\n\nRègles souvent citées : les 5S (Stock, Seuil, Signalétique, Séduction, Service) ou les principes de visibilité, accessibilité et attractivité.\n\nIndicateurs : CA/m², taux de transformation, panier moyen.", "resume": ["Merchandising = organisation de l’espace pour vendre plus et mieux.", "Facing, têtes de gondole, zones chaudes/froides.", "Indicateurs de performance commerciale."], "points_cles": ["Facing", "Implantation", "Tête de gondole", "Zone chaude", "Cross-merchandising", "CA/m²"], "exercices": [{"question": "Qu’est-ce qu’une zone chaude en magasin ?", "correction": "Une zone à fort passage et forte visibilité (entrée, allées principales, caisses). On y place les produits à forte marge ou en promotion."}], "qcm": [{"question": "Le facing désigne :", "choix": ["Le prix affiché", "Le nombre de produits visibles de face", "La hauteur du rayon", "Le stock en réserve"], "reponse": "Le nombre de produits visibles de face"}], "flashcards": [{"question": "Définition du facing", "reponse": "Nombre de produits d’une référence visibles de face"}, {"question": "Zone chaude", "reponse": "Zone à fort trafic et forte visibilité"}], "sources": [], "formationNom": "BTS MCO"}, {"id": "ndrc-01", "formation": "bts-ndrc", "matiere": "Relation client", "titre": "Relation client omnicanale", "ordre": 1, "cours": "L’omnicanalité consiste à offrir au client une expérience fluide et cohérente quel que soit le canal utilisé (magasin, site web, application, téléphone, réseaux sociaux, chat, email).\n\nLe client passe d’un canal à l’autre sans rupture : il commence une recherche sur mobile, continue sur ordinateur, finalise en magasin ou l’inverse.\n\nLe CRM (Customer Relationship Management) centralise les données clients (historique d’achats, interactions, préférences) pour permettre une personnalisation et un suivi unifié.\n\nEnjeux :\n- Unicité de la vision client\n- Continuité du parcours\n- Personnalisation des offres et messages\n- Mesure de la satisfaction (NPS, CSAT) sur tous les points de contact\n\nLes outils : CRM, plateformes de marketing automation, chatbots, outils de social listening, programmes de fidélité unifiés.", "resume": ["Omnicanal = expérience client sans rupture entre les canaux.", "Le CRM centralise les données pour une vision 360°.", "Objectifs : cohérence, personnalisation, continuité, mesure."], "points_cles": ["Omnicanal", "CRM", "Parcours client", "Personnalisation", "NPS", "Vision 360°", "Marketing automation"], "exercices": [{"question": "Quelle différence entre multicanal et omnicanal ?", "correction": "Multicanal = plusieurs canaux existent mais souvent en silos. Omnicanal = les canaux sont interconnectés et le parcours client est continu et cohérent."}], "qcm": [{"question": "Le CRM sert principalement à :", "choix": ["Gérer les stocks", "Centraliser les données clients", "Produire les factures uniquement", "Remplacer le site web"], "reponse": "Centraliser les données clients"}], "flashcards": [{"question": "Omnicanal vs multicanal", "reponse": "Omnicanal = canaux interconnectés et parcours fluide"}, {"question": "Rôle principal du CRM", "reponse": "Centraliser les données et interactions clients"}], "sources": [{"titre": "Commerce omnicanal – Wikipédia", "url": "https://fr.wikipedia.org/wiki/Commerce_omnicanal"}], "formationNom": "BTS NDRC"}, {"id": "ndrc-02", "formation": "bts-ndrc", "matiere": "Négociation", "titre": "Techniques de négociation-vente", "ordre": 2, "cours": "La négociation-vente suit un processus structuré :\n\n1. Préparation (objectifs, BATNA, connaissance du client et de l’offre).\n2. Prise de contact et création de relation.\n3. Découverte des besoins (questions ouvertes, écoute active, reformulation).\n4. Proposition et argumentation (avantages clients, preuves).\n5. Traitement des objections (accueil, questionnement, réponse, contrôle).\n6. Closing (techniques de conclusion).\n7. Suivi et fidélisation.\n\nMéthodes classiques : SONCAS, CAP (Caractéristique – Avantage – Preuve), SPIN Selling.\n\nEn négociation pure (B2B), on distingue intérêts et positions (négociation raisonnée de Harvard).", "resume": ["Processus : préparation → découverte → argumentation → objections → closing → suivi.", "SONCAS et CAP pour argumenter.", "Négociation raisonnée : intérêts plutôt que positions."], "points_cles": ["BATNA", "SONCAS", "CAP", "SPIN", "Objection", "Closing", "Négociation raisonnée"], "exercices": [{"question": "Qu’est-ce que la BATNA ?", "correction": "Best Alternative To a Negotiated Agreement : la meilleure alternative si la négociation échoue. Elle détermine le point de réserve."}], "qcm": [{"question": "SONCAS est un outil de :", "choix": ["Gestion de stock", "Motivation d’achat", "Comptabilité", "Logistique"], "reponse": "Motivation d’achat"}], "flashcards": [{"question": "BATNA signifie", "reponse": "Best Alternative To a Negotiated Agreement"}, {"question": "Les 6 leviers SONCAS", "reponse": "Sécurité, Orgueil, Nouveauté, Confort, Argent, Sympathie"}], "sources": [], "formationNom": "BTS NDRC"}, {"id": "opti-01", "formation": "bts-opticien", "matiere": "Analyse de la vision", "titre": "Anatomie et physiologie de l’œil", "ordre": 1, "cours": "<h3>1. Introduction et dimensions</h3><p>L’œil humain est un organe sensoriel complexe d’environ 24 mm de diamètre antéro-postérieur chez l’adulte. Il est logé dans la cavité orbitaire, protégé par les paupières, les cils, le film lacrymal et l’orbite osseuse. Sa fonction est de transformer le signal lumineux en signal nerveux transmis au cortex visuel via le nerf optique.</p><p>On décrit classiquement trois tuniques concentriques et plusieurs milieux transparents qui constituent le dioptre oculaire.</p><h3>2. Tunique externe (fibreuse)</h3><p><strong>Sclérotique</strong> : membrane blanche, opaque, résistante, qui forme les 5/6 postérieurs de la tunique externe. Elle maintient la forme du globe et sert de point d’insertion aux muscles extra-oculaires.</p><p><strong>Cornée</strong> : partie antérieure transparente (environ 12 mm de diamètre, épaisseur centrale ≈ 0,5 mm). Elle constitue la première et la plus puissante surface réfringente de l’œil (environ +40 à +43 dioptries, soit les deux tiers de la puissance totale de l’œil emmétrope). Elle est avasculaire : sa nutrition se fait par diffusion à partir de l’humeur aqueuse (face postérieure) et du film lacrymal (face antérieure). Sa transparence repose sur l’organisation régulière des fibres de collagène du stroma et sur un contrôle strict de l’hydratation (pompe endothéliale).</p><h3>3. Tunique moyenne (uvée ou vasculaire)</h3><p><strong>Choroïde</strong> : riche en vaisseaux, elle nourrit la rétine externe et absorbe la lumière parasite.</p><p><strong>Corps ciliaire</strong> : produit l’humeur aqueuse et contient le muscle ciliaire, responsable de l’accommodation via la zonule de Zinn qui agit sur le cristallin.</p><p><strong>Iris</strong> : diaphragme coloré qui contrôle la quantité de lumière entrant dans l’œil (pupille). Les muscles sphincter et dilateur de la pupille régulent son diamètre.</p><h3>4. Tunique interne : la rétine</h3><p>La rétine transforme le signal lumineux en influx nerveux. Deux types de photorécepteurs :</p><ul><li><strong>Cônes</strong> (≈ 6 millions) : vision photopique (diurne), discrimination des couleurs, haute acuité. Très concentrés dans la macula et surtout la fovéa (où l’acuité est maximale).</li><li><strong>Bâtonnets</strong> (≈ 120 millions) : vision scotopique (faible luminosité), pas de discrimination colorée, plus nombreux en périphérie rétinienne.</li></ul><p>Le signal est transmis via les cellules bipolaires puis ganglionnaires ; les axones de ces dernières forment le nerf optique.</p><h3>5. Milieux transparents et dioptre oculaire</h3><p>Dans l’ordre de traversée de la lumière : cornée → humeur aqueuse → cristallin → corps vitré → rétine. Le cristallin est une lentille biconvexe dont la courbure (donc la puissance) varie grâce au muscle ciliaire : c’est l’accommodation. Avec l’âge, le cristallin perd de son élasticité (sclérose) → diminution de l’amplitude d’accommodation → presbytie.</p><h3>6. Schéma simplifié</h3><pre>        Cornée\n    _______________\n   /               \\\n  |  Iris / Pupille |\n  |    Cristallin   |\n  |                 |\n  |   Corps vitré   |\n  |                 |\n   \\_____Rétine____/\n         |\n     Nerf optique</pre><h3>7. Points cliniques pour l’opticien</h3><p>Tout défaut de transparence (opacité cornéenne, cataracte) ou de forme (kératocône, amétropies) impacte directement la qualité de l’image rétinienne. L’opticien doit connaître ces structures pour interpréter une prescription, adapter des lentilles et conseiller le client.</p>", "resume": ["L’œil mesure ≈ 24 mm ; trois tuniques : fibreuse, vasculaire, nerveuse.", "Cornée ≈ +40 à +43 δ (2/3 de la puissance totale), avasculaire.", "Cristallin = lentille d’accommodation ; rigidification avec l’âge → presbytie.", "Cônes = couleurs + acuité (macula/fovéa) ; bâtonnets = vision nocturne (périphérie).", "Milieux transparents : cornée, humeur aqueuse, cristallin, vitré."], "a_retenir": ["Cornée = première surface réfringente et la plus puissante.", "Accommodation = variation de courbure du cristallin sous l’action du muscle ciliaire.", "Fovéa = zone d’acuité maximale (quasi exclusivement des cônes).", "Toute perte de transparence ou déformation altère la vision."], "points_cles": ["Cornée", "Sclérotique", "Cristallin", "Accommodation", "Rétine", "Cônes", "Bâtonnets", "Macula", "Fovéa", "Humeur aqueuse", "Corps vitré", "Nerf optique", "Iris", "Pupille"], "exercices": [{"question": "Pourquoi la cornée apporte-t-elle la plus grande part de la puissance réfractive de l’œil ?", "correction": "Parce que le changement d’indice de réfraction entre l’air (n≈1) et la cornée (n≈1,37) est important, et que sa courbure antérieure est relativement forte. Le cristallin, baigné de part et d’autre par des milieux d’indices proches, apporte une puissance moindre (environ +20 δ)."}, {"question": "Expliquez le mécanisme de l’accommodation et sa dégradation avec l’âge.", "correction": "Le muscle ciliaire se contracte → relâchement de la zonule → le cristallin, élastique, se bombe → augmentation de sa puissance → vision de près nette. Avec l’âge, le cristallin se sclérose et perd de son élasticité → diminution de l’amplitude d’accommodation → presbytie."}, {"question": "Où se trouvent majoritairement les cônes et les bâtonnets ? Quelles conséquences fonctionnelles ?", "correction": "Cônes surtout dans la macula/fovéa → vision centrale fine et colorée. Bâtonnets en périphérie → vision nocturne et détection des mouvements, mais faible acuité et pas de couleurs."}, {"question": "La cornée est-elle vascularisée ? Comment est-elle nourrie ?", "correction": "Non, elle est avasculaire. Nutrition par diffusion depuis l’humeur aqueuse (endothélium) et le film lacrymal (épithélium)."}, {"question": "Quel est le rôle de l’iris ?", "correction": "Contrôler la quantité de lumière qui pénètre dans l’œil en faisant varier le diamètre de la pupille."}, {"question": "Qu’est-ce que la fovéa ?", "correction": "Zone centrale de la macula, très riche en cônes, où l’acuité visuelle est maximale."}, {"question": "Citez dans l’ordre les milieux transparents traversés par la lumière.", "correction": "Cornée → humeur aqueuse → cristallin → corps vitré."}, {"question": "Pourquoi un œdème cornéen fait-il baisser la vision ?", "correction": "L’augmentation de l’épaisseur et la désorganisation de l’hydratation du stroma réduisent la transparence et perturbent la surface optique."}], "qcm": [{"question": "Puissance approximative de la cornée ?", "choix": ["+10 à +15 δ", "+20 à +25 δ", "+40 à +43 δ", "+60 δ"], "reponse": "+40 à +43 δ"}, {"question": "Les cônes sont surtout concentrés :", "choix": ["En périphérie rétinienne", "Dans la macula et la fovéa", "Dans le corps ciliaire", "Dans la choroïde"], "reponse": "Dans la macula et la fovéa"}, {"question": "L’accommodation est réalisée par :", "choix": ["L’iris", "Le cristallin et le muscle ciliaire", "La cornée", "La rétine"], "reponse": "Le cristallin et le muscle ciliaire"}, {"question": "La cornée est :", "choix": ["Richement vascularisée", "Avasculaire", "Vascularisée uniquement en périphérie", "Nourrie par le nerf optique"], "reponse": "Avasculaire"}, {"question": "Les bâtonnets permettent principalement :", "choix": ["La vision des couleurs", "La vision fine centrale", "La vision en faible luminosité", "L’accommodation"], "reponse": "La vision en faible luminosité"}, {"question": "Le diamètre moyen de l’œil adulte est d’environ :", "choix": ["12 mm", "18 mm", "24 mm", "32 mm"], "reponse": "24 mm"}, {"question": "La presbytie est liée à :", "choix": ["Un allongement de l’œil", "La perte d’élasticité du cristallin", "Une opacification de la cornée", "Une atteinte du nerf optique"], "reponse": "La perte d’élasticité du cristallin"}, {"question": "Quel muscle contrôle le resserrement de la pupille ?", "choix": ["Dilateur", "Sphincter de l’iris", "Muscle ciliaire", "Droit médial"], "reponse": "Sphincter de l’iris"}, {"question": "Le nerf optique est formé par les axones des cellules :", "choix": ["Bipolaires", "Ganglionnaires", "Photoréceptrices", "Horizontales"], "reponse": "Ganglionnaires"}, {"question": "Parmi ces structures, laquelle n’est pas un milieu transparent ?", "choix": ["Cornée", "Cristallin", "Choroïde", "Corps vitré"], "reponse": "Choroïde"}], "flashcards": [{"question": "Puissance de la cornée ?", "reponse": "+40 à +43 dioptries"}, {"question": "Rôle principal du cristallin ?", "reponse": "Accommodation"}, {"question": "Photorécepteurs de la vision des couleurs ?", "reponse": "Cônes"}, {"question": "Photorécepteurs de la vision nocturne ?", "reponse": "Bâtonnets"}, {"question": "Zone d’acuité maximale ?", "reponse": "Fovéa"}, {"question": "La cornée est-elle vascularisée ?", "reponse": "Non (avasculaire)"}, {"question": "Diamètre approximatif de l’œil ?", "reponse": "24 mm"}, {"question": "Trois tuniques de l’œil ?", "reponse": "Fibreuse, vasculaire (uvée), nerveuse (rétine)"}, {"question": "Cause principale de la presbytie ?", "reponse": "Sclérose / perte d’élasticité du cristallin"}, {"question": "Ordre des milieux transparents ?", "reponse": "Cornée → humeur aqueuse → cristallin → vitré"}, {"question": "Muscle de l’accommodation ?", "reponse": "Muscle ciliaire"}, {"question": "Nombre approximatif de cônes ?", "reponse": "≈ 6 millions"}, {"question": "Nombre approximatif de bâtonnets ?", "reponse": "≈ 120 millions"}, {"question": "Rôle de l’iris ?", "reponse": "Contrôler le diamètre pupillaire"}, {"question": "Que forment les axones des cellules ganglionnaires ?", "reponse": "Le nerf optique"}, {"question": "Nutrition de la cornée ?", "reponse": "Diffusion (humeur aqueuse + film lacrymal)"}, {"question": "Partie opaque de la tunique externe ?", "reponse": "Sclérotique"}, {"question": "Partie transparente de la tunique externe ?", "reponse": "Cornée"}, {"question": "Qu’est-ce que la macula ?", "reponse": "Zone centrale de la rétine riche en cônes"}, {"question": "Amplitude d’accommodation avec l’âge ?", "reponse": "Elle diminue (presbytie)"}], "sources": [{"titre": "Œil humain – Wikipédia", "url": "https://fr.wikipedia.org/wiki/%C5%92il_humain"}], "formationNom": "BTS Opticien-Lunetier"}, {"id": "opti-02", "formation": "bts-opticien", "matiere": "Analyse de la vision", "titre": "Amétropies et corrections", "ordre": 2, "cours": "<h3>1. Définition</h3><p>L’amétropie est un défaut de réfraction de l’œil : l’image d’un objet situé à l’infini ne se forme pas exactement sur la rétine lorsque l’accommodation est relâchée. L’œil emmétrope, au contraire, forme cette image nettesur la rétine sans effort accommodatif.</p><h3>2. Myopie</h3><p>L’œil est trop long (myopie axile) ou trop puissant (myopie de courbure / d’indice). L’image d’un objet lointain se forme en avant de la rétine. Le sujet voit flou de loin, mieux de près. Correction par verres (ou lentilles) divergents (négatifs) qui reculent le plan image sur la rétine.</p><h3>3. Hypermétropie</h3><p>L’œil est trop court ou pas assez puissant. L’image se forme en arrière de la rétine. Le jeune hypermétrope peut compenser par l’accommodation ; avec l’âge ou pour les fortes hypermétropies, la vision de près puis de loin devient difficile. Correction par verres convergents (positifs).</p><h3>4. Astigmatisme</h3><p>La cornée (le plus souvent) n’est pas sphérique : elle présente des rayons de courbure différents selon les méridiens (forme torique). Les rayons lumineux ne convergent pas en un point unique mais en deux foyers distincts. La vision est brouillée à toutes les distances. Correction par verres cylindriques (ou toriques en lentilles), caractérisés par une puissance et un axe.</p><h3>5. Presbytie</h3><p>Ce n’est pas une amétropie au sens strict mais une perte progressive de l’amplitude d’accommodation liée à l’âge (généralement perceptible après 40-45 ans). On ajoute une addition (Add) pour la vision de près. Les verres progressifs combinent vision de loin, intermédiaire et près.</p><h3>6. Lecture d’une prescription</h3><p>Exemple : −3,50 (−1,25) 90° Add +2,00. Sphère −3,50 (myopie), cylindre −1,25 à 90° (astigmatisme), addition +2,00 (presbytie).</p><h3>7. Tableau récapitulatif</h3><pre>Défaut          | Cause principale      | Correction\n----------------|-----------------------|------------------\nMyopie          | Œil trop long/puissant| Verres divergents (−)\nHypermétropie   | Œil trop court        | Verres convergents (+)\nAstigmatisme    | Cornée torique        | Cylindre\nPresbytie       | Perte d’accommodation | Addition / progressifs</pre>", "resume": ["Myopie → image en avant de la rétine → verres divergents (−).", "Hypermétropie → image en arrière → verres convergents (+).", "Astigmatisme → deux foyers → verres cylindriques.", "Presbytie → perte d’accommodation → addition."], "a_retenir": ["Toujours relier le signe de la sphère au type d’amétropie.", "L’axe du cylindre est indispensable pour l’astigmatisme.", "L’addition ne corrige que la vision de près (presbytie).", "Un même œil peut cumuler plusieurs défauts (myopie + astigmatisme + presbytie)."], "points_cles": ["Myopie", "Hypermétropie", "Astigmatisme", "Presbytie", "Sphère", "Cylindre", "Axe", "Addition", "Emmétropie", "Verres progressifs"], "exercices": [{"question": "Un client a −4,00 (−0,75) 180°. Décrivez les défauts et le type de verres.", "correction": "Myopie de −4,00 δ associée à un astigmatisme de −0,75 δ à 180°. Verres sphéro-cylindriques divergents."}, {"question": "Pourquoi un jeune hypermétrope peut-il avoir une bonne acuité de loin sans correction ?", "correction": "Parce qu’il compense par l’accommodation. Cette compensation devient plus difficile avec l’âge ou la fatigue."}, {"question": "Qu’indique l’addition sur une prescription ?", "correction": "La puissance supplémentaire à ajouter pour la vision de près (compensation de la presbytie)."}, {"question": "Différence entre un verre unifocal et un verre progressif ?", "correction": "Unifocal = une seule puissance. Progressif = variation continue de puissance du loin vers le près."}, {"question": "Un œil emmétrope a-t-il besoin de correction pour voir de loin ?", "correction": "Non, l’image se forme déjà sur la rétine sans accommodation."}, {"question": "Que signifie un cylindre « à 90° » ?", "correction": "L’axe du cylindre correcteur est orienté à 90° (méridien vertical selon la convention habituelle)."}], "qcm": [{"question": "La correction de la myopie se fait avec des verres :", "choix": ["Convergents", "Divergents", "Prismatiques uniquement", "De contact obligatoirement"], "reponse": "Divergents"}, {"question": "L’astigmatisme est le plus souvent dû à :", "choix": ["Un cristallin opaque", "Une cornée torique", "Un nerf optique lésé", "Une rétine décollée"], "reponse": "Une cornée torique"}, {"question": "La presbytie apparaît en général :", "choix": ["Dès l’enfance", "Vers 20 ans", "Après 40-45 ans", "Uniquement après 70 ans"], "reponse": "Après 40-45 ans"}, {"question": "Dans la prescription −2,00 (−1,00) 80°, le −1,00 représente :", "choix": ["La sphère", "Le cylindre", "L’addition", "L’axe"], "reponse": "Le cylindre"}, {"question": "Un verre progressif corrige :", "choix": ["Uniquement la myopie", "Loin + intermédiaire + près", "Uniquement l’astigmatisme", "Uniquement la presbytie sans loin"], "reponse": "Loin + intermédiaire + près"}, {"question": "L’hypermétropie se corrige par des verres :", "choix": ["Divergents", "Convergents", "Cylindriques purs", "Neutres"], "reponse": "Convergents"}, {"question": "Emmétropie signifie :", "choix": ["Fort astigmatisme", "Absence d’amétropie", "Forte myopie", "Cécité"], "reponse": "Absence d’amétropie"}, {"question": "L’addition est exprimée :", "choix": ["En degrés", "En dioptries positives", "En millimètres", "En pourcentages"], "reponse": "En dioptries positives"}, {"question": "Image en avant de la rétine = ", "choix": ["Hypermétropie", "Myopie", "Presbytie", "Astigmatisme pur"], "reponse": "Myopie"}, {"question": "Le symbole « Add » sur une ordonnance désigne :", "choix": ["L’addition de près", "L’axe du cylindre", "L’écart pupillaire", "Le type de monture"], "reponse": "L’addition de près"}], "flashcards": [{"question": "Myopie → type de verre ?", "reponse": "Divergent (−)"}, {"question": "Hypermétropie → type de verre ?", "reponse": "Convergent (+)"}, {"question": "Astigmatisme → type de verre ?", "reponse": "Cylindrique (ou torique)"}, {"question": "Presbytie → que rajoute-t-on ?", "reponse": "Une addition"}, {"question": "Image en avant de la rétine ?", "reponse": "Myopie"}, {"question": "Image en arrière de la rétine ?", "reponse": "Hypermétropie"}, {"question": "Cornée non sphérique ?", "reponse": "Astigmatisme"}, {"question": "Perte d’accommodation liée à l’âge ?", "reponse": "Presbytie"}, {"question": "Œil sans défaut de réfraction ?", "reponse": "Emmétrope"}, {"question": "Verre qui combine loin et près en continu ?", "reponse": "Progressif"}, {"question": "Éléments d’une prescription complète ?", "reponse": "Sphère, cylindre, axe, (addition)"}, {"question": "Unité de la puissance des verres ?", "reponse": "Dioptrie (δ ou D)"}, {"question": "Axe du cylindre s’exprime en ?", "reponse": "Degrés (0 à 180°)"}, {"question": "Compensation possible de l’hypermétropie chez le jeune ?", "reponse": "Par l’accommodation"}, {"question": "Myopie axile = ", "reponse": "Œil trop long"}, {"question": "Quand apparaît typiquement la presbytie ?", "reponse": "Après 40-45 ans"}, {"question": "Verre unifocal = ", "reponse": "Une seule puissance"}, {"question": "Lentille torique corrige ?", "reponse": "L’astigmatisme"}, {"question": "Signe de la sphère myopique ?", "reponse": "Négatif (−)"}, {"question": "Signe de la sphère hypermétropique ?", "reponse": "Positif (+)"}], "sources": [{"titre": "Amétropie – Wikipédia", "url": "https://fr.wikipedia.org/wiki/Am%C3%A9tropie"}], "formationNom": "BTS Opticien-Lunetier"}, {"id": "sio-01", "formation": "bts-sio", "matiere": "Réseaux", "titre": "Modèle OSI et TCP/IP", "ordre": 1, "cours": "<h3>1. Pourquoi un modèle en couches ?</h3><p>Pour standardiser la communication entre systèmes hétérogènes, l’ISO a défini le modèle OSI (Open Systems Interconnection). Il découpe le processus de communication en 7 couches, chacune ayant un rôle précis et des interfaces bien définies avec les couches adjacentes. Cela permet l’interopérabilité et la modularité (on peut faire évoluer une couche sans tout reconstruire).</p><h3>2. Les 7 couches OSI</h3><p><strong>1 – Physique</strong> : transmission des bits sur le support (câble, fibre, radio). Connecteurs, niveaux électriques, modulation.</p><p><strong>2 – Liaison de données</strong> : trames, adressage MAC, détection d’erreurs (CRC), contrôle d’accès au support (CSMA/CD, etc.). Ethernet, Wi-Fi.</p><p><strong>3 – Réseau</strong> : adressage logique (IP), routage, fragmentation. Protocole IP, ICMP, OSPF, BGP.</p><p><strong>4 – Transport</strong> : segmentation, contrôle de flux et d’erreurs bout en bout. TCP (fiable, connecté) et UDP (non connecté, plus rapide).</p><p><strong>5 – Session</strong> : ouverture, maintien et fermeture des sessions de communication.</p><p><strong>6 – Présentation</strong> : syntaxe des données, chiffrement, compression (ex. SSL/TLS, formats d’image).</p><p><strong>7 – Application</strong> : interface avec les applications (HTTP, FTP, SMTP, DNS, etc.).</p><h3>3. Modèle TCP/IP</h3><p>Plus pragmatique, c’est le modèle réellement utilisé sur Internet. Il regroupe souvent :</p><ul><li>Application (couches 5-6-7 OSI)</li><li>Transport (TCP/UDP)</li><li>Internet (IP)</li><li>Accès réseau (couches 1-2)</li></ul><h3>4. Encapsulation</h3><p>Chaque couche ajoute son en-tête (et parfois une queue) : données applicatives → segment (TCP) → paquet (IP) → trame (Ethernet) → bits. À la réception, désencapsulation inverse.</p><h3>5. Schéma ASCII des couches</h3><pre>7 Application     HTTP, FTP, DNS...\n6 Présentation    SSL, formats\n5 Session         Sessions\n4 Transport       TCP / UDP\n3 Réseau          IP, routage\n2 Liaison         Ethernet, MAC\n1 Physique        Câbles, signaux</pre>", "resume": ["OSI = 7 couches (Physique → Application).", "TCP/IP = modèle pratique d’Internet (4 couches conceptuelles).", "Encapsulation = ajout d’en-têtes à chaque niveau.", "TCP = fiable ; UDP = rapide non connecté."], "a_retenir": ["Couche 3 = IP et routage ; Couche 4 = TCP/UDP.", "Adresse MAC = couche 2 ; adresse IP = couche 3.", "L’encapsulation permet l’indépendance des couches."], "points_cles": ["OSI", "TCP/IP", "Encapsulation", "TCP", "UDP", "IP", "MAC", "Routage", "Trame", "Paquet", "Segment"], "exercices": [{"question": "Quelle couche est responsable du routage ?", "correction": "La couche 3 – Réseau (protocole IP, tables de routage)."}, {"question": "Différence principale entre TCP et UDP ?", "correction": "TCP est orienté connexion, avec accusés de réception, retransmission et contrôle de flux (fiable). UDP est sans connexion, sans garantie de livraison (plus léger et rapide)."}, {"question": "À quelle couche appartient l’adresse MAC ?", "correction": "Couche 2 – Liaison de données."}, {"question": "Qu’est-ce que l’e     if (this.currentCours && this.currentCours.id === id) this.openCours(id);
  },

  addHistory(id) {

    if (this.history.length > 30) this.history.pop();

      <div id="panel-resume" class="panel">
        <h2>Résumé</h2>
        <ul>${(c.resume || []).map(r => `<li>${r}</li>`).join("")}</ul>
        <div class="memo"><strong>Points clés</strong><br>${(c.points_cles || []).join(" • ")}</div>
      </div>

      <div id="panel-exercices" class="panel">
        <h2>Exercices</h2>
        ${(c.exercices || []).map((e,i) => `
          <div class="exo"><strong>Exercice ${i+1}</strong><br>${e.question}</div>
        `).join("") || "<p>Aucun exercice.</p>"}
      </div>

      <div id="panel-corriges" class="panel">
        <h2>Corrigés</h2>
        ${(c.exercices || []).map((e,i) => `
          <div class="memo"><strong>Exercice ${i+1}</strong><br>${e.question}<br><em>→ ${e.correction}</em></div>
        `).join("") || "<p>Aucun corrigé.</p>"}
      </div>

      <div id="panel-qcm" class="panel">
        <h2>QCM</h2>
        <div id="qcm-area">${this.renderQCM(c)}</div>
        <button class="btn" onclick="App.checkQCM()">Vérifier les réponses</button>
      </div>

      <div id="panel-flashcards" class="panel">
        <h2>Flashcards</h2>
        <p style="font-size:.88rem;color:var(--m);margin-bottom:1rem">Clique sur une carte pour révéler la réponse.</p>
        ${(c.flashcards || []).map((f,i) => `
          <div class="flash-card" onclick="this.classList.toggle('flipped')">
            <div class="front"><strong>Q${i+1}</strong><br>${f.question}</div>
            <div class="back"><strong>Réponse</strong><br>${f.reponse}</div>
          </div>
        `).join("") || "<p>Aucune flashcard.</p>"}
      </div>

      <div id="panel-sources" class="panel">
        <h2>Sources & approfondissement</h2>
        ${(c.sources || []).length ? c.sources.map(s => `
          <div class="wiki-box"><a href="${s.url}" target="_blank" rel="noopener">${s.titre}</a></div>
        `).join("") : "<p>Aucune source externe liée.</p>"}
        <p style="margin-top:1rem;font-size:.85rem;color:var(--m)">Tu peux aussi rechercher ce sujet sur Wikiversité / Wikipédia via la barre de recherche.</p>
      </div>`;
  },

  showTab(tab) {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("show"));
    const panel = document.getElementById("panel-" + tab);
    if (panel) panel.classList.add("show");
  },

  renderQCM(c) {
    return (c.qcm || []).map((q,i) => `
      <div class="qcm-item" data-idx="${i}">
        <strong>${i+1}. ${q.question}</strong>
        <div class="choix">
          ${q.choix.map(ch => `
            <label><input type="radio" name="qcm${i}" value="${ch}"> ${ch}</label>
          `).join("")}
        </div>
        <div class="resultat" style="margin-top:.5rem;font-weight:600"></div>
      </div>
    `).join("");
  },

  checkQCM() {
    if (!this.currentCours) return;
    const qcm = this.currentCours.qcm || [];
    qcm.forEach((q,i) => {
      const item = document.querySelector(`.qcm-item[data-idx="${i}"]`);
      if (!item) return;
      const selected = item.querySelector(`input[name="qcm${i}"]:checked`);
      const res = item.querySelector(".resultat");
      if (!selected) {
        res.textContent = "Pas de réponse";
        res.style.color = "var(--m)";
      } else if (selected.value === q.reponse) {
        res.textContent = "✓ Correct";
        res.style.color = "#16a34a";
      } else {
        res.textContent = `✗ Incorrect — réponse : ${q.reponse}`;
        res.style.color = "#ef4444";
      }
    });
  },

  markDone(id) {
    this.setProgress(id, "done");
    this.openCours(id);
  },

  downloadPDF() {
    if (!this.currentCours) return;
    const c = this.currentCours;
    const text = `
${c.titre}
${c.formationNom} – ${c.matiere}

=== COURS ===
${c.cours.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim()}

=== RÉSUMÉ ===
${(c.resume || []).map(r => "• " + r).join("\n")}

=== POINTS CLÉS ===
${(c.points_cles || []).join(" • ")}

=== EXERCICES ===
${(c.exercices || []).map((e,i) => `${i+1}. ${e.question}\n   → ${e.correction}`).join("\n\n")}
`;
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = c.titre.replace(/\s+/g, "_") + ".txt";
    a.click();
  },

  showFavoris() {
    const list = this.favoris.map(id => {
      const c = COURS_DB.find(x => x.id === id);
      if (!c) return "";
      return `<div class="chapitre-item" onclick="App.openCours('${id}')"><strong>${c.titre}</strong><span>${c.formationNom}</span></div>`;
    }).join("") || "<p>Aucun favori pour le moment.</p>";
    document.getElementById("main").innerHTML = `
      <div class="breadcrumb"><span onclick="App.goHome()">Accueil</span> › Favoris</div>
      <h1>⭐ Favoris</h1>
      ${list}`;
  },

  showHistory() {
    const list = this.history.map(id => {
      const c = COURS_DB.find(x => x.id === id);
      if (!c) return "";
      return `<div class="chapitre-item" onclick="App.openCours('${id}')"><strong>${c.titre}</strong><span>${c.formationNom}</span></div>`;
    }).join("") || "<p>Aucun historique.</p>";
    document.getElementById("main").innerHTML = `
      <div class="breadcrumb"><span onclick="App.goHome()">Accueil</span> › Historique</div>
      <h1>🕐 Historique</h1>
      ${list}`;
  },

  globalSearch(q) {
    if (!q || q.length < 2) return;
    const lower = q.toLowerCase();
    const results = COURS_DB.filter(c =>
      c.titre.toLowerCase().includes(lower) ||
      c.matiere.toLowerCase().includes(lower) ||
      c.formationNom.toLowerCase().includes(lower) ||
      (c.points_cles || []).some(p => p.toLowerCase().includes(lower)) ||
      (c.resume || []).some(r => r.toLowerCase().includes(lower))
    );
    const list = results.map(c => `
      <div class="chapitre-item" onclick="App.openCours('${c.id}')">
        <div><strong>${c.titre}</strong><div style="font-size:.8rem;color:var(--m)">${c.formationNom} • ${c.matiere}</div></div>
      </div>`).join("") || "<p>Aucun résultat.</p>";
    document.getElementById("main").innerHTML = `
      <div class="breadcrumb"><span onclick="App.goHome()">Accueil</span> › Recherche</div>
      <h1>Résultats pour « ${q} »</h1>
      ${list}`;
  }
};


document.addEventListener("DOMContentLoaded", () => {
  App.init();
  document.getElementById("search-form").addEventListener("submit", e => {
    e.preventDefault();
    App.globalSearch(document.getElementById("search-input").value.trim());
  });
});
</script>
</body>
</html>
