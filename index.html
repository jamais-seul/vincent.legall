<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Études Sup France — Ressources publiques</title>
<style>
:root{--p:#1e3a8a;--pl:#3b82f6;--s:#0f766e;--o:#ea580c;--bg:#f1f5f9;--c:#fff;--t:#1e293b;--m:#64748b;--b:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);line-height:1.6}
a{color:#2563eb;text-decoration:none}a:hover{text-decoration:underline}
header{background:#1e3a8a;color:#fff;padding:.8rem 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.top{max-width:1200px;margin:0 auto;padding:0 1.2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.logo{font-weight:700;font-size:1.25rem}.logo span{color:#fbbf24}
.search-bar{display:flex;gap:.4rem;flex:1;max-width:480px}
.search-bar input{flex:1;padding:.5rem .8rem;border:none;border-radius:8px;font-size:.95rem}
.search-bar button{background:#fbbf24;color:#1e3a8a;border:none;padding:.5rem 1rem;border-radius:8px;font-weight:600;cursor:pointer}
.wrap{max-width:1200px;margin:0 auto;padding:1.3rem 1.2rem 3rem;display:grid;grid-template-columns:260px 1fr;gap:1.4rem}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.side{background:#fff;border:1px solid var(--b);border-radius:12px;padding:1rem;height:fit-content;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow-y:auto}
.side h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--m);margin:1rem 0 .5rem}
.side h3:first-child{margin-top:0}
.side a{display:block;padding:.38rem .65rem;border-radius:6px;color:var(--t);font-size:.86rem;margin-bottom:.12rem;cursor:pointer}
.side a:hover,.side a.on{background:#eff6ff;color:var(--p);text-decoration:none;font-weight:500}
.main h1{font-size:1.6rem;color:var(--p);margin-bottom:.3rem}
.lead{color:var(--m);margin-bottom:1.2rem;font-size:.95rem}
.sec-title{font-size:1.15rem;color:var(--o);margin:1.4rem 0 .7rem;padding-bottom:.25rem;border-bottom:2px solid #fed7aa}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.85rem;margin:1rem 0}
.card{background:#fff;border:1px solid var(--b);border-radius:10px;padding:1rem;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08);border-color:#93c5fd}
.card .ic{font-size:1.4rem;margin-bottom:.25rem}
.card h3{font-size:.92rem;color:var(--p);margin-bottom:.15rem}
.card p{font-size:.8rem;color:var(--m);margin:0}
.result{background:#fff;border:1px solid var(--b);border-radius:10px;padding:1rem 1.2rem;margin-bottom:.8rem}
.result h3{font-size:1.05rem;margin-bottom:.3rem}
.result .meta{font-size:.8rem;color:var(--m);margin-bottom:.5rem}
.result .extract{font-size:.9rem;color:var(--t);margin-bottom:.6rem;white-space:pre-wrap}
.result .source-badge{display:inline-block;background:#eff6ff;color:var(--p);font-size:.75rem;padding:.15rem .5rem;border-radius:4px;margin-right:.4rem}
.btn{display:inline-block;background:var(--pl);color:#fff;padding:.4rem .9rem;border-radius:6px;font-size:.85rem;border:none;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--p)}
.btn-secondary{background:#e2e8f0;color:var(--t)}
.loading{text-align:center;padding:2rem;color:var(--m)}
.error{background:#fef2f2;border-left:4px solid #ef4444;padding:.8rem 1rem;margin:1rem 0;border-radius:0 8px 8px 0}
.attr{font-size:.78rem;color:var(--m);margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--b)}
.pagination{display:flex;gap:.5rem;justify-content:center;margin:1.5rem 0;flex-wrap:wrap}
.pagination button{padding:.4rem .8rem;border:1px solid var(--b);background:#fff;border-radius:6px;cursor:pointer}
.pagination button.on{background:var(--p);color:#fff;border-color:var(--p)}
.breadcrumb{font-size:.85rem;color:var(--m);margin-bottom:1rem}
.breadcrumb span{cursor:pointer;color:var(--pl)}
.chapitre-list{list-style:none}
.chapitre-list li{background:#fff;border:1px solid var(--b);border-radius:8px;padding:.8rem 1rem;margin-bottom:.5rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.chapitre-list li:hover{border-color:#93c5fd}
footer{background:#0f172a;color:#94a3b8;text-align:center;padding:1.4rem;font-size:.84rem;margin-top:2rem}
.sources-info{background:#fff;border:1px solid var(--b);border-radius:10px;padding:1rem;margin:1rem 0;font-size:.88rem}
.sources-info ul{margin:.5rem 0 0 1.2rem}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">Études Sup <span>France</span></div>
    <form class="search-bar" id="search-form">
      <input type="search" id="search-input" placeholder="Rechercher un cours, un concept…" autocomplete="off">
      <button type="submit">Rechercher</button>
    </form>
  </div>
</header>

<div class="wrap">
  <aside class="side" id="sidebar"></aside>
  <div class="main" id="main">
    <div class="loading">Chargement…</div>
  </div>
</div>

<footer>
  <p><strong>Études Sup France</strong> — Agrégateur de ressources éducatives ouvertes · 2026</p>
  <p style="margin-top:.4rem;font-size:.78rem">
    Contenu chargé dynamiquement depuis des sources publiques (Wikiversité, Wikipédia…).<br>
    Aucun cours inventé. Respect des licences CC BY-SA. Toujours consulter la source originale.
  </p>
</footer>

<script>
/* =========================================================
   DONNÉES EMBARQUÉES (équivalent des fichiers JSON)
   ========================================================= */
const SOURCES = [
  {
    id: "wikiversite",
    name: "Wikiversité",
    type: "mediawiki",
    baseUrl: "https://fr.wikiversity.org",
    api: "https://fr.wikiversity.org/w/api.php",
    license: "CC BY-SA 4.0",
    enabled: true,
    priority: 1
  },
  {
    id: "wikipedia_fr",
    name: "Wikipédia (FR)",
    type: "mediawiki",
    baseUrl: "https://fr.wikipedia.org",
    api: "https://fr.wikipedia.org/w/api.php",
    license: "CC BY-SA 4.0",
    enabled: true,
    priority: 2
  },
  {
    id: "wikipedia_en",
    name: "Wikipedia (EN)",
    type: "mediawiki",
    baseUrl: "https://en.wikipedia.org",
    api: "https://en.wikipedia.org/w/api.php",
    license: "CC BY-SA 4.0",
    enabled: true,
    priority: 3
  }
];

const FORMATIONS = [
  { id:"bts-sio", nom:"BTS SIO", categorie:"BTS", icone:"💻", description:"Services Informatiques aux Organisations (SISR / SLAM)", motsCles:["réseaux","systèmes","cybersécurité","développement","base de données","linux","adressage IP","OSI","TCP/IP"], sourcesPrioritaires:["wikiversite","wikipedia_fr"] },
  { id:"bts-opticien", nom:"BTS Opticien-Lunetier", categorie:"BTS", icone:"👓", description:"Analyse de la vision, optique géométrique, montage", motsCles:["œil","cornée","cristallin","rétine","réfraction","myopie","hypermétropie","astigmatisme","presbytie","dioptrie"], sourcesPrioritaires:["wikiversite","wikipedia_fr"] },
  { id:"bts-mco", nom:"BTS MCO", categorie:"BTS", icone:"🛒", description:"Management Commercial Opérationnel", motsCles:["relation client","merchandising","gestion de stock","marge","management","vente conseil"], sourcesPrioritaires:["wikiversite","wikipedia_fr"] },
  { id:"bts-cg", nom:"BTS CG", categorie:"BTS", icone:"📒", description:"Comptabilité et Gestion", motsCles:["comptabilité","bilan","compte de résultat","amortissement","ratio","fonds de roulement"], sourcesPrioritaires:["wikiversite","wikipedia_fr"] },
  { id:"bts-ndrc", nom:"BTS NDRC", categorie:"BTS", icone:"🤝", description:"Négociation et Digitalisation de la Relation Client", motsCles:["CRM","omnicanal","négociation","relation client"], sourcesPrioritaires:["wikiversite","wikipedia_fr"] },
  { id:"bts-electrotechnique", nom:"BTS Électrotechnique", categorie:"BTS", icone:"⚡", description:"Électricité, automatismes, puissance", motsCles:["électricité","loi d'Ohm","courant","tension","puissance","triphasé"], sourcesPrioritaires:["wikiversite","wikipedia_fr"] },
  { id:"bts-ciel", nom:"BTS CIEL", categorie:"BTS", icone:"🔒", description:"Cybersécurité, Informatique et Réseaux", motsCles:["cybersécurité","réseaux","sécurité informatique","firewall"], sourcesPrioritaires:["wikiversite","wikipedia_fr"] },
  { id:"but-informatique", nom:"BUT Informatique", categorie:"BUT", icone:"🖥️", description:"Bachelor Universitaire de Technologie – Informatique", motsCles:["algorithmique","programmation","base de données","réseaux","développement web"], sourcesPrioritaires:["wikiversite","wikipedia_fr"] },
  { id:"licence-maths", nom:"Licence Mathématiques", categorie:"Licence", icone:"∫", description:"Licence de Mathématiques", motsCles:["analyse","algèbre","probabilités","statistiques"], sourcesPrioritaires:["wikiversite","wikipedia_fr"] },
  { id:"cpge-mpsi", nom:"CPGE MPSI", categorie:"CPGE", icone:"📐", description:"Classe Préparatoire MPSI", motsCles:["mathématiques","physique","sciences de l'ingénieur"], sourcesPrioritaires:["wikiversite","wikipedia_fr"] }
];

const MAPPINGS = {
  "bts-sio": [
    { chapitre:"Modèle OSI et TCP/IP", query:"modèle OSI OR TCP/IP", matiere:"Réseaux" },
    { chapitre:"Adressage IPv4", query:"adressage IPv4 OR masque de sous-réseau", matiere:"Réseaux" },
    { chapitre:"Cybersécurité de base", query:"cybersécurité OR phishing OR ransomware", matiere:"Sécurité" },
    { chapitre:"Administration Linux", query:"administration Linux OR commandes Linux", matiere:"Systèmes" },
    { chapitre:"Bases de données relationnelles", query:"SQL OR base de données relationnelle", matiere:"Développement" },
    { chapitre:"Algorithmique et programmation", query:"algorithmique OR programmation Python", matiere:"Développement" }
  ],
  "bts-opticien": [
    { chapitre:"Anatomie de l’œil", query:"anatomie de l'œil OR cornée cristallin rétine", matiere:"Analyse de la vision" },
    { chapitre:"Optique géométrique", query:"optique géométrique OR réfraction dioptrie", matiere:"Optique" },
    { chapitre:"Amétropies", query:"myopie hypermétropie astigmatisme presbytie", matiere:"Analyse de la vision" },
    { chapitre:"Lentilles de contact", query:"lentilles de contact", matiere:"Équipements" }
  ],
  "bts-mco": [
    { chapitre:"Relation client et vente conseil", query:"relation client OR techniques de vente", matiere:"Relation client" },
    { chapitre:"Merchandising", query:"merchandising OR implantation linéaire", matiere:"Animation de l’offre" },
    { chapitre:"Gestion des stocks", query:"gestion des stocks OR taux de rotation", matiere:"Gestion opérationnelle" },
    { chapitre:"Management d’équipe", query:"management d'équipe OR motivation au travail", matiere:"Management" }
  ],
  "bts-cg": [
    { chapitre:"Comptabilité générale", query:"comptabilité générale OR plan comptable", matiere:"Comptabilité" },
    { chapitre:"Analyse financière", query:"analyse financière OR ratios financiers", matiere:"Analyse" },
    { chapitre:"Bilan et compte de résultat", query:"bilan comptable OR compte de résultat", matiere:"Comptabilité" }
  ],
  "bts-electrotechnique": [
    { chapitre:"Lois fondamentales de l’électricité", query:"loi d'Ohm OR puissance électrique", matiere:"Électricité" },
    { chapitre:"Courants triphasés", query:"courant triphasé OR système triphasé", matiere:"Électricité" },
    { chapitre:"Automatismes", query:"automatisme industriel OR automate programmable", matiere:"Automatismes" }
  ],
  "bts-ciel": [
    { chapitre:"Fondamentaux de la cybersécurité", query:"cybersécurité OR sécurité des systèmes d'information", matiere:"Sécurité" },
    { chapitre:"Réseaux et protocoles", query:"protocoles réseau OR TCP/IP sécurité", matiere:"Réseaux" }
  ],
  "but-informatique": [
    { chapitre:"Algorithmique", query:"algorithmique OR structures de données", matiere:"Informatique" },
    { chapitre:"Programmation", query:"programmation orientée objet OR Python Java", matiere:"Développement" },
    { chapitre:"Bases de données", query:"bases de données OR SQL normalisation", matiere:"Données" }
  ],
  "licence-maths": [
    { chapitre:"Analyse", query:"analyse mathématique OR suites fonctions", matiere:"Mathématiques" },
    { chapitre:"Algèbre linéaire", query:"algèbre linéaire OR matrices espaces vectoriels", matiere:"Mathématiques" },
    { chapitre:"Probabilités", query:"probabilités OR variables aléatoires", matiere:"Mathématiques" }
  ],
  "cpge-mpsi": [
    { chapitre:"Analyse MPSI", query:"analyse MPSI OR suites séries", matiere:"Mathématiques" },
    { chapitre:"Algèbre MPSI", query:"algèbre linéaire CPGE", matiere:"Mathématiques" },
    { chapitre:"Physique", query:"mécanique OR électromagnétisme CPGE", matiere:"Physique" }
  ]
};

/* =========================================================
   MOTEUR
   ========================================================= */
const App = {
  sources: SOURCES.filter(s => s.enabled),
  formations: FORMATIONS,
  mappings: MAPPINGS,
  currentFormation: null,
  currentPage: 1,
  pageSize: 8,
  lastResults: [],
  lastTitre: "",

  init() {
    this.buildSidebar();
    this.goHome();
  },

  buildSidebar() {
    const side = document.getElementById("sidebar");
    const cats = {};
    this.formations.forEach(f => {
      if (!cats[f.categorie]) cats[f.categorie] = [];
      cats[f.categorie].push(f);
    });
    let html = "";
    for (const [cat, list] of Object.entries(cats)) {
      html += `<h3>${cat}</h3>`;
      list.forEach(f => {
        html += `<a data-id="${f.id}" onclick="App.openFormation('${f.id}')">${f.icone} ${f.nom}</a>`;
      });
    }
    side.innerHTML = html;
  },

  goHome() {
    this.currentFormation = null;
    document.querySelectorAll(".side a").forEach(a => a.classList.remove("on"));
    const cards = this.formations.map(f => `
      <div class="card" onclick="App.openFormation('${f.id}')">
        <div class="ic">${f.icone}</div>
        <h3>${f.nom}</h3>
        <p>${f.description}</p>
      </div>`).join("");
    document.getElementById("main").innerHTML = `
      <h1>Études Sup France — Ressources publiques</h1>
      <p class="lead">
        Contenu chargé dynamiquement depuis Wikiversité et Wikipédia (API MediaWiki).<br>
        Aucun cours inventé. Clique sur une formation puis sur un chapitre pour lancer la recherche.
      </p>
      <div class="sources-info">
        <strong>Sources actives :</strong>
        <ul>
          <li><strong>Wikiversité</strong> — CC BY-SA 4.0</li>
          <li><strong>Wikipédia (FR & EN)</strong> — CC BY-SA 4.0</li>
        </ul>
        Les extraits sont récupérés en direct. Clique toujours sur « Voir la source originale ».
      </div>
      <div class="sec-title">Formations</div>
      <div class="grid">${cards}</div>`;
  },

  openFormation(id) {
    const f = this.formations.find(x => x.id === id);
    if (!f) return;
    this.currentFormation = f;
    document.querySelectorAll(".side a").forEach(a => a.classList.toggle("on", a.dataset.id === id));

    const maps = this.mappings[id] || [];
    const list = maps.map((m, i) => `
      <li onclick="App.searchChapter('${id}', ${i})">
        <div>
          <strong>${m.chapitre}</strong>
          <div style="font-size:.82rem;color:var(--m)">${m.matiere || ""}</div>
        </div>
        <span class="btn btn-secondary">Charger</span>
      </li>`).join("");

    document.getElementById("main").innerHTML = `
      <div class="breadcrumb"><span onclick="App.goHome()">Accueil</span> › ${f.nom}</div>
      <h1>${f.icone} ${f.nom}</h1>
      <p class="lead">${f.description}</p>
      <p style="font-size:.88rem;color:var(--m)">
        Clique sur un chapitre → recherche automatique sur Wikiversité + Wikipédia → extraits + lien vers la page originale.
      </p>
      <div class="sec-title">Chapitres / Thèmes</div>
      <ul class="chapitre-list">${list || "<li>Aucun mapping défini.</li>"}</ul>
      <div id="results-area"></div>`;
  },

  async searchChapter(formationId, index) {
    const f = this.formations.find(x => x.id === formationId);
    const map = (this.mappings[formationId] || [])[index];
    if (!f || !map) return;

    const area = document.getElementById("results-area");
    area.innerHTML = `<div class="loading">Recherche en cours sur Wikiversité et Wikipédia…</div>`;

    const allResults = [];
    const mediaSources = this.sources.filter(s => s.type === "mediawiki");

    for (const source of mediaSources) {
      try {
        const results = await this.searchMediaWiki(source, map.query);
        results.forEach(r => {
          r._source = source;
          allResults.push(r);
        });
      } catch (e) {
        console.warn("Erreur source", source.id, e);
      }
    }

    const seen = new Set();
    this.lastResults = allResults.filter(r => {
      const key = r.title.toLowerCase();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    this.currentPage = 1;
    this.lastTitre = map.chapitre;
    this.renderResults();
  },

  async searchMediaWiki(source, query) {
    const params = new URLSearchParams({
      action: "query",
      list: "search",
      srsearch: query,
      srnamespace: source.id === "wikiversite" ? "0|100|102|104" : "0",
      srlimit: 12,
      format: "json",
      origin: "*"
    });
    const url = `${source.api}?${params}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    return (data.query && data.query.search) ? data.query.search : [];
  },

  async loadExtract(source, pageId) {
    const params = new URLSearchParams({
      action: "query",
      prop: "extracts|info",
      exintro: true,
      explaintext: true,
      inprop: "url",
      pageids: pageId,
      format: "json",
      origin: "*"
    });
    const url = `${source.api}?${params}`;
    const res = await fetch(url);
    const data = await res.json();
    const page = data.query && data.query.pages && data.query.pages[pageId];
    return page || null;
  },

  renderResults() {
    const area = document.getElementById("results-area");
    if (!area) return;

    if (!this.lastResults.length) {
      area.innerHTML = `
        <div class="sec-title">Résultats pour « ${this.lastTitre} »</div>
        <div class="error">Aucun résultat trouvé. Essaie une autre requête ou vérifie ta connexion.</div>`;
      return;
    }

    const start = (this.currentPage - 1) * this.pageSize;
    const pageItems = this.lastResults.slice(start, start + this.pageSize);
    const totalPages = Math.ceil(this.lastResults.length / this.pageSize);

    let html = `<div class="sec-title">Résultats pour « ${this.lastTitre} » (${this.lastResults.length})</div>`;

    pageItems.forEach(r => {
      const src = r._source;
      const wikiUrl = `${src.baseUrl}/wiki/${encodeURIComponent(r.title.replace(/ /g, "_"))}`;
      html += `
        <div class="result" id="res-${r.pageid}">
          <h3>${r.title}</h3>
          <div class="meta">
            <span class="source-badge">${src.name}</span>
            ${r.snippet ? r.snippet.replace(/<\/?span[^>]*>/g, "") : ""}
          </div>
          <div class="extract" id="extract-${r.pageid}">Chargement de l’extrait…</div>
          <a class="btn" href="${wikiUrl}" target="_blank" rel="noopener">Voir la source originale</a>
        </div>`;
    });

    if (totalPages > 1) {
      html += `<div class="pagination">`;
      for (let p = 1; p <= totalPages; p++) {
        html += `<button class="${p === this.currentPage ? "on" : ""}" onclick="App.goPage(${p})">${p}</button>`;
      }
      html += `</div>`;
    }

    html += `<div class="attr">
      Extraits chargés via l’API MediaWiki.<br>
      Licence : CC BY-SA. Toujours consulter et citer la page originale.
    </div>`;

    area.innerHTML = html;

    // Charger les extraits
    pageItems.forEach(async r => {
      try {
        const page = await this.loadExtract(r._source, r.pageid);
        const el = document.getElementById(`extract-${r.pageid}`);
        if (el && page) {
          const text = (page.extract || "").substring(0, 550);
          el.textContent = text + (text.length >= 550 ? "…" : "");
        }
      } catch (e) {
        const el = document.getElementById(`extract-${r.pageid}`);
        if (el) el.textContent = "Extrait non disponible.";
      }
    });
  },

  goPage(p) {
    this.currentPage = p;
    this.renderResults();
    const area = document.getElementById("results-area");
    if (area) area.scrollIntoView({ behavior: "smooth", block: "start" });
  },

  async globalSearch(q) {
    if (!q || q.trim().length < 2) return;
    document.getElementById("main").innerHTML = `<div class="loading">Recherche globale « ${q} »…</div>`;

    const allResults = [];
    for (const source of this.sources) {
      try {
        const results = await this.searchMediaWiki(source, q);
        results.forEach(r => { r._source = source; allResults.push(r); });
      } catch (e) { console.warn(e); }
    }

    const seen = new Set();
    this.lastResults = allResults.filter(r => {
      const key = r.title.toLowerCase();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    this.currentPage = 1;
    this.lastTitre = q;
    this.currentFormation = null;

    document.getElementById("main").innerHTML = `<div id="results-area"></div>`;
    this.renderResults();
  }
};

document.addEventListener("DOMContentLoaded", () => {
  App.init();
  document.getElementById("search-form").addEventListener("submit", e => {
    e.preventDefault();
    const q = document.getElementById("search-input").value.trim();
    App.globalSearch(q);
  });
});
</script>
</body>
</html>
