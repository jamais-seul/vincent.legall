<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Études Sup France — Plateforme</title>
<style>

:root {
  --p:#1e3a8a; --pl:#3b82f6; --s:#0f766e; --o:#ea580c;

[data-theme="dark"] {

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);line-height:1.6;transition:background .2s,color .2s}
a{color:var(--pl);text-decoration:none}a:hover{text-decoration:underline}
header{background:var(--header);color:#fff;padding:.7rem 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.top{max-width:1280px;margin:0 auto;padding:0 1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem}
.logo{font-weight:700;font-size:1.2rem;cursor:pointer}.logo span{color:#fbbf24}
.actions{display:flex;gap:.5rem;align-items:center}
.actions button,.search-bar button{background:#fbbf24;color:#1e3a8a;border:none;padding:.4rem .8rem;border-radius:8px;font-weight:600;cursor:pointer;font-size:.85rem}
.search-bar{display:flex;gap:.3rem}
.search-bar input{padding:.4rem .7rem;border:none;border-radius:8px;font-size:.9rem;min-width:180px}
.wrap{max-width:1280px;margin:0 auto;padding:1.2rem 1rem 3rem;display:grid;grid-template-columns:250px 1fr;gap:1.3rem}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.side{position:static;max-height:none}}
.side{background:var(--side);border:1px solid var(--b);border-radius:12px;padding:1rem;height:fit-content;position:sticky;top:65px;max-height:calc(100vh - 80px);overflow-y:auto}
.side h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--m);margin:1rem 0 .4rem}
.side h3:first-child{margin-top:0}
.side a{display:block;padding:.35rem .6rem;border-radius:6px;color:var(--t);font-size:.85rem;margin-bottom:.1rem;cursor:pointer}
.side a:hover,.side a.on{background:rgba(59,130,246,.15);color:var(--p);text-decoration:none;font-weight:500}
.main h1{font-size:1.55rem;color:var(--p);margin-bottom:.25rem}
.lead{color:var(--m);margin-bottom:1rem;font-size:.93rem}
.sec-title{font-size:1.15rem;color:var(--o);margin:1.3rem 0 .6rem;padding-bottom:.2rem;border-bottom:2px solid #fed7aa}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem;margin:1rem 0}
.card{background:var(--card);border:1px solid var(--b);border-radius:10px;padding:1rem;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1);border-color:var(--pl)}
.card .ic{font-size:1.35rem;margin-bottom:.2rem}
.card h3{font-size:.9rem;color:var(--p);margin-bottom:.1rem}
.card p{font-size:.78rem;color:var(--m);margin:0}
.breadcrumb{font-size:.82rem;color:var(--m);margin-bottom:.8rem}
.breadcrumb span{cursor:pointer;color:var(--pl)}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0}
.tabs button{padding:.45rem .9rem;border:1px solid var(--b);background:var(--card);border-radius:8px;cursor:pointer;font-size:.85rem;color:var(--t)}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.panel{display:none;background:var(--card);border:1px solid var(--b);border-radius:12px;padding:1.3rem;margin-top:.5rem}
.panel.show{display:block}
.panel h2{color:var(--p);margin-bottom:.8rem;font-size:1.25rem}
.panel h3{color:var(--s);margin:1rem 0 .4rem;font-size:1.05rem}
.memo{background:rgba(22,163,74,.1);border-left:4px solid #16a34a;padding:.8rem 1rem;margin:1rem 0;border-radius:0 8px 8px 0}
.exo{background:rgba(234,88,12,.08);border-left:4px solid #ea580c;padding:.8rem 1rem;margin:1rem 0;border-radius:0 8px 8px 0}
.qcm-item{background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:1rem;margin-bottom:.8rem}
.qcm-item .choix label{display:block;padding:.35rem .5rem;margin:.2rem 0;cursor:pointer;border-radius:6px}
.qcm-item .choix label:hover{background:rgba(59,130,246,.1)}
.flash-card{background:var(--card);border:2px solid var(--b);border-radius:12px;padding:1.5rem;margin:1rem 0;min-height:140px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;transition:.2s}
.flash-card:hover{border-color:var(--pl)}
.flash-card .back{display:none}
.flash-card.flipped .front{display:none}
.flash-card.flipped .back{display:block}
.progress-bar{height:8px;background:var(--b);border-radius:4px;overflow:hidden;margin:.5rem 0 1rem}
.progress-bar div{height:100%;background:var(--s);transition:width .3s}
.badge{display:inline-block;font-size:.7rem;padding:.15rem .45rem;border-radius:4px;margin-left:.3rem}
.badge.done{background:#16a34a;color:#fff}
.badge.progress{background:#ea580c;color:#fff}
.badge.todo{background:var(--b);color:var(--m)}
.chapitre-item{background:var(--card);border:1px solid var(--b);border-radius:10px;padding:.9rem 1rem;margin-bottom:.5rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.chapitre-item:hover{border-color:var(--pl)}
.btn{display:inline-block;background:var(--pl);color:#fff;padding:.4rem .9rem;border-radius:6px;font-size:.85rem;border:none;cursor:pointer;margin:.2rem}
.btn:hover{opacity:.9}
.btn-sec{background:var(--b);color:var(--t)}
.fav{color:#fbbf24;cursor:pointer;font-size:1.1rem}
footer{background:#0f172a;color:#94a3b8;text-align:center;padding:1.3rem;font-size:.82rem;margin-top:2rem}
.wiki-box{background:rgba(59,130,246,.08);border:1px solid var(--pl);border-radius:10px;padding:1rem;margin:1rem 0;font-size:.9rem}
ul{margin:.4rem 0 .6rem 1.3rem}li{margin-bottom:.25rem}
table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.9rem}
th,td{border:1px solid var(--b);padding:.45rem .65rem;text-align:left}
th{background:rgba(59,130,246,.1);color:var(--p)}

</style>
</head>

const App = {
  progress: JSON.parse(localStorage.getItem("esf_progress") || "{}"),
  favoris: JSON.parse(localStorage.getItem("esf_favoris") || "[]"),
  history: JSON.parse(localStorage.getItem("esf_history") || "[]"),
  currentCours: null,
  currentTab: "cours",

  init() {
    if (localStorage.getItem("esf_theme") === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
    this.buildSidebar();
    this.goHome();
  },

  save() {
    localStorage.setItem("esf_progress", JSON.stringify(this.progress));
    localStorage.setItem("esf_favoris", JSON.stringify(this.favoris));
    localStorage.setItem("esf_history", JSON.stringify(this.history));
  },

  toggleTheme() {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    document.documentElement.setAttribute("data-theme", isDark ? "" : "dark");
    localStorage.setItem("esf_theme", isDark ? "light" : "dark");
  },

  setProgress(id, status) {
    this.progress[id] = status; // "todo" | "progress" | "done"
    this.save();
  },

  getProgress(id) {
    return this.progress[id] || "todo";
  },

  toggleFavori(id) {
    const i = this.favoris.indexOf(id);
    if (i >= 0) this.favoris.splice(i, 1);
    else this.favoris.push(id);
    this.save();
    if (this.currentCours && this.currentCours.id === id) this.openCours(id);
  },

  addHistory(id) {
    this.history = this.history.filter(x => x !== id);
    this.history.unshift(id);
    if (this.history.length > 30) this.history.pop();
    this.save();
  },

  buildSidebar() {
    const side = document.getElementById("sidebar");
    const cats = {};
    FORMATIONS.forEach(f => {
      if (!cats[f.cat]) cats[f.cat] = [];
      cats[f.cat].push(f);
    });
    let html = "";
    for (const [cat, list] of Object.entries(cats)) {
      html += `<h3>${cat}</h3>`;
      list.forEach(f => {
        html += `<a data-id="${f.id}" onclick="App.openFormation('${f.id}')">${f.icone} ${f.nom}</a>`;
      });
    }
    side.innerHTML = html;
  },

  goHome() {
    document.querySelectorAll(".side a").forEach(a => a.classList.remove("on"));
    const cards = FORMATIONS.map(f => {
      const count = COURS_DB.filter(c => c.formation === f.id).length;
      return `
        <div class="card" onclick="App.openFormation('${f.id}')">
          <div class="ic">${f.icone}</div>
          <h3>${f.nom}</h3>
          <p>${count} chapitre${count > 1 ? "s" : ""} disponible${count > 1 ? "s" : ""}</p>
        </div>`;
    }).join("");
    document.getElementById("main").innerHTML = `
      <h1>Plateforme d’apprentissage</h1>
      <p class="lead">Cours structurés • Résumés • Exercices • QCM • Flashcards • Progression sauvegardée</p>
      <div class="sec-title">Formations</div>
      <div class="grid">${cards}</div>
      <div class="sec-title">Comment utiliser</div>
      <p style="font-size:.9rem;color:var(--m)">1. Choisis une formation → 2. Clique sur un chapitre → 3. Navigue entre Cours / Résumé / Exercices / QCM / Flashcards. Ta progression est enregistrée automatiquement.</p>`;
  },

  openFormation(id) {
    const f = FORMATIONS.find(x => x.id === id);
    if (!f) return;
    document.querySelectorAll(".side a").forEach(a => a.classList.toggle("on", a.dataset.id === id));

    const chapitres = COURS_DB.filter(c => c.formation === id).sort((a,b) => a.ordre - b.ordre);
    const list = chapitres.map(c => {
      const st = this.getProgress(c.id);
      const badge = st === "done" ? '<span class="badge done">Terminé</span>' :
                    st === "progress" ? '<span class="badge progress">En cours</span>' :
                    '<span class="badge todo">À faire</span>';
      return `
        <div class="chapitre-item" onclick="App.openCours('${c.id}')">
          <div>
            <strong>${c.titre}</strong>
            <div style="font-size:.8rem;color:var(--m)">${c.matiere}</div>
          </div>
          ${badge}
        </div>`;
    }).join("");

    const done = chapitres.filter(c => this.getProgress(c.id) === "done").length;
    const pct = chapitres.length ? Math.round(done / chapitres.length * 100) : 0;

    document.getElementById("main").innerHTML = `
      <div class="breadcrumb"><span onclick="App.goHome()">Accueil</span> › ${f.nom}</div>
      <h1>${f.icone} ${f.nom}</h1>
      <p class="lead">${chapitres.length} chapitre(s) • Progression globale : ${pct}%</p>
      <div class="progress-bar"><div style="width:${pct}%"></div></div>
      <div class="sec-title">Chapitres</div>
      ${list || "<p>Aucun chapitre pour le moment. (Architecture prête pour en ajouter des milliers via JSON)</p>"}`;
  },

  openCours(id) {
    const c = COURS_DB.find(x => x.id === id);
    if (!c) return;
    this.currentCours = c;
    this.addHistory(id);
    if (this.getProgress(id) === "todo") this.setProgress(id, "progress");

    const isFav = this.favoris.includes(id);
    const st = this.getProgress(id);

    document.getElementById("main").innerHTML = `
      <div class="breadcrumb">
        <span onclick="App.goHome()">Accueil</span> ›
        <span onclick="App.openFormation('${c.formation}')">${c.formationNom}</span> ›
        ${c.titre}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.5rem">
        <h1>${c.titre}</h1>
        <div>
          <span class="fav" onclick="App.toggleFavori('${id}')" title="Favori">${isFav ? "⭐" : "☆"}</span>
          <button class="btn btn-sec" onclick="App.markDone('${id}')">${st === "done" ? "✓ Terminé" : "Marquer terminé"}</button>
        </div>
      </div>
      <p style="color:var(--m);font-size:.88rem">${c.formationNom} • ${c.matiere}</p>

      <div class="tabs">
        <button class="on" data-tab="cours" onclick="App.showTab('cours')">Cours</button>
        <button data-tab="resume" onclick="App.showTab('resume')">Résumé</button>
        <button data-tab="exercices" onclick="App.showTab('exercices')">Exercices</button>
        <button data-tab="corriges" onclick="App.showTab('corriges')">Corrigés</button>
        <button data-tab="qcm" onclick="App.showTab('qcm')">QCM</button>
        <button data-tab="flashcards" onclick="App.showTab('flashcards')">Flashcards</button>
        <button data-tab="sources" onclick="App.showTab('sources')">Sources</button>
      </div>

      <div id="panel-cours" class="panel show">
        <h2>Cours</h2>
        ${c.cours}
        <button class="btn" onclick="App.downloadPDF()">Télécharger PDF (texte)</button>
      </div>

      <div id="panel-resume" class="panel">
        <h2>Résumé</h2>
        <ul>${(c.resume || []).map(r => `<li>${r}</li>`).join("")}</ul>
        <div class="memo"><strong>Points clés</strong><br>${(c.points_cles || []).join(" • ")}</div>
      </div>

      <div id="panel-exercices" class="panel">
        <h2>Exercices</h2>
        ${(c.exercices || []).map((e,i) => `
          <div class="exo"><strong>Exercice ${i+1}</strong><br>${e.question}</div>
        `).join("") || "<p>Aucun exercice.</p>"}
      </div>

      <div id="panel-corriges" class="panel">
        <h2>Corrigés</h2>
        ${(c.exercices || []).map((e,i) => `
          <div class="memo"><strong>Exercice ${i+1}</strong><br>${e.question}<br><em>→ ${e.correction}</em></div>
        `).join("") || "<p>Aucun corrigé.</p>"}
      </div>

      <div id="panel-qcm" class="panel">
        <h2>QCM</h2>
        <div id="qcm-area">${this.renderQCM(c)}</div>
        <button class="btn" onclick="App.checkQCM()">Vérifier les réponses</button>
      </div>

      <div id="panel-flashcards" class="panel">
        <h2>Flashcards</h2>
        <p style="font-size:.88rem;color:var(--m);margin-bottom:1rem">Clique sur une carte pour révéler la réponse.</p>
        ${(c.flashcards || []).map((f,i) => `
          <div class="flash-card" onclick="this.classList.toggle('flipped')">
            <div class="front"><strong>Q${i+1}</strong><br>${f.question}</div>
            <div class="back"><strong>Réponse</strong><br>${f.reponse}</div>
          </div>
        `).join("") || "<p>Aucune flashcard.</p>"}
      </div>

      <div id="panel-sources" class="panel">
        <h2>Sources & approfondissement</h2>
        ${(c.sources || []).length ? c.sources.map(s => `
          <div class="wiki-box"><a href="${s.url}" target="_blank" rel="noopener">${s.titre}</a></div>
        `).join("") : "<p>Aucune source externe liée.</p>"}
        <p style="margin-top:1rem;font-size:.85rem;color:var(--m)">Tu peux aussi rechercher ce sujet sur Wikiversité / Wikipédia via la barre de recherche.</p>
      </div>`;
  },

  showTab(tab) {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("show"));
    const panel = document.getElementById("panel-" + tab);
    if (panel) panel.classList.add("show");
  },

  renderQCM(c) {
    return (c.qcm || []).map((q,i) => `
      <div class="qcm-item" data-idx="${i}">
        <strong>${i+1}. ${q.question}</strong>
        <div class="choix">
          ${q.choix.map(ch => `
            <label><input type="radio" name="qcm${i}" value="${ch}"> ${ch}</label>
          `).join("")}
        </div>
        <div class="resultat" style="margin-top:.5rem;font-weight:600"></div>
      </div>
    `).join("");
  },

  checkQCM() {
    if (!this.currentCours) return;
    const qcm = this.currentCours.qcm || [];
    qcm.forEach((q,i) => {
      const item = document.querySelector(`.qcm-item[data-idx="${i}"]`);
      if (!item) return;
      const selected = item.querySelector(`input[name="qcm${i}"]:checked`);
      const res = item.querySelector(".resultat");
      if (!selected) {
        res.textContent = "Pas de réponse";
        res.style.color = "var(--m)";
      } else if (selected.value === q.reponse) {
        res.textContent = "✓ Correct";
        res.style.color = "#16a34a";
      } else {
        res.textContent = `✗ Incorrect — réponse : ${q.reponse}`;
        res.style.color = "#ef4444";
      }
    });
  },

  markDone(id) {
    this.setProgress(id, "done");
    this.openCours(id);
  },

  downloadPDF() {
    if (!this.currentCours) return;
    const c = this.currentCours;
    const text = `
${c.titre}
${c.formationNom} – ${c.matiere}

=== COURS ===
${c.cours.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim()}

=== RÉSUMÉ ===
${(c.resume || []).map(r => "• " + r).join("\n")}

=== POINTS CLÉS ===
${(c.points_cles || []).join(" • ")}

=== EXERCICES ===
${(c.exercices || []).map((e,i) => `${i+1}. ${e.question}\n   → ${e.correction}`).join("\n\n")}
`;
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = c.titre.replace(/\s+/g, "_") + ".txt";
    a.click();
  },

  showFavoris() {
    const list = this.favoris.map(id => {
      const c = COURS_DB.find(x => x.id === id);
      if (!c) return "";
      return `<div class="chapitre-item" onclick="App.openCours('${id}')"><strong>${c.titre}</strong><span>${c.formationNom}</span></div>`;
    }).join("") || "<p>Aucun favori pour le moment.</p>";
    document.getElementById("main").innerHTML = `
      <div class="breadcrumb"><span onclick="App.goHome()">Accueil</span> › Favoris</div>
      <h1>⭐ Favoris</h1>
      ${list}`;
  },

  showHistory() {
    const list = this.history.map(id => {
      const c = COURS_DB.find(x => x.id === id);
      if (!c) return "";
      return `<div class="chapitre-item" onclick="App.openCours('${id}')"><strong>${c.titre}</strong><span>${c.formationNom}</span></div>`;
    }).join("") || "<p>Aucun historique.</p>";
    document.getElementById("main").innerHTML = `
      <div class="breadcrumb"><span onclick="App.goHome()">Accueil</span> › Historique</div>
      <h1>🕐 Historique</h1>
      ${list}`;
  },

  globalSearch(q) {
    if (!q || q.length < 2) return;
    const lower = q.toLowerCase();
    const results = COURS_DB.filter(c =>
      c.titre.toLowerCase().includes(lower) ||
      c.matiere.toLowerCase().includes(lower) ||
      c.formationNom.toLowerCase().includes(lower) ||
      (c.points_cles || []).some(p => p.toLowerCase().includes(lower)) ||
      (c.resume || []).some(r => r.toLowerCase().includes(lower))
    );
    const list = results.map(c => `
      <div class="chapitre-item" onclick="App.openCours('${c.id}')">
        <div><strong>${c.titre}</strong><div style="font-size:.8rem;color:var(--m)">${c.formationNom} • ${c.matiere}</div></div>
      </div>`).join("") || "<p>Aucun résultat.</p>";
    document.getElementById("main").innerHTML = `
      <div class="breadcrumb"><span onclick="App.goHome()">Accueil</span> › Recherche</div>
      <h1>Résultats pour « ${q} »</h1>
      ${list}`;
  }
};


document.addEventListener("DOMContentLoaded", () => {
  App.init();
  document.getElementById("search-form").addEventListener("submit", e => {
    e.preventDefault();
    App.globalSearch(document.getElementById("search-input").value.trim());
  });
});
</script>
</body>
</html>
